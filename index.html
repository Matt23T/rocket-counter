<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;

    overscroll-behavior: none;
}

body {
    position: fixed;
    width: 100%;
    height: 100%;

    touch-action: pan-y;
}

.app {
    position: relative;

    width: 100%;
    height: 100dvh;

    overflow: hidden;
    background: #000;
}


/* =====================================================
   SCALA
===================================================== */

.timeline {
    position: absolute;
    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior-y: contain;

    touch-action: pan-y;

    z-index: 10;
}

.timeline::-webkit-scrollbar {
    display: none;
}

.timeline-content {
    position: relative;

    width: 100%;
    height: 2200px;
}


/* =====================================================
   LINEA CENTRALE
===================================================== */

.center-line {
    position: absolute;

    top: 0;
    left: 50%;

    width: 1px;
    height: 100%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.18);

    pointer-events: none;
}


/* =====================================================
   TACCHETTE
===================================================== */

.tick {
    position: absolute;

    left: 50%;

    width: 6px;
    height: 1px;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.20);

    pointer-events: none;
}

.tick.major {
    width: 11px;
    background: rgba(255,255,255,0.38);
}

.tick.zero {
    width: 17px;
    background: rgba(255,255,255,0.75);
}


/* =====================================================
   NUMERI SCALA
===================================================== */

.scale-label {
    position: absolute;

    left: calc(50% - 25px);

    transform: translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;
    font-weight: 500;

    opacity: 0.75;

    pointer-events: none;
}


/* =====================================================
   OBIETTIVI A SINISTRA
===================================================== */

.goals-layer {
    position: absolute;

    inset: 0;

    z-index: 40;

    pointer-events: none;

    overflow: hidden;
}

.goal {
    position: absolute;

    right: calc(50% + 31px);

    max-width: calc(50% - 42px);

    transform: translateY(-50%);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 12px;

    pointer-events: auto;

    padding: 5px 7px;

    border-radius: 8px;

    background: rgba(15,15,15,0.88);

    border: 1px solid rgba(255,255,255,0.10);
}

.goal-name {
    margin-left: 4px;
}

.goal-delete {
    margin-left: 6px;

    border: none;

    background: transparent;

    color: #777;

    font-size: 11px;

    padding: 0;
}

.goal-add {
    position: absolute;

    left: 12px;

    top: calc(
        12px +
        env(safe-area-inset-top)
    );

    width: 38px;
    height: 38px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #fff;

    font-size: 24px;

    line-height: 38px;

    z-index: 90;
}


/* =====================================================
   STORICO A DESTRA
===================================================== */

.history-layer {
    position: absolute;

    top: 70px;
    right: 8px;
    bottom: 100px;

    width: calc(50% - 22px);

    z-index: 45;

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    pointer-events: auto;
}

.history-layer::-webkit-scrollbar {
    display: none;
}

.history-item {
    position: relative;

    width: 100%;

    margin-bottom: 9px;

    padding: 7px 8px;

    border-radius: 9px;

    background: rgba(12,12,12,0.92);

    border: 1px solid rgba(255,255,255,0.08);
}

.history-route {
    font-size: 11px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.history-delta {
    margin-top: 2px;

    font-size: 11px;

    font-weight: 700;
}

.history-note {
    width: 100%;

    margin-top: 3px;

    padding: 0;

    border: none;
    outline: none;

    background: transparent;

    color: inherit;

    font-family: inherit;

    font-size: 12px;

    resize: none;
}

.history-actions {
    position: absolute;

    top: 5px;
    right: 5px;
}

.history-delete {
    border: none;

    background: transparent;

    color: #666;

    font-size: 12px;

    padding: 2px 4px;
}


/* =====================================================
   RAZZO
===================================================== */

.fixed-indicator {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 70;

    pointer-events: none;
}

.rocket {
    position: absolute;

    left: 8px;
    top: 0;

    width: 58px;
    height: 29px;

    transform: translateY(-50%);

    overflow: visible;

    transition: filter 0.2s ease;
}

.rocket-part {
    fill: #fff;

    transition: fill 0.2s ease;
}

.rocket-window {
    fill: #000;
}


/* =====================================================
   VALORE ATTUALE
===================================================== */

.current-info {
    position: absolute;

    left: 76px;
    top: 0;

    transform: translateY(-50%);

    display: flex;

    flex-direction: column;

    pointer-events: auto;
}

.current-value {
    font-size: 20px;

    line-height: 25px;

    font-weight: 700;

    white-space: nowrap;
}

.current-note {
    width: 180px;
    height: 27px;

    margin: 0;
    padding: 0;

    border: none;
    outline: none;

    background: transparent;

    color: #aaa;

    font-size: 13px;
}

.current-note::placeholder {
    color: #555;
}


/* =====================================================
   CONTROLLI
===================================================== */

.controls {
    position: absolute;

    left: 50%;

    bottom:
        calc(
            16px +
            env(safe-area-inset-bottom)
        );

    transform: translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 80;
}

.change-input {
    width: 175px;
    height: 49px;

    padding: 0 12px;

    border: 1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 17px;

    font-weight: 600;
}

.change-input::placeholder {
    color: #555;
}

.change-button {
    width: 55px;
    height: 49px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;
}


/* =====================================================
   RESET
===================================================== */

.reset-button {
    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    right: 12px;

    height: 37px;

    padding: 0 13px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}


/* =====================================================
   SCHERMATA INIZIALE
===================================================== */

.start-screen {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {
    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 700;
}

.start-subtitle {
    margin-bottom: 23px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {
    width: 220px;
    height: 54px;

    padding: 0 10px;

    border: 1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 21px;

    font-weight: 600;
}

.start-input::placeholder {
    color: #555;
}

.start-button {
    width: 220px;
    height: 49px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 700;
}

.hidden {
    display: none !important;
}

</style>

</head>


<body>

<div class="app">


    <div
        id="timeline"
        class="timeline"
    >

        <div
            id="timelineContent"
            class="timeline-content"
        >

            <div
                class="center-line"
            ></div>

            <div
                id="ticks"
            ></div>

            <div
                id="labels"
            ></div>

        </div>

    </div>


    <!-- OBIETTIVI -->

    <div
        id="goalsLayer"
        class="goals-layer"
    ></div>

    <button
        id="goalAdd"
        class="goal-add"
    >
        +
    </button>


    <!-- STORICO -->

    <div
        id="historyLayer"
        class="history-layer"
    ></div>


    <!-- RAZZO -->

    <div
        id="fixedIndicator"
        class="fixed-indicator"
    >

        <svg
            id="rocket"
            class="rocket"
            viewBox="0 0 100 50"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                class="rocket-part"
                d="
                    M8 25
                    C25 10 52 7 78 25
                    C52 43 25 40 8 25
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M65 13
                    C82 15 94 21 99 25
                    C94 29 82 35 65 37
                    Z
                "
            />

            <circle
                cx="68"
                cy="25"
                r="5"
                class="rocket-window"
            />

            <path
                class="rocket-part"
                d="
                    M39 16
                    L25 5
                    L28 20
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M39 34
                    L25 45
                    L28 30
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M12 18
                    C1 20 1 30 12 32
                    L22 25
                    Z
                "
            />

        </svg>


        <div
            class="current-info"
        >

            <div
                id="currentValue"
                class="current-value"
            >
                0 €
            </div>

            <input
                id="currentNote"
                class="current-note"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Nota per questa variazione..."
            >

        </div>

    </div>


    <!-- VARIAZIONE -->

    <div
        class="controls"
    >

        <input
            id="changeInput"
            class="change-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="+ / - variazione"
        >

        <button
            id="changeButton"
            class="change-button"
        >
            OK
        </button>

    </div>


    <!-- RESET -->

    <button
        id="resetButton"
        class="reset-button"
    >
        Reset
    </button>


    <!-- VALORE INIZIALE -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div
            class="start-title"
        >
            Rocket
        </div>

        <div
            class="start-subtitle"
        >
            Inserisci il valore iniziale
        </div>

        <input
            id="startInput"
            class="start-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Valore iniziale"
        >

        <button
            id="startButton"
            class="start-button"
        >
            OK
        </button>

    </div>

</div>


<script>

/* =====================================================
   BLOCCO ZOOM
===================================================== */

document.addEventListener(
    "gesturestart",
    function(event) {
        event.preventDefault();
    },
    { passive: false }
);

document.addEventListener(
    "gesturechange",
    function(event) {
        event.preventDefault();
    },
    { passive: false }
);

document.addEventListener(
    "gestureend",
    function(event) {
        event.preventDefault();
    },
    { passive: false }
);

document.addEventListener(
    "touchmove",
    function(event) {

        if (event.touches.length > 1) {
            event.preventDefault();
        }

    },
    { passive: false }
);


/* =====================================================
   STORAGE
===================================================== */

const START_KEY =
    "rocket_start_v6";

const CURRENT_KEY =
    "rocket_current_v6";

const HISTORY_KEY =
    "rocket_history_v6";

const GOALS_KEY =
    "rocket_goals_v6";


/* =====================================================
   ELEMENTI
===================================================== */

const timeline =
    document.getElementById("timeline");

const timelineContent =
    document.getElementById("timelineContent");

const ticks =
    document.getElementById("ticks");

const labels =
    document.getElementById("labels");

const goalsLayer =
    document.getElementById("goalsLayer");

const goalAdd =
    document.getElementById("goalAdd");

const historyLayer =
    document.getElementById("historyLayer");

const currentValueElement =
    document.getElementById("currentValue");

const currentNote =
    document.getElementById("currentNote");

const changeInput =
    document.getElementById("changeInput");

const changeButton =
    document.getElementById("changeButton");

const resetButton =
    document.getElementById("resetButton");

const startScreen =
    document.getElementById("startScreen");

const startInput =
    document.getElementById("startInput");

const startButton =
    document.getElementById("startButton");

const rocketParts =
    document.querySelectorAll(".rocket-part");

const rocket =
    document.getElementById("rocket");


/* =====================================================
   DATI
===================================================== */

let startValue =
    parseNumber(
        localStorage.getItem(START_KEY)
    );

let currentValue =
    parseNumber(
        localStorage.getItem(CURRENT_KEY)
    );

let history = [];

let goals = [];


try {

    history =
        JSON.parse(
            localStorage.getItem(HISTORY_KEY)
        ) || [];

} catch {

    history = [];
}


try {

    goals =
        JSON.parse(
            localStorage.getItem(GOALS_KEY)
        ) || [];

} catch {

    goals = [];
}


/* =====================================================
   PARAMETRI
===================================================== */

const DISPLAY_RANGE = 1100;

const STEP = 25;

const PIXELS_PER_STEP = 27;

const PIXELS_PER_EURO =
    PIXELS_PER_STEP / STEP;


/* =====================================================
   PARSE
===================================================== */

function parseNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return NaN;
    }

    let text =
        String(value).trim();

    if (!text) {
        return NaN;
    }

    text =
        text.replace(/\s/g, "");

    /*
       Permette:

       1000
       1.000
       1,5
       +500
       -500
    */

    if (
        text.includes(",")
    ) {

        text =
            text.replace(/\./g, "");

        text =
            text.replace(",", ".");

    } else {

        /*
           Se non c'è la virgola,
           il punto viene considerato
           separatore delle migliaia.
        */

        text =
            text.replace(/\./g, "");
    }

    const result =
        Number(text);

    return Number.isFinite(result)
        ? result
        : NaN;
}


/* =====================================================
   FORMATTAZIONE
===================================================== */

function formatValue(value) {

    const rounded =
        Math.round(value * 100) / 100;

    const absolute =
        Math.abs(rounded)
            .toLocaleString(
                "it-IT",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );

    if (rounded > 0) {
        return "+" + absolute + " €";
    }

    if (rounded < 0) {
        return "-" + absolute + " €";
    }

    return "0 €";
}


/* =====================================================
   COLORI
===================================================== */

function getValueColor(value) {

    if (value === 0) {
        return "#FFFFFF";
    }

    if (value > 0) {

        if (value <= 250) {
            return "#D8FFE4";
        }

        if (value <= 500) {
            return "#B8FFD0";
        }

        if (value <= 750) {
            return "#8FFFAF";
        }

        if (value <= 1000) {
            return "#62F28A";
        }

        if (value <= 2000) {
            return "#20DD65";
        }

        if (value <= 3000) {
            return "#12D75A";
        }

        if (value <= 4000) {
            return "#08C951";
        }

        return "#00A83F";
    }

    const amount =
        Math.abs(value);

    if (amount <= 250) {
        return "#FFDDE1";
    }

    if (amount <= 500) {
        return "#FFC3C9";
    }

    if (amount <= 750) {
        return "#FF9DA7";
    }

    if (amount <= 1000) {
        return "#FF6877";
    }

    if (amount <= 2000) {
        return "#F8374C";
    }

    if (amount <= 3000) {
        return "#EF2940";
    }

    if (amount <= 4000) {
        return "#E91E35";
    }

    return "#C90020";
}


/* =====================================================
   COLORE RAZZO
===================================================== */

function updateColor() {

    const color =
        getValueColor(currentValue);

    rocketParts.forEach(
        part => {
            part.style.fill = color;
        }
    );

    currentValueElement.style.color =
        color;

    rocket.style.filter =
        `drop-shadow(0 0 7px ${color})`;
}


/* =====================================================
   SCALA
===================================================== */

function buildScale() {

    ticks.innerHTML = "";
    labels.innerHTML = "";

    const totalHeight =
        DISPLAY_RANGE * 2 *
        PIXELS_PER_EURO;

    timelineContent.style.height =
        totalHeight + "px";

    const centerY =
        totalHeight / 2;

    for (
        let relative = -DISPLAY_RANGE;
        relative <= DISPLAY_RANGE;
        relative += STEP
    ) {

        const y =
            centerY -
            relative *
            PIXELS_PER_EURO;

        const tick =
            document.createElement("div");

        tick.className = "tick";

        if (
            relative % 250 === 0
        ) {
            tick.classList.add("major");
        }

        if (
            relative === 0
        ) {
            tick.classList.add("zero");
        }

        tick.style.top =
            `${y}px`;

        ticks.appendChild(tick);


        if (
            relative % 250 === 0
        ) {

            const label =
                document.createElement("div");

            label.className =
                "scale-label";

            label.style.top =
                `${y}px`;

            const value =
                currentValue +
                relative;

            label.textContent =
                formatValue(value);

            label.style.color =
                getValueColor(value);

            labels.appendChild(label);
        }
    }
}


/* =====================================================
   STORICO
===================================================== */

function drawHistory() {

    historyLayer.innerHTML = "";

    history.forEach(
        entry => {

            const item =
                document.createElement("div");

            item.className =
                "history-item";


            const color =
                getValueColor(
                    entry.to
                );

            item.style.borderColor =
                color + "55";


            const route =
                document.createElement("div");

            route.className =
                "history-route";

            route.style.color =
                color;

            route.textContent =
                `${formatValue(entry.from)} → ${formatValue(entry.to)}`;


            const delta =
                document.createElement("div");

            delta.className =
                "history-delta";

            delta.style.color =
                color;

            delta.textContent =
                `(${entry.delta >= 0 ? "+" : ""}${entry.delta.toLocaleString("it-IT")} €)`;


            const note =
                document.createElement("textarea");

            note.className =
                "history-note";

            note.rows = 1;

            note.value =
                entry.note || "";

            note.style.color =
                color;

            note.addEventListener(
                "input",
                () => {

                    entry.note =
                        note.value;

                    saveHistory();
                }
            );


            const actions =
                document.createElement("div");

            actions.className =
                "history-actions";


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "history-delete";

            deleteButton.textContent =
                "×";

            deleteButton.addEventListener(
                "click",
                () => {

                    const confirmed =
                        confirm(
                            "Eliminare questa operazione?"
                        );

                    if (!confirmed) {
                        return;
                    }

                    history =
                        history.filter(
                            item =>
                                item.id !==
                                entry.id
                        );

                    saveHistory();

                    drawHistory();
                }
            );


            actions.appendChild(
                deleteButton
            );


            item.appendChild(route);
            item.appendChild(delta);
            item.appendChild(note);
            item.appendChild(actions);

            historyLayer.appendChild(item);
        }
    );
}


/* =====================================================
   SALVA STORICO
===================================================== */

function saveHistory() {

    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history)
    );
}


/* =====================================================
   OBIETTIVI
===================================================== */

function isGoalReached(goal) {

    if (goal.target >= 0) {

        return currentValue >= goal.target;
    }

    return currentValue <= goal.target;
}


/* =====================================================
   DISEGNA OBIETTIVI
===================================================== */

function drawGoals() {

    goalsLayer.innerHTML = "";

    goals.forEach(
        goal => {

            const difference =
                goal.target -
                currentValue;


            /*
               Se l'obiettivo è oltre
               la zona di ±1100 non viene
               visualizzato.
            */

            if (
                Math.abs(difference) >
                DISPLAY_RANGE
            ) {

                return;
            }


            const goalElement =
                document.createElement("div");

            goalElement.className =
                "goal";


            const reached =
                isGoalReached(goal);


            const color =
                reached
                    ? "#65E88A"
                    : getValueColor(
                        goal.target
                    );


            goalElement.style.color =
                color;


            /*
               Posizione sulla scala.

               Se target è maggiore
               dell'attuale, va sopra.

               Se target è minore,
               va sotto.
            */

            const y =
                50 -
                (
                    difference /
                    DISPLAY_RANGE
                ) *
                50;


            goalElement.style.top =
                `${y}%`;


            const check =
                document.createElement("span");

            check.textContent =
                reached
                    ? "☑"
                    : "○";


            const name =
                document.createElement("span");

            name.className =
                "goal-name";

            name.textContent =
                `${formatValue(goal.target)} — ${goal.name}`;


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "goal-delete";

            deleteButton.textContent =
                "×";


            deleteButton.addEventListener(
                "click",
                () => {

                    goals =
                        goals.filter(
                            item =>
                                item.id !==
                                goal.id
                        );

                    saveGoals();

                    drawGoals();
                }
            );


            goalElement.appendChild(check);
            goalElement.appendChild(name);
            goalElement.appendChild(deleteButton);

            goalsLayer.appendChild(
                goalElement
            );
        }
    );
}


/* =====================================================
   SALVA OBIETTIVI
===================================================== */

function saveGoals() {

    localStorage.setItem(
        GOALS_KEY,
        JSON.stringify(goals)
    );
}


/* =====================================================
   AGGIUNGI OBIETTIVO
===================================================== */

function addGoal() {

    const targetText =
        prompt(
            "A quale cifra vuoi arrivare?\n\nEsempio: +5000 oppure -3000"
        );


    if (
        targetText === null
    ) {
        return;
    }


    const target =
        parseNumber(targetText);


    if (
        !Number.isFinite(target)
    ) {

        alert(
            "Inserisci una cifra valida."
        );

        return;
    }


    const name =
        prompt(
            "Come vuoi chiamare questo obiettivo?"
        );


    if (
        name === null ||
        name.trim() === ""
    ) {

        return;
    }


    goals.push({

        id:
            Date.now() +
            Math.random(),

        target:

            target,

        name:

            name.trim()
    });


    saveGoals();

    drawGoals();
}


/* =====================================================
   AGGIORNA NOTA TEMPORANEA
===================================================== */

function clearCurrentNote() {

    currentNote.value = "";
}


/* =====================================================
   APPLICA VARIAZIONE
===================================================== */

function applyChange() {

    const change =
        parseNumber(
            changeInput.value
        );


    if (
        !Number.isFinite(change)
    ) {

        changeInput.focus();

        return;
    }


    const from =
        currentValue;


    const to =
        currentValue +
        change;


    const noteText =
        currentNote.value.trim();


    /*
       Ogni variazione crea
       SEMPRE una nuova voce.

       Non cerchiamo un valore già
       esistente.

       Quindi posso fare:

       0 → 1000
       1000 → 500
       500 → 1000

       e avremo 3 operazioni diverse.
    */

    history.push({

        id:
            Date.now() +
            Math.random(),

        from:
            from,

        to:
            to,

        delta:
            change,

        note:
            noteText,

        date:
            Date.now()
    });


    currentValue =
        to;


    localStorage.setItem(
        CURRENT_KEY,
        String(currentValue)
    );


    saveHistory();


    changeInput.value =
        "";

    clearCurrentNote();


    updateDisplay();
}


/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi cancellare il valore iniziale, lo storico e tutti gli obiettivi?"
        );


    if (!confirmed) {
        return;
    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        HISTORY_KEY
    );

    localStorage.removeItem(
        GOALS_KEY
    );


    startValue =
        NaN;

    currentValue =
        NaN;

    history = [];

    goals = [];


    startInput.value =
        "";

    changeInput.value =
        "";

    currentNote.value =
        "";


    historyLayer.innerHTML =
        "";

    goalsLayer.innerHTML =
        "";


    startScreen.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {
            startInput.focus();
        },
        100
    );
}


/* =====================================================
   AGGIORNA DISPLAY
===================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    updateColor();

    buildScale();

    drawGoals();

    drawHistory();


    /*
       Manteniamo il razzo
       sempre perfettamente
       al centro della schermata.
    */

    requestAnimationFrame(
        () => {

            const maxScroll =
                timeline.scrollHeight -
                timeline.clientHeight;

            timeline.scrollTop =
                Math.max(
                    0,
                    maxScroll / 2
                );
        }
    );
}


/* =====================================================
   IMPOSTA VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const value =
        parseNumber(
            startInput.value
        );


    if (
        !Number.isFinite(value)
    ) {

        startInput.focus();

        return;
    }


    startValue =
        value;

    currentValue =
        value;

    history = [];

    goals = [];


    localStorage.setItem(
        START_KEY,
        String(startValue)
    );

    localStorage.setItem(
        CURRENT_KEY,
        String(currentValue)
    );

    saveHistory();

    saveGoals();


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();
}


/* =====================================================
   EVENTI
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();
        }
    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();
        }
    }
);


goalAdd.addEventListener(
    "click",
    addGoal
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =====================================================
   AVVIO
===================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;
    }


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

} else {

    startScreen.classList.remove(
        "hidden"
    );
}

</script>
