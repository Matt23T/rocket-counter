<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Rocket</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;
}

body {
    position: fixed;
    inset: 0;
    touch-action: manipulation;
}

button,
input,
textarea {
    font: inherit;
}


/* =====================================================
   APP
===================================================== */

.app {
    position: relative;

    width: 100%;
    height: 100dvh;

    overflow: hidden;

    background: #000;
}


/* =====================================================
   SCALA CENTRALE
===================================================== */

.scale {
    position: absolute;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 5;
}

.center-line {
    position: absolute;

    left: 50%;
    top: 0;

    width: 1px;
    height: 100%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.22);
}


/* =====================================================
   NUMERI DELLA SCALA
===================================================== */

.scale-number {
    position: absolute;

    left: calc(50% - 18px);

    transform: translate(-100%, -50%);

    font-size: 10px;
    line-height: 12px;

    white-space: nowrap;

    opacity: .78;

    pointer-events: none;
}


/* =====================================================
   TACCHETTE
===================================================== */

.scale-tick {
    position: absolute;

    left: 50%;

    width: 7px;
    height: 1px;

    transform: translateX(-50%);

    background: rgba(255,255,255,.18);
}

.scale-tick.major {
    width: 11px;

    background: rgba(255,255,255,.35);
}

.scale-tick.zero {
    width: 17px;

    background: rgba(255,255,255,.65);
}


/* =====================================================
   INDICATORE CENTRALE
===================================================== */

.indicator {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 50;

    pointer-events: none;
}


/* =====================================================
   RAZZO
   SEMPRE A SINISTRA DELLA LINEA
===================================================== */

.rocket {
    position: absolute;

    left: -72px;
    top: 0;

    width: 58px;
    height: 30px;

    transform: translateY(-50%);

    overflow: visible;

    pointer-events: none;

    transition:
        filter .2s ease;
}

.rocket-part {
    transition:
        fill .2s ease;
}


/* =====================================================
   VALORE ATTUALE
   A DESTRA DELLA LINEA
===================================================== */

.current {
    position: absolute;

    left: 9px;
    top: 0;

    transform: translateY(-50%);

    display: flex;
    flex-direction: column;

    pointer-events: auto;
}

.current-value {
    font-size: 21px;
    line-height: 25px;

    font-weight: 750;

    white-space: nowrap;
}

.current-note {
    width: 190px;
    height: 27px;

    padding: 0;
    margin: 0;

    border: 0;
    outline: 0;

    background: transparent;

    color: #aaa;

    font-size: 13px;
}

.current-note::placeholder {
    color: #555;
}


/* =====================================================
   STORICO
   TUTTE LE NOTE RESTANO DISPONIBILI
===================================================== */

.history {
    position: absolute;

    top:
        calc(
            62px +
            env(safe-area-inset-top)
        );

    right: 8px;

    width: calc(50% - 20px);

    bottom:
        calc(
            85px +
            env(safe-area-inset-bottom)
        );

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    z-index: 40;
}

.history::-webkit-scrollbar {
    display: none;
}

.history-item {
    position: relative;

    width: 100%;

    margin-bottom: 9px;

    padding: 7px 8px;

    border-radius: 9px;

    background: rgba(12,12,12,.94);

    border: 1px solid rgba(255,255,255,.08);
}

.history-route {
    font-size: 11px;

    font-weight: 700;

    line-height: 14px;
}

.history-delta {
    margin-top: 2px;

    font-size: 11px;

    font-weight: 700;
}

.history-note {
    display: block;

    width: 100%;

    margin-top: 3px;

    padding: 0;

    border: 0;
    outline: 0;

    resize: none;

    overflow: hidden;

    background: transparent;

    font-size: 12px;

    line-height: 15px;
}

.delete-history {
    position: absolute;

    top: 4px;
    right: 4px;

    width: 22px;
    height: 22px;

    padding: 0;

    border: 0;

    background: transparent;

    color: #666;

    font-size: 14px;
}


/* =====================================================
   OBIETTIVI
===================================================== */

.goals {
    position: absolute;

    inset: 0;

    z-index: 35;

    pointer-events: none;

    overflow: hidden;
}

.goal {
    position: absolute;

    right: calc(50% + 34px);

    max-width: calc(50% - 45px);

    transform: translateY(-50%);

    padding: 5px 7px;

    border-radius: 8px;

    background: rgba(10,10,10,.92);

    border: 1px solid rgba(255,255,255,.10);

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    pointer-events: auto;
}

.goal-delete {
    margin-left: 6px;

    border: 0;

    background: transparent;

    color: #666;

    padding: 0;

    font-size: 11px;
}

.add-goal {
    position: absolute;

    left: 12px;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    width: 38px;
    height: 38px;

    border: 0;

    border-radius: 11px;

    background: #181818;

    color: #fff;

    font-size: 24px;

    z-index: 80;
}


/* =====================================================
   CONTROLLI
===================================================== */

.controls {
    position: absolute;

    left: 50%;

    bottom:
        calc(
            14px +
            env(safe-area-inset-bottom)
        );

    transform: translateX(-50%);

    display: flex;

    gap: 8px;

    z-index: 80;
}

.change-input {
    width: 170px;
    height: 48px;

    padding: 0 12px;

    border: 1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    font-size: 17px;

    text-align: center;

    -webkit-appearance: none;
    appearance: none;
}

.change-input::placeholder {
    color: #555;
}

.change-button {
    width: 55px;
    height: 48px;

    border: 0;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-weight: 700;
}


/* =====================================================
   RESET
===================================================== */

.reset {
    position: absolute;

    right: 12px;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    height: 37px;

    padding: 0 13px;

    border: 0;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 80;
}


/* =====================================================
   SCHERMATA INIZIALE
===================================================== */

.start-screen {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    background: #000;
}

.start-title {
    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 750;
}

.start-subtitle {
    margin-bottom: 22px;

    color: #777;

    font-size: 14px;
}

.start-input {
    width: 220px;
    height: 54px;

    border: 1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    font-size: 21px;

    text-align: center;
}

.start-button {
    width: 220px;
    height: 49px;

    margin-top: 15px;

    border: 0;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-weight: 700;
}

.hidden {
    display: none !important;
}

</style>
</head>


<body>

<div class="app">


    <!-- SCALA -->

    <div class="scale">

        <div class="center-line"></div>

        <div id="scaleNumbers"></div>
        <div id="scaleTicks"></div>

    </div>


    <!-- OBIETTIVI -->

    <div
        id="goals"
        class="goals"
    ></div>

    <button
        id="addGoal"
        class="add-goal"
    >+</button>


    <!-- STORICO -->

    <div
        id="history"
        class="history"
    ></div>


    <!-- RAZZO + VALORE -->

    <div
        id="indicator"
        class="indicator"
    >

        <svg
            id="rocket"
            class="rocket"
            viewBox="0 0 100 50"
        >

            <path
                class="rocket-part"
                d="
                    M8 25
                    C25 10 52 7 78 25
                    C52 43 25 40 8 25
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M65 13
                    C82 15 94 21 99 25
                    C94 29 82 35 65 37
                    Z
                "
            />

            <circle
                cx="68"
                cy="25"
                r="5"
                fill="#000"
            />

            <path
                class="rocket-part"
                d="
                    M39 16
                    L25 5
                    L28 20
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M39 34
                    L25 45
                    L28 30
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M12 18
                    C1 20 1 30 12 32
                    L22 25
                    Z
                "
            />

        </svg>


        <div class="current">

            <div
                id="currentValue"
                class="current-value"
            ></div>

            <input
                id="currentNote"
                class="current-note"
                type="text"
                placeholder="Nota..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
            >

        </div>

    </div>


    <!-- VARIAZIONE -->

    <div class="controls">

        <input
            id="changeInput"
            class="change-input"
            type="text"
            inputmode="text"
            placeholder="+ / - variazione"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >

        <button
            id="changeButton"
            class="change-button"
        >
            OK
        </button>

    </div>


    <!-- RESET -->

    <button
        id="reset"
        class="reset"
    >
        Reset
    </button>


    <!-- VALORE INIZIALE -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div class="start-title">
            Rocket
        </div>

        <div class="start-subtitle">
            Inserisci il valore iniziale
        </div>

        <input
            id="startInput"
            class="start-input"
            type="text"
            inputmode="text"
            placeholder="Valore iniziale"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >

        <button
            id="startButton"
            class="start-button"
        >
            OK
        </button>

    </div>

</div>


<script>

/* =====================================================
   ELEMENTI
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const startInput =
    document.getElementById("startInput");

const startButton =
    document.getElementById("startButton");

const currentValueElement =
    document.getElementById("currentValue");

const currentNote =
    document.getElementById("currentNote");

const changeInput =
    document.getElementById("changeInput");

const changeButton =
    document.getElementById("changeButton");

const resetButton =
    document.getElementById("reset");

const scaleNumbers =
    document.getElementById("scaleNumbers");

const scaleTicks =
    document.getElementById("scaleTicks");

const historyElement =
    document.getElementById("history");

const goalsElement =
    document.getElementById("goals");

const addGoalButton =
    document.getElementById("addGoal");

const rocketParts =
    document.querySelectorAll(".rocket-part");

const rocket =
    document.getElementById("rocket");


/* =====================================================
   STORAGE
===================================================== */

const STORAGE = {
    start: "rocket_start_final",
    current: "rocket_current_final",
    history: "rocket_history_final",
    goals: "rocket_goals_final"
};


/* =====================================================
   STATO
===================================================== */

let startValue =
    readNumber(
        localStorage.getItem(
            STORAGE.start
        )
    );

let currentValue =
    readNumber(
        localStorage.getItem(
            STORAGE.current
        )
    );

let history = [];

let goals = [];


try {
    history =
        JSON.parse(
            localStorage.getItem(
                STORAGE.history
            )
        ) || [];
} catch {
    history = [];
}


try {
    goals =
        JSON.parse(
            localStorage.getItem(
                STORAGE.goals
            )
        ) || [];
} catch {
    goals = [];
}


/* =====================================================
   PARAMETRI VISIVI
===================================================== */

/*
   25 € = una tacca.

   1000 € = 40 tacche.

   Lo spazio visibile è quindi
   sempre da current - 1000
   a current + 1000.
*/

const VISIBLE_RANGE = 1000;

const TICK_STEP = 25;

const PIXELS_PER_25 =
    28;

const PIXELS_PER_EURO =
    PIXELS_PER_25 / TICK_STEP;


/* =====================================================
   NUMERI
===================================================== */

function readNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return NaN;
    }

    let text =
        String(value).trim();

    if (!text) {
        return NaN;
    }

    text =
        text.replace(/\s/g, "");

    /*
       Supporto:

       1300
       +1300
       -1300
       1.300
       -1.300
       1300,50
       -1300,50
    */

    if (
        text.includes(",")
    ) {

        text =
            text.replace(
                /\./g,
                ""
            );

        text =
            text.replace(
                ",",
                "."
            );

    } else {

        /*
           Se il punto è usato
           come separatore delle migliaia.
        */

        text =
            text.replace(
                /^([+-]?\d+)\.(\d{3})$/,
                "$1$2"
            );
    }

    const number =
        Number(text);

    return Number.isFinite(number)
        ? number
        : NaN;
}


/* =====================================================
   FORMATTA VALORE
===================================================== */

function formatValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;

    const absolute =
        Math.abs(rounded)
            .toLocaleString(
                "it-IT",
                {
                    maximumFractionDigits: 2
                }
            );

    if (rounded > 0) {
        return "+" + absolute + " €";
    }

    if (rounded < 0) {
        return "-" + absolute + " €";
    }

    return "0 €";
}


/* =====================================================
   COLORE
===================================================== */

function getColor(value) {

    if (value === 0) {
        return "#FFFFFF";
    }


    /*
       VERDE

       Ogni 250 € cambia nettamente.
    */

    if (value > 0) {

        if (value <= 250)
            return "#D9FFE5";

        if (value <= 500)
            return "#A8FFBF";

        if (value <= 750)
            return "#70F995";

        if (value <= 1000)
            return "#38EA6A";

        if (value <= 2000)
            return "#19D957";

        if (value <= 3000)
            return "#0DCC4B";

        if (value <= 4000)
            return "#08BB42";

        return "#00A83B";
    }


    /*
       ROSSO
    */

    const amount =
        Math.abs(value);

    if (amount <= 250)
        return "#FFDDE2";

    if (amount <= 500)
        return "#FFB9C2";

    if (amount <= 750)
        return "#FF8A98";

    if (amount <= 1000)
        return "#FF596B";

    if (amount <= 2000)
        return "#F52F45";

    if (amount <= 3000)
        return "#E91E38";

    if (amount <= 4000)
        return "#DA1730";

    return "#C90020";
}


/* =====================================================
   AGGIORNA COLORE
===================================================== */

function updateColor() {

    const color =
        getColor(
            currentValue
        );


    currentValueElement.style.color =
        color;


    rocketParts.forEach(
        part => {

            part.style.fill =
                color;
        }
    );


    rocket.style.filter =
        `drop-shadow(0 0 7px ${color})`;
}


/* =====================================================
   SCALA
===================================================== */

function drawScale() {

    scaleNumbers.innerHTML =
        "";

    scaleTicks.innerHTML =
        "";


    /*
       ATTENZIONE:

       Qui la posizione è calcolata
       direttamente dalla differenza
       numerica.

       Se value > currentValue:
           sale.

       Se value < currentValue:
           scende.

       Nessun valore assoluto.
       Nessuna logica speciale
       per i negativi.
    */

    for (
        let difference =
            -VISIBLE_RANGE;

        difference <=
            VISIBLE_RANGE;

        difference +=
            TICK_STEP
    ) {

        const value =
            currentValue +
            difference;


        const y =
            window.innerHeight / 2
            -
            difference *
            PIXELS_PER_EURO;


        const tick =
            document.createElement(
                "div"
            );

        tick.className =
            "scale-tick";


        if (
            value % 250 === 0
        ) {
            tick.classList.add(
                "major"
            );
        }


        if (
            value === 0
        ) {
            tick.classList.add(
                "zero"
            );
        }


        tick.style.top =
            y + "px";


        scaleTicks.appendChild(
            tick
        );


        if (
            value % 250 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "scale-number";


            label.style.top =
                y + "px";


            label.textContent =
                formatValue(
                    value
                );


            label.style.color =
                getColor(
                    value
                );


            scaleNumbers.appendChild(
                label
            );
        }
    }
}


/* =====================================================
   STORICO
===================================================== */

function saveHistory() {

    localStorage.setItem(
        STORAGE.history,
        JSON.stringify(history)
    );
}


function drawHistory() {

    historyElement.innerHTML =
        "";


    /*
       IMPORTANTE:

       L'ordine è quello cronologico
       in cui sono state effettuate
       le variazioni.

       Non ordiniamo mai per valore.
    */

    history.forEach(
        entry => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-item";


            const color =
                getColor(
                    entry.to
                );


            item.style.borderColor =
                color + "55";


            const route =
                document.createElement(
                    "div"
                );

            route.className =
                "history-route";

            route.style.color =
                color;

            route.textContent =
                `${formatValue(entry.from)} → ${formatValue(entry.to)}`;


            const delta =
                document.createElement(
                    "div"
                );

            delta.className =
                "history-delta";

            delta.style.color =
                color;

            delta.textContent =
                `(${entry.delta >= 0 ? "+" : ""}${entry.delta.toLocaleString("it-IT")} €)`;


            const note =
                document.createElement(
                    "textarea"
                );

            note.className =
                "history-note";

            note.rows =
                1;

            note.value =
                entry.note || "";

            note.style.color =
                color;


            note.addEventListener(
                "input",
                () => {

                    entry.note =
                        note.value;

                    saveHistory();

                    autoSize(
                        note
                    );
                }
            );


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete-history";

            deleteButton.textContent =
                "×";


            deleteButton.addEventListener(
                "click",
                () => {

                    history =
                        history.filter(
                            item =>
                                item.id !==
                                entry.id
                        );

                    saveHistory();

                    drawHistory();
                }
            );


            item.appendChild(
                route
            );

            item.appendChild(
                delta
            );

            item.appendChild(
                note
            );

            item.appendChild(
                deleteButton
            );


            historyElement.appendChild(
                item
            );


            autoSize(
                note
            );
        }
    );
}


/* =====================================================
   AUTO SIZE NOTE
===================================================== */

function autoSize(element) {

    element.style.height =
        "auto";

    element.style.height =
        element.scrollHeight +
        "px";
}


/* =====================================================
   OBIETTIVI
===================================================== */

function saveGoals() {

    localStorage.setItem(
        STORAGE.goals,
        JSON.stringify(goals)
    );
}


function goalReached(goal) {

    /*
       Per un obiettivo positivo:

       current >= target

       Per un obiettivo negativo:

       current <= target

       Esempio:
       obiettivo -3000
       raggiunto a -3000, -3500, -4000...
    */

    if (
        goal.target >= 0
    ) {
        return currentValue >=
            goal.target;
    }

    return currentValue <=
        goal.target;
}


function drawGoals() {

    goalsElement.innerHTML =
        "";


    goals.forEach(
        goal => {

            /*
               DIFFERENZA NUMERICA.

               Nessun valore assoluto
               per stabilire sopra/sotto.
            */

            const difference =
                goal.target -
                currentValue;


            /*
               Se l'obiettivo è fuori
               dalla finestra ±1000
               non viene mostrato.
            */

            if (
                difference <
                    -VISIBLE_RANGE ||
                difference >
                    VISIBLE_RANGE
            ) {
                return;
            }


            const y =
                window.innerHeight / 2
                -
                difference *
                PIXELS_PER_EURO;


            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "goal";

            element.style.top =
                y + "px";


            const reached =
                goalReached(
                    goal
                );


            const color =
                reached
                    ? "#65E88A"
                    : getColor(
                        goal.target
                    );


            element.style.color =
                color;


            element.innerHTML =
                `
                <span>
                    ${reached ? "☑" : "○"}
                    ${escapeHtml(goal.name)}
                    — ${formatValue(goal.target)}
                </span>
                `;


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "goal-delete";

            deleteButton.textContent =
                "×";


            deleteButton.addEventListener(
                "click",
                () => {

                    goals =
                        goals.filter(
                            item =>
                                item.id !==
                                goal.id
                        );

                    saveGoals();

                    drawGoals();
                }
            );


            element.appendChild(
                deleteButton
            );


            goalsElement.appendChild(
                element
            );
        }
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   AGGIUNGI OBIETTIVO
===================================================== */

function addGoal() {

    const targetText =
        prompt(
            "Inserisci la cifra dell'obiettivo:"
        );


    if (
        targetText === null
    ) {
        return;
    }


    const target =
        readNumber(
            targetText
        );


    if (
        !Number.isFinite(target)
    ) {

        alert(
            "Cifra non valida."
        );

        return;
    }


    const name =
        prompt(
            "Inserisci il nome dell'obiettivo:"
        );


    if (
        name === null ||
        name.trim() === ""
    ) {
        return;
    }


    goals.push({

        id:
            Date.now() +
            Math.random(),

        target:
            target,

        name:
            name.trim()
    });


    saveGoals();

    drawGoals();
}


/* =====================================================
   OPERAZIONE
===================================================== */

function applyChange() {

    const delta =
        readNumber(
            changeInput.value
        );


    if (
        !Number.isFinite(delta)
    ) {

        changeInput.focus();

        return;
    }


    /*
       QUESTA È LA REGOLA FONDAMENTALE:

       nuovo valore =
       vecchio valore + variazione

       Non sostituiamo mai il valore.
    */

    const from =
        currentValue;


    const to =
        from +
        delta;


    const note =
        currentNote.value.trim();


    history.push({

        id:
            Date.now() +
            Math.random(),

        from:
            from,

        to:
            to,

        delta:
            delta,

        note:
            note,

        date:
            Date.now()
    });


    currentValue =
        to;


    localStorage.setItem(
        STORAGE.current,
        String(currentValue)
    );


    saveHistory();


    changeInput.value =
        "";

    currentNote.value =
        "";


    updateScreen();
}


/* =====================================================
   VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const value =
        readNumber(
            startInput.value
        );


    if (
        !Number.isFinite(value)
    ) {

        startInput.focus();

        return;
    }


    startValue =
        value;

    currentValue =
        value;


    history = [];

    goals = [];


    localStorage.setItem(
        STORAGE.start,
        String(startValue)
    );

    localStorage.setItem(
        STORAGE.current,
        String(currentValue)
    );

    saveHistory();

    saveGoals();


    startScreen.classList.add(
        "hidden"
    );


    updateScreen();
}


/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmReset =
        confirm(
            "Vuoi ripartire dall'inizio?"
        );


    if (!confirmReset) {
        return;
    }


    localStorage.removeItem(
        STORAGE.start
    );

    localStorage.removeItem(
        STORAGE.current
    );

    localStorage.removeItem(
        STORAGE.history
    );

    localStorage.removeItem(
        STORAGE.goals
    );


    startValue =
        NaN;

    currentValue =
        NaN;

    history = [];

    goals = [];


    historyElement.innerHTML =
        "";

    goalsElement.innerHTML =
        "";

    currentNote.value =
        "";

    changeInput.value =
        "";

    startInput.value =
        "";


    startScreen.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {
            startInput.focus();
        },
        100
    );
}


/* =====================================================
   AGGIORNA TUTTO
===================================================== */

function updateScreen() {

    /*
       Il razzo NON viene spostato.

       È fisso al centro.

       La scala viene ridisegnata
       intorno al valore attuale.
    */

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    updateColor();

    drawScale();

    drawGoals();

    drawHistory();
}


/* =====================================================
   EVENTI
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {
            setInitialValue();
        }
    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {
            applyChange();
        }
    }
);


addGoalButton.addEventListener(
    "click",
    addGoal
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =====================================================
   BLOCCO ZOOM IPHONE
===================================================== */

document.addEventListener(
    "gesturestart",
    event => {
        event.preventDefault();
    },
    { passive: false }
);

document.addEventListener(
    "gesturechange",
    event => {
        event.preventDefault();
    },
    { passive: false }
);

document.addEventListener(
    "gestureend",
    event => {
        event.preventDefault();
    },
    { passive: false }
);

document.addEventListener(
    "touchmove",
    event => {

        if (
            event.touches.length > 1
        ) {
            event.preventDefault();
        }
    },
    { passive: false }
);


/* =====================================================
   AVVIO
===================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {
        currentValue =
            startValue;
    }


    startScreen.classList.add(
        "hidden"
    );


    updateScreen();

} else {

    startScreen.classList.remove(
        "hidden"
    );
}

</script>
