<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;

    overscroll-behavior: none;
}

body {
    position: fixed;

    width: 100%;
    height: 100%;

    touch-action: pan-y;
}

.app {
    position: relative;

    width: 100%;
    height: 100dvh;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   SCALA
===================================================== */

.timeline {

    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;

    overscroll-behavior-y: contain;

    z-index: 10;

    touch-action: pan-y;
}

.timeline::-webkit-scrollbar {
    display: none;
}

.timeline-content {

    position: relative;

    width: 100%;

    height: 2400px;
}


/* =====================================================
   LINEA CENTRALE
===================================================== */

.center-line {

    position: absolute;

    top: 0;
    left: 50%;

    width: 1px;
    height: 100%;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.18);

    pointer-events: none;
}


/* =====================================================
   TACCHETTE
===================================================== */

.tick {

    position: absolute;

    left: 50%;

    width: 6px;
    height: 1px;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.20);

    pointer-events: none;
}

.tick.major {

    width: 11px;

    background:
        rgba(255,255,255,0.35);
}

.tick.zero {

    width: 17px;

    background:
        rgba(255,255,255,0.75);
}


/* =====================================================
   NUMERI SCALA
===================================================== */

.scale-label {

    position: absolute;

    left: calc(50% - 25px);

    transform:
        translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;

    font-weight: 500;

    opacity: 0.65;

    pointer-events: none;
}


/* =====================================================
   STORICO NOTE A DESTRA
===================================================== */

.history-layer {

    position: absolute;

    top: 50%;

    right: 10px;

    width: calc(50% - 45px);

    max-height: 58vh;

    transform:
        translateY(-50%);

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    z-index: 50;

    pointer-events: auto;

    -webkit-overflow-scrolling: touch;
}

.history-layer::-webkit-scrollbar {
    display: none;
}


/* =====================================================
   SINGOLO EVENTO STORICO
===================================================== */

.history-item {

    width: 100%;

    margin-bottom: 14px;

    padding-bottom: 10px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

    font-size: 12px;

    line-height: 17px;

    word-break: break-word;

    user-select: none;

    -webkit-user-select: none;
}

.history-value {

    display: inline-block;

    margin-right: 5px;

    font-weight: 700;
}

.history-text {

    opacity: 0.90;
}

.history-delete {

    float: right;

    width: 19px;
    height: 19px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background: #1b1b1b;

    color: #777;

    font-size: 11px;

    line-height: 19px;

    text-align: center;
}

.history-delete:active {

    transform:
        scale(0.9);
}


/* =====================================================
   RAZZO CENTRALE
===================================================== */

.fixed-indicator {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 70;

    pointer-events: none;
}

.rocket {

    position: absolute;

    right: 8px;
    top: 0;

    width: 58px;
    height: 29px;

    transform:
        translate(0, -50%);

    overflow: visible;

    transition:
        filter 0.2s ease;
}

.rocket-part {

    fill: #fff;

    transition:
        fill 0.2s ease;
}

.rocket-window {

    fill: #000;
}


/* =====================================================
   VALORE ATTUALE
===================================================== */

.current-info {

    position: absolute;

    left: 76px;
    top: 0;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    pointer-events: auto;
}

.current-value {

    font-size: 20px;

    line-height: 25px;

    font-weight: 700;

    white-space: nowrap;

    transition:
        color 0.2s ease;
}


/* =====================================================
   NOTA DEL VALORE ATTUALE
===================================================== */

.current-note {

    width: 180px;
    height: 27px;

    margin: 0;
    padding: 0;

    border: none;

    outline: none;

    background: transparent;

    color: #aaa;

    font-size: 13px;

    touch-action: auto;
}

.current-note::placeholder {

    color: #555;
}


/* =====================================================
   CONTROLLI
===================================================== */

.controls {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            16px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 80;
}

.change-input {

    width: 175px;
    height: 49px;

    padding: 0 12px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 17px;

    font-weight: 600;
}

.change-input::placeholder {

    color: #555;
}

.change-button {

    width: 55px;
    height: 49px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;
}

.change-button:active {

    transform:
        scale(0.96);
}


/* =====================================================
   RESET
===================================================== */

.reset-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    right: 12px;

    height: 37px;

    padding: 0 13px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}


/* =====================================================
   SCHERMATA INIZIALE
===================================================== */

.start-screen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {

    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 700;
}

.start-subtitle {

    margin-bottom: 23px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {

    width: 220px;
    height: 54px;

    padding: 0 10px;

    border:
        1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 21px;

    font-weight: 600;
}

.start-input::placeholder {

    color: #555;
}

.start-button {

    width: 220px;
    height: 49px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 700;
}

.hidden {

    display: none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    .rocket {

        width: 56px;
        height: 28px;
    }

    .current-info {

        left: 76px;
    }

    .current-value {

        font-size: 19px;
    }

    .current-note {

        width: 165px;
    }

    .history-layer {

        right: 7px;

        width: calc(50% - 40px);
    }

    .history-item {

        font-size: 11px;

        line-height: 16px;
    }

}

</style>

</head>


<body>

<div class="app">


    <!-- =================================================
         SCALA
    ================================================= -->

    <div
        id="timeline"
        class="timeline"
    >

        <div
            id="timelineContent"
            class="timeline-content"
        >

            <div
                class="center-line"
            ></div>

            <div
                id="ticks"
            ></div>

            <div
                id="labels"
            ></div>

        </div>

    </div>


    <!-- =================================================
         STORICO NOTE
    ================================================= -->

    <div
        id="historyLayer"
        class="history-layer"
    ></div>


    <!-- =================================================
         RAZZO
    ================================================= -->

    <div
        id="fixedIndicator"
        class="fixed-indicator"
    >

        <svg
            id="rocket"
            class="rocket"
            viewBox="0 0 100 50"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                class="rocket-part"
                d="
                    M8 25
                    C25 10 52 7 78 25
                    C52 43 25 40 8 25
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M65 13
                    C82 15 94 21 99 25
                    C94 29 82 35 65 37
                    Z
                "
            />

            <circle
                cx="68"
                cy="25"
                r="5"
                class="rocket-window"
            />

            <path
                class="rocket-part"
                d="
                    M39 16
                    L25 5
                    L28 20
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M39 34
                    L25 45
                    L28 30
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M12 18
                    C1 20 1 30 12 32
                    L22 25
                    Z
                "
            />

        </svg>


        <div
            class="current-info"
        >

            <div
                id="currentValue"
                class="current-value"
            >
                0 €
            </div>

            <input
                id="currentNote"
                class="current-note"
                type="text"
                maxlength="100"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Nota..."
            >

        </div>

    </div>


    <!-- =================================================
         VARIAZIONE
    ================================================= -->

    <div
        class="controls"
    >

        <input
            id="changeInput"
            class="change-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="+ / - variazione"
        >

        <button
            id="changeButton"
            class="change-button"
        >
            OK
        </button>

    </div>


    <!-- =================================================
         RESET
    ================================================= -->

    <button
        id="resetButton"
        class="reset-button"
    >
        Reset
    </button>


    <!-- =================================================
         SCHERMATA INIZIALE
    ================================================= -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div
            class="start-title"
        >
            Rocket
        </div>

        <div
            class="start-subtitle"
        >
            Inserisci il valore iniziale
        </div>

        <input
            id="startInput"
            class="start-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Valore iniziale"
        >

        <button
            id="startButton"
            class="start-button"
        >
            OK
        </button>

    </div>

</div>


<script>

/* =====================================================
   BLOCCO ZOOM
===================================================== */

document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturechange",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gestureend",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "touchmove",
    function(event) {

        if (
            event.touches.length > 1
        ) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);


/* =====================================================
   STORAGE
===================================================== */

const START_KEY =
    "rocket_start_value_v7";

const CURRENT_KEY =
    "rocket_current_value_v7";

const HISTORY_KEY =
    "rocket_history_v7";


/* =====================================================
   ELEMENTI
===================================================== */

const timeline =
    document.getElementById(
        "timeline"
    );

const timelineContent =
    document.getElementById(
        "timelineContent"
    );

const ticks =
    document.getElementById(
        "ticks"
    );

const labels =
    document.getElementById(
        "labels"
    );

const historyLayer =
    document.getElementById(
        "historyLayer"
    );

const currentValueElement =
    document.getElementById(
        "currentValue"
    );

const currentNote =
    document.getElementById(
        "currentNote"
    );

const changeInput =
    document.getElementById(
        "changeInput"
    );

const changeButton =
    document.getElementById(
        "changeButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startInput =
    document.getElementById(
        "startInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const rocketParts =
    document.querySelectorAll(
        ".rocket-part"
    );

const rocket =
    document.getElementById(
        "rocket"
    );


/* =====================================================
   PARAMETRI SCALA
===================================================== */

const DISPLAY_RANGE =
    1100;

const STEP =
    25;

const PIXELS_PER_STEP =
    27;

const PIXELS_PER_EURO =
    PIXELS_PER_STEP /
    STEP;


/* =====================================================
   CONVERSIONE NUMERI
===================================================== */

function parseNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return NaN;
    }

    let text =
        String(value).trim();

    if (
        text === ""
    ) {

        return NaN;
    }

    text =
        text.replace(
            /\s/g,
            ""
        );

    text =
        text.replace(
            /\./g,
            ""
        );

    text =
        text.replace(
            ",",
            "."
        );

    const number =
        Number(text);

    return Number.isFinite(number)
        ? number
        : NaN;
}


/* =====================================================
   FORMATTAZIONE VALORE
===================================================== */

function formatValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;

    const absolute =
        Math.abs(rounded)
            .toLocaleString(
                "it-IT",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );

    if (
        rounded > 0
    ) {

        return "+" +
            absolute +
            " €";
    }

    if (
        rounded < 0
    ) {

        return "-" +
            absolute +
            " €";
    }

    return "0 €";
}


/* =====================================================
   COLORI
===================================================== */

function getValueColor(value) {

    if (
        value === 0
    ) {

        return "#FFFFFF";
    }


    /* ==============================
       VERDE
    ============================== */

    if (
        value > 0
    ) {

        if (
            value <= 1000
        ) {

            return "#B8FFD0";
        }

        if (
            value <= 2000
        ) {

            return "#62F28A";
        }

        if (
            value <= 3000
        ) {

            return "#20DD65";
        }

        if (
            value <= 4000
        ) {

            return "#08C951";
        }

        return "#00A83F";
    }


    /* ==============================
       ROSSO
    ============================== */

    const amount =
        Math.abs(value);

    if (
        amount <= 1000
    ) {

        return "#FFB9C0";
    }

    if (
        amount <= 2000
    ) {

        return "#FF6877";
    }

    if (
        amount <= 3000
    ) {

        return "#F8374C";
    }

    if (
        amount <= 4000
    ) {

        return "#E91E35";
    }

    return "#C90020";
}


/* =====================================================
   COLORE RAZZO
===================================================== */

function updateColor() {

    const color =
        getValueColor(
            currentValue
        );


    rocketParts.forEach(
        part => {

            part.style.fill =
                color;
        }
    );


    currentValueElement.style.color =
        color;


    rocket.style.filter =
        `drop-shadow(
            0 0 7px ${color}
        )`;
}


/* =====================================================
   CREA SCALA
===================================================== */

function buildScale() {

    ticks.innerHTML =
        "";

    labels.innerHTML =
        "";


    const totalHeight =
        (
            DISPLAY_RANGE * 2
        ) *
        PIXELS_PER_EURO;


    timelineContent.style.height =
        totalHeight + "px";


    const centerY =
        totalHeight / 2;


    for (
        let relativeValue = -DISPLAY_RANGE;

        relativeValue <= DISPLAY_RANGE;

        relativeValue += STEP
    ) {

        const y =
            centerY -
            (
                relativeValue *
                PIXELS_PER_EURO
            );


        const tick =
            document.createElement(
                "div"
            );

        tick.className =
            "tick";


        if (
            relativeValue % 250 === 0
        ) {

            tick.classList.add(
                "major"
            );
        }


        if (
            relativeValue === 0
        ) {

            tick.classList.add(
                "zero"
            );
        }


        tick.style.top =
            `${y}px`;


        ticks.appendChild(
            tick
        );


        /*
           La scala rappresenta
           sempre valori REALI.

           Quindi:

           valore attuale + posizione
        */

        if (
            relativeValue % 250 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "scale-label";

            label.style.top =
                `${y}px`;


            const scaleValue =
                currentValue +
                relativeValue;


            label.textContent =
                formatValue(
                    scaleValue
                );


            label.style.color =
                getValueColor(
                    scaleValue
                );


            labels.appendChild(
                label
            );
        }
    }
}


/* =====================================================
   DISEGNA STORICO
===================================================== */

/*
   IMPORTANTE:

   Lo storico NON viene più
   ordinato matematicamente.

   L'ordine è quello nel quale
   gli eventi sono stati registrati.

   Esempio:

   1000
   3000
   500
   3000

   resta:

   1000
   3000
   500
   3000

   anche se i valori sono
   numericamente disordinati.
*/

function drawHistory() {

    historyLayer.innerHTML =
        "";


    history.forEach(
        (entry, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-item";


            const color =
                getValueColor(
                    entry.value
                );


            const valueElement =
                document.createElement(
                    "span"
                );

            valueElement.className =
                "history-value";

            valueElement.textContent =
                formatValue(
                    entry.value
                );

            valueElement.style.color =
                color;


            const textElement =
                document.createElement(
                    "span"
                );

            textElement.className =
                "history-text";

            textElement.textContent =
                entry.text;

            textElement.style.color =
                color;


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "history-delete";

            deleteButton.textContent =
                "×";


            deleteButton.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    deleteHistoryEntry(
                        index
                    );

                }
            );


            item.appendChild(
                valueElement
            );

            item.appendChild(
                textElement
            );

            item.appendChild(
                deleteButton
            );


            historyLayer.appendChild(
                item
            );

        }
    );
}


/* =====================================================
   SALVA STORICO
===================================================== */

function saveHistory() {

    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
            history
        )
    );
}


/* =====================================================
   ELIMINA EVENTO STORICO
===================================================== */

function deleteHistoryEntry(index) {

    if (
        index < 0 ||
        index >= history.length
    ) {

        return;
    }


    history.splice(
        index,
        1
    );


    saveHistory();

    drawHistory();
}


/* =====================================================
   CENTRA LA SCALA
===================================================== */

function centerTimeline() {

    const maxScroll =
        timeline.scrollHeight -
        timeline.clientHeight;


    if (
        maxScroll <= 0
    ) {

        timeline.scrollTop =
            0;

        return;
    }


    timeline.scrollTop =
        maxScroll / 2;
}


/* =====================================================
   AGGIORNA DISPLAY
===================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    updateColor();

    buildScale();

    drawHistory();


    /*
       La nota sotto al razzo
       viene sempre svuotata
       dopo una variazione.

       La nota viene inserita
       nello storico quando
       premi OK.
    */

    currentNote.value =
        "";


    requestAnimationFrame(
        () => {

            centerTimeline();

        }
    );
}


/* =====================================================
   VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const value =
        parseNumber(
            startInput.value
        );


    if (
        !Number.isFinite(value)
    ) {

        startInput.focus();

        return;
    }


    startValue =
        value;

    currentValue =
        value;


    history = [];


    localStorage.setItem(
        START_KEY,
        String(
            startValue
        )
    );


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
            history
        )
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();
}


/* =====================================================
   APPLICA VARIAZIONE
===================================================== */

function applyChange() {

    const change =
        parseNumber(
            changeInput.value
        );


    if (
        !Number.isFinite(change)
    ) {

        changeInput.focus();

        return;
    }


    /*
       Ogni variazione deve avere
       necessariamente un commento.
    */

    const comment =
        currentNote.value.trim();


    if (
        comment === ""
    ) {

        currentNote.focus();

        return;
    }


    /*
       Il nuovo valore viene
       calcolato matematicamente:

       NUOVO =
       ATTUALE + VARIAZIONE
    */

    const newValue =
        currentValue +
        change;


    /*
       Salviamo il valore
       realmente raggiunto.

       Non salviamo:

       partenza → arrivo

       e non salviamo:

       + / -

       perché quello che interessa
       nello storico è il valore
       raggiunto.
    */

    history.push({

        value:
            newValue,

        text:
            comment

    });


    currentValue =
        newValue;


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    saveHistory();


    changeInput.value =
        "";

    currentNote.value =
        "";


    updateDisplay();
}


/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi cancellare il valore iniziale e tutto lo storico?"
        );


    if (
        !confirmed
    ) {

        return;
    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        HISTORY_KEY
    );


    startValue =
        NaN;

    currentValue =
        NaN;

    history = [];


    startInput.value =
        "";

    changeInput.value =
        "";

    currentNote.value =
        "";


    historyLayer.innerHTML =
        "";


    startScreen.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {

            startInput.focus();

        },
        100
    );
}


/* =====================================================
   EVENTI
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();
        }

    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();
        }

    }
);


/*
   La nota NON viene più salvata
   automaticamente al blur.

   Rimane modificabile finché
   non viene premuto OK.
*/

currentNote.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();
        }

    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =====================================================
   CARICAMENTO DATI
===================================================== */

let startValue =
    parseNumber(
        localStorage.getItem(
            START_KEY
        )
    );


let currentValue =
    parseNumber(
        localStorage.getItem(
            CURRENT_KEY
        )
    );


let history = [];


try {

    history =
        JSON.parse(
            localStorage.getItem(
                HISTORY_KEY
            )
        ) || [];


    /*
       Controllo di sicurezza:
       lo storico deve essere
       sempre un array.
    */

    if (
        !Array.isArray(
            history
        )
    ) {

        history = [];
    }

} catch {

    history = [];
}


/* =====================================================
   AVVIO
===================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;
    }


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

} else {

    startScreen.classList.remove(
        "hidden"
    );

}

</script>
