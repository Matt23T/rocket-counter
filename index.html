<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;

    overscroll-behavior: none;
}

body {
    position: fixed;

    width: 100%;
    height: 100%;

    touch-action: pan-y;
}

.app {
    position: relative;

    width: 100%;
    height: 100dvh;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   SCALA
===================================================== */

.timeline {

    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;

    overscroll-behavior-y: contain;

    z-index: 10;

    touch-action: pan-y;
}

.timeline::-webkit-scrollbar {
    display: none;
}

.timeline-content {

    position: relative;

    width: 100%;

    height: 2400px;
}


/* =====================================================
   LINEA CENTRALE
===================================================== */

.center-line {

    position: absolute;

    top: 0;
    left: 50%;

    width: 1px;
    height: 100%;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.18);

    pointer-events: none;
}


/* =====================================================
   TACCHETTE
===================================================== */

.tick {

    position: absolute;

    left: 50%;

    width: 6px;
    height: 1px;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.20);

    pointer-events: none;
}

.tick.major {

    width: 11px;

    background:
        rgba(255,255,255,0.35);
}

.tick.zero {

    width: 17px;

    background:
        rgba(255,255,255,0.75);
}


/* =====================================================
   NUMERI DELLA SCALA
===================================================== */

.scale-label {

    position: absolute;

    left: calc(50% - 25px);

    transform:
        translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;

    font-weight: 500;

    opacity: 0.65;

    pointer-events: none;
}


/* =====================================================
   NOTE
===================================================== */

.notes-layer {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 50;

    overflow: hidden;
}


/* =====================================================
   NOTA SINGOLA
===================================================== */

.note {

    position: absolute;

    left: calc(50% + 31px);

    max-width:
        calc(50% - 42px);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 13px;

    font-weight: 500;

    pointer-events: none;

    user-select: none;

    -webkit-user-select: none;

    z-index: 55;
}

.note-value {

    margin-right: 7px;

    font-weight: 700;
}

.note-text {

    opacity: 0.90;
}


/* =====================================================
   RAZZO CENTRALE
===================================================== */

.fixed-indicator {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 70;

    pointer-events: none;
}

.rocket {

    position: absolute;

    left: 8px;
    top: 0;

    width: 58px;
    height: 29px;

    transform:
        translateY(-50%);

    overflow: visible;

    transition:
        filter 0.2s ease;
}

.rocket-part {

    fill: #fff;

    transition:
        fill 0.2s ease;
}

.rocket-window {

    fill: #000;
}


/* =====================================================
   VALORE ATTUALE
===================================================== */

.current-info {

    position: absolute;

    left: 76px;
    top: 0;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    pointer-events: auto;
}

.current-value {

    font-size: 20px;

    line-height: 25px;

    font-weight: 700;

    white-space: nowrap;

    transition:
        color 0.2s ease;
}

.current-note {

    width: 180px;
    height: 27px;

    margin: 0;
    padding: 0;

    border: none;

    outline: none;

    background: transparent;

    color: #aaa;

    font-size: 13px;

    touch-action: auto;
}

.current-note::placeholder {

    color: #555;
}


/* =====================================================
   CONTROLLI
===================================================== */

.controls {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            16px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 80;
}

.change-input {

    width: 175px;
    height: 49px;

    padding: 0 12px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 17px;

    font-weight: 600;
}

.change-input::placeholder {

    color: #555;
}

.change-button {

    width: 55px;
    height: 49px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;
}

.change-button:active {

    transform:
        scale(0.96);
}


/* =====================================================
   RESET
===================================================== */

.reset-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    right: 12px;

    height: 37px;

    padding: 0 13px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}


/* =====================================================
   SCHERMATA INIZIALE
===================================================== */

.start-screen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {

    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 700;
}

.start-subtitle {

    margin-bottom: 23px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {

    width: 220px;
    height: 54px;

    padding: 0 10px;

    border:
        1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 21px;

    font-weight: 600;
}

.start-input::placeholder {

    color: #555;
}

.start-button {

    width: 220px;
    height: 49px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 700;
}

.hidden {

    display: none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    .rocket {

        width: 56px;
        height: 28px;
    }

    .current-info {

        left: 73px;
    }

    .current-value {

        font-size: 19px;
    }

    .current-note {

        width: 165px;
    }

    .note {

        font-size: 12px;
    }
}

</style>

</head>


<body>

<script>

/* =====================================================
   BLOCCO ZOOM
===================================================== */

document.addEventListener(
    "gesturestart",
    function(event) {
        event.preventDefault();
    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturechange",
    function(event) {
        event.preventDefault();
    },
    {
        passive: false
    }
);

document.addEventListener(
    "gestureend",
    function(event) {
        event.preventDefault();
    },
    {
        passive: false
    }
);

document.addEventListener(
    "touchmove",
    function(event) {

        if (
            event.touches.length > 1
        ) {
            event.preventDefault();
        }

    },
    {
        passive: false
    }
);


/* =====================================================
   STORAGE
===================================================== */

const START_KEY =
    "rocket_start_value_v5";

const CURRENT_KEY =
    "rocket_current_value_v5";

const NOTES_KEY =
    "rocket_notes_v5";


/* =====================================================
   ELEMENTI
===================================================== */

const timeline =
    document.getElementById(
        "timeline"
    );

const timelineContent =
    document.getElementById(
        "timelineContent"
    );

const ticks =
    document.getElementById(
        "ticks"
    );

const labels =
    document.getElementById(
        "labels"
    );

const notesLayer =
    document.getElementById(
        "notesLayer"
    );

const currentValueElement =
    document.getElementById(
        "currentValue"
    );

const currentNote =
    document.getElementById(
        "currentNote"
    );

const changeInput =
    document.getElementById(
        "changeInput"
    );

const changeButton =
    document.getElementById(
        "changeButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startInput =
    document.getElementById(
        "startInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const rocketParts =
    document.querySelectorAll(
        ".rocket-part"
    );

const rocket =
    document.getElementById(
        "rocket"
    );


/* =====================================================
   SCALA
===================================================== */

const DISPLAY_RANGE =
    1100;

const STEP =
    25;

const PIXELS_PER_STEP =
    27;

const PIXELS_PER_EURO =
    PIXELS_PER_STEP / STEP;


/* =====================================================
   NUMERI
===================================================== */

function parseNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return NaN;
    }

    let text =
        String(value).trim();

    if (
        text === ""
    ) {
        return NaN;
    }

    text =
        text.replace(
            /\s/g,
            ""
        );

    /*
       Supporta:

       1300
       +1300
       -1300
       1.300
       -1.300
       1300,50
       -1300,50
    */

    if (
        text.includes(",")
    ) {

        text =
            text.replace(
                /\./g,
                ""
            );

        text =
            text.replace(
                ",",
                "."
            );

    } else {

        /*
           Il punto viene considerato
           separatore delle migliaia
           solo quando ci sono
           esattamente tre cifre dopo.
        */

        text =
            text.replace(
                /^([+-]?\d+)\.(\d{3})$/,
                "$1$2"
            );
    }

    const number =
        Number(text);

    return Number.isFinite(number)
        ? number
        : NaN;
}


/* =====================================================
   FORMATTAZIONE
===================================================== */

function formatValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;

    const absolute =
        Math.abs(rounded)
            .toLocaleString(
                "it-IT",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );

    if (
        rounded > 0
    ) {

        return "+" +
            absolute +
            " €";
    }

    if (
        rounded < 0
    ) {

        return "-" +
            absolute +
            " €";
    }

    return "0 €";
}


/* =====================================================
   COLORI
===================================================== */

function getValueColor(value) {

    if (
        value === 0
    ) {
        return "#FFFFFF";
    }


    if (
        value > 0
    ) {

        if (
            value <= 1000
        ) {
            return "#B8FFD0";
        }

        if (
            value <= 2000
        ) {
            return "#62F28A";
        }

        if (
            value <= 3000
        ) {
            return "#20DD65";
        }

        if (
            value <= 4000
        ) {
            return "#08C951";
        }

        return "#00A83F";
    }


    const amount =
        Math.abs(value);


    if (
        amount <= 1000
    ) {
        return "#FFB9C0";
    }

    if (
        amount <= 2000
    ) {
        return "#FF6877";
    }

    if (
        amount <= 3000
    ) {
        return "#F8374C";
    }

    if (
        amount <= 4000
    ) {
        return "#E91E35";
    }

    return "#C90020";
}


/* =====================================================
   COLORE RAZZO
===================================================== */

function updateColor() {

    const color =
        getValueColor(
            currentValue
        );


    rocketParts.forEach(
        part => {

            part.style.fill =
                color;
        }
    );


    currentValueElement.style.color =
        color;


    rocket.style.filter =
        `drop-shadow(
            0 0 7px ${color}
        )`;
}


/* =====================================================
   COSTRUZIONE SCALA
===================================================== */

/*
   QUESTA È LA PARTE MATEMATICA IMPORTANTE.

   Per ogni valore reale della scala:

       differenza =
           valoreScala - valoreAttuale

   Poi:

       posizione =
           centro -
           differenza * pixelPerEuro

   Conseguenza:

       valoreScala > valoreAttuale
       → posizione più in alto

       valoreScala < valoreAttuale
       → posizione più in basso


   Esempio con valore attuale = 0:

       +750 → sopra
       +500 → sopra
       +250 → sopra
          0 → centro
       -250 → sotto
       -500 → sotto
       -750 → sotto


   Esempio con valore attuale = -300:

       -100 → sopra
       -250 → sopra
       -300 → centro
       -400 → sotto
       -700 → sotto


   NON viene utilizzato Math.abs()
   per determinare la posizione.
*/

function buildScale() {

    ticks.innerHTML =
        "";

    labels.innerHTML =
        "";


    const totalValueRange =
        DISPLAY_RANGE * 2;


    const totalHeight =
        totalValueRange *
        PIXELS_PER_EURO;


    timelineContent.style.height =
        totalHeight + "px";


    const centerY =
        totalHeight / 2;


    /*
       Costruiamo valori reali
       intorno al valore attuale.

       Non costruiamo più una posizione
       partendo dal valore assoluto.
    */

    const minimumValue =
        currentValue -
        DISPLAY_RANGE;

    const maximumValue =
        currentValue +
        DISPLAY_RANGE;


    /*
       Arrotondiamo gli estremi
       ai multipli di 25.
    */

    const firstValue =
        Math.ceil(
            minimumValue / STEP
        ) * STEP;


    const lastValue =
        Math.floor(
            maximumValue / STEP
        ) * STEP;


    for (
        let scaleValue =
            firstValue;

        scaleValue <=
            lastValue;

        scaleValue +=
            STEP
    ) {


        /*
           DIFFERENZA NUMERICA REALE.

           Esempio:

           current = -300

           scale = -700

           difference =
               -700 - (-300)
               = -400

           y =
               centro - (-400 * scala)
               = centro + ...

           quindi -700 è sotto.

           Questo è esattamente ciò
           che vogliamo.
        */

        const difference =
            scaleValue -
            currentValue;


        const y =
            centerY -
            (
                difference *
                PIXELS_PER_EURO
            );


        const tick =
            document.createElement(
                "div"
            );

        tick.className =
            "tick";


        if (
            scaleValue % 250 === 0
        ) {

            tick.classList.add(
                "major"
            );
        }


        if (
            scaleValue === 0
        ) {

            tick.classList.add(
                "zero"
            );
        }


        tick.style.top =
            `${y}px`;


        ticks.appendChild(
            tick
        );


        /*
           Numero ogni 250 €.
        */

        if (
            scaleValue % 250 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "scale-label";


            label.style.top =
                `${y}px`;


            label.textContent =
                formatValue(
                    scaleValue
                );


            label.style.color =
                getValueColor(
                    scaleValue
                );


            labels.appendChild(
                label
            );
        }
    }
}


/* =====================================================
   CREA NOTA
===================================================== */

function createNote(
    value,
    text
) {

    const note =
        document.createElement(
            "div"
        );

    note.className =
        "note";


    const color =
        getValueColor(
            value
        );


    note.style.color =
        color;


    const valueElement =
        document.createElement(
            "span"
        );

    valueElement.className =
        "note-value";

    valueElement.textContent =
        formatValue(
            value
        );

    valueElement.style.color =
        color;


    const textElement =
        document.createElement(
            "span"
        );

    textElement.className =
        "note-text";

    textElement.textContent =
        text;

    textElement.style.color =
        color;


    note.appendChild(
        valueElement
    );

    note.appendChild(
        textElement
    );


    return note;
}


/* =====================================================
   DISEGNA NOTE
===================================================== */

function drawNotes() {

    notesLayer.innerHTML =
        "";


    const entries =
        Object.entries(
            notes
        )
        .map(
            ([value, text]) => {

                return {
                    value:
                        Number(value),

                    text:
                        String(text)
                };

            }
        )
        .filter(
            item =>
                Number.isFinite(
                    item.value
                )
        );


    /*
       ORDINE NUMERICO REALE.

       NON usare Math.abs().

       -700 < -300

       quindi:

       -700 è più in basso
       -300 è più in alto
    */

    entries.sort(
        (a, b) =>
            a.value -
            b.value
    );


    /*
       NOTE SOPRA IL RAZZO

       Devono essere valori
       numericamente MAGGIORI
       del valore attuale.
    */

    const above =
        entries
            .filter(
                item =>
                    item.value >
                    currentValue
            )
            .sort(
                (a, b) =>
                    a.value -
                    b.value
            );


    /*
       NOTE SOTTO IL RAZZO

       Devono essere valori
       numericamente MINORI
       del valore attuale.
    */

    const below =
        entries
            .filter(
                item =>
                    item.value <
                    currentValue
            )
            .sort(
                (a, b) =>
                    b.value -
                    a.value
            );


    const NOTE_GAP =
        34;


    /*
       SOPRA
    */

    above.forEach(
        (item, index) => {

            const note =
                createNote(
                    item.value,
                    item.text
                );


            note.style.top =
                `calc(
                    50% -
                    ${
                        NOTE_GAP *
                        (index + 1)
                    }px
                )`;


            note.style.transform =
                "translateY(-50%)";


            notesLayer.appendChild(
                note
            );
        }
    );


    /*
       SOTTO
    */

    below.forEach(
        (item, index) => {

            const note =
                createNote(
                    item.value,
                    item.text
                );


            note.style.top =
                `calc(
                    50% +
                    ${
                        NOTE_GAP *
                        (index + 1)
                    }px
                )`;


            note.style.transform =
                "translateY(-50%)";


            notesLayer.appendChild(
                note
            );
        }
    );
}


/* =====================================================
   SALVA NOTA
===================================================== */

function saveCurrentNote() {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {
        return;
    }


    const text =
        currentNote.value.trim();


    const key =
        String(
            currentValue
        );


    if (
        text === ""
    ) {

        delete notes[key];

    } else {

        notes[key] =
            text;
    }


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    drawNotes();
}


/* =====================================================
   CARICA NOTA
===================================================== */

function loadCurrentNote() {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentNote.value =
            "";

        return;
    }


    currentNote.value =
        notes[
            String(currentValue)
        ] || "";
}


/* =====================================================
   CENTRA LA SCALA
===================================================== */

function centerTimeline() {

    const maxScroll =
        timeline.scrollHeight -
        timeline.clientHeight;


    if (
        maxScroll <= 0
    ) {

        timeline.scrollTop =
            0;

        return;
    }


    timeline.scrollTop =
        maxScroll / 2;
}


/* =====================================================
   DISPLAY
===================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    updateColor();

    buildScale();

    drawNotes();

    loadCurrentNote();


    requestAnimationFrame(
        () => {

            centerTimeline();

        }
    );
}


/* =====================================================
   VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const value =
        parseNumber(
            startInput.value
        );


    if (
        !Number.isFinite(
            value
        )
    ) {

        startInput.focus();

        return;
    }


    startValue =
        value;

    currentValue =
        value;


    notes = {};


    localStorage.setItem(
        START_KEY,
        String(
            startValue
        )
    );


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();
}


/* =====================================================
   VARIAZIONE
===================================================== */

function applyChange() {

    const change =
        parseNumber(
            changeInput.value
        );


    if (
        !Number.isFinite(
            change
        )
    ) {

        changeInput.focus();

        return;
    }


    /*
       Salviamo la nota associata
       al valore da cui partiamo.
    */

    saveCurrentNote();


    /*
       REGOLA DELLA VARIAZIONE:

       nuovo =
           precedente + variazione

       Esempio:

       -3000 + 1000
       = -2000

       -2000 + (-500)
       = -2500
    */

    currentValue =
        currentValue +
        change;


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    changeInput.value =
        "";


    updateDisplay();
}


/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi cancellare il valore iniziale e tutte le note?"
        );


    if (
        !confirmed
    ) {

        return;
    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        NOTES_KEY
    );


    startValue =
        NaN;

    currentValue =
        NaN;

    notes = {};


    startInput.value =
        "";

    changeInput.value =
        "";

    currentNote.value =
        "";


    startScreen.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {

            startInput.focus();

        },
        100
    );
}


/* =====================================================
   EVENTI
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();
        }
    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();
        }
    }
);


currentNote.addEventListener(
    "blur",
    saveCurrentNote
);


currentNote.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            saveCurrentNote();

            currentNote.blur();
        }
    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =====================================================
   CARICAMENTO
===================================================== */

let startValue =
    parseNumber(
        localStorage.getItem(
            START_KEY
        )
    );


let currentValue =
    parseNumber(
        localStorage.getItem(
            CURRENT_KEY
        )
    );


let notes = {};


try {

    notes =
        JSON.parse(
            localStorage.getItem(
                NOTES_KEY
            )
        ) || {};

} catch {

    notes = {};
}


/* =====================================================
   AVVIO
===================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;
    }


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

} else {

    startScreen.classList.remove(
        "hidden"
    );
}

</script>
