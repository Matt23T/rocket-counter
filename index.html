<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
}

body {
    overflow: hidden;
}

.app {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
}


/* =========================================================
   AREA NOTE SCORRIBILE
========================================================= */

.notes-scroll {
    position: absolute;
    left: 0;
    right: 0;

    top: 0;
    bottom: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;

    padding-top: 50vh;
    padding-bottom: 55vh;

    z-index: 5;
}

.notes-content {
    position: relative;
    width: 100%;
}


/* =========================================================
   LINEA CENTRALE
========================================================= */

.center-line {
    position: absolute;

    left: 50%;
    top: -100000px;

    width: 1px;
    height: 200000px;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.22);

    pointer-events: none;
}


/* =========================================================
   TACCHETTE
========================================================= */

.tick {
    position: absolute;

    left: 50%;

    width: 7px;
    height: 1px;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.20);

    pointer-events: none;
}

.tick.major {
    width: 11px;
    background: rgba(255,255,255,0.32);
}

.tick.zero {
    width: 16px;
    background: rgba(255,255,255,0.65);
}


/* =========================================================
   NUMERI SCALA
========================================================= */

.scale-label {
    position: absolute;

    left: calc(50% - 28px);

    transform: translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;
    font-weight: 500;

    pointer-events: none;
}


/* =========================================================
   NOTE STORICHE
========================================================= */

.note {
    position: absolute;

    left: calc(50% + 27px);

    transform: translateY(-50%);

    max-width: calc(50% - 35px);

    white-space: nowrap;

    overflow: hidden;
    text-overflow: ellipsis;

    font-size: 13px;

    pointer-events: none;
}

.note-value {
    font-weight: 650;
    margin-right: 7px;
}

.note-text {
    opacity: 0.78;
}


/* =========================================================
   INDICATORE FISSO
========================================================= */

.fixed-indicator {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 50;

    pointer-events: none;
}


/* =========================================================
   RAZZO
========================================================= */

.rocket {
    position: absolute;

    left: 10px;
    top: 0;

    width: 62px;
    height: 32px;

    transform: translateY(-50%);

    overflow: visible;

    pointer-events: none;

    transition: filter 0.25s ease;
}


/* =========================================================
   INFORMAZIONI ATTUALI
========================================================= */

.current-info {
    position: absolute;

    left: 84px;
    top: 0;

    transform: translateY(-50%);

    display: flex;
    flex-direction: column;

    pointer-events: auto;
}

.current-value {
    font-size: 22px;
    line-height: 27px;

    font-weight: 650;

    white-space: nowrap;

    transition: color 0.25s ease;
}

.current-note {
    width: 190px;
    height: 28px;

    margin-top: 1px;
    padding: 0;

    border: 0;
    outline: none;

    background: transparent;

    color: #999;

    font-size: 13px;

    touch-action: auto;
}

.current-note::placeholder {
    color: #4b4b4b;
}


/* =========================================================
   CONTROLLI
========================================================= */

.controls {
    position: absolute;

    left: 50%;

    bottom: calc(18px + env(safe-area-inset-bottom));

    transform: translateX(-50%);

    display: flex;
    align-items: center;

    gap: 8px;

    z-index: 80;
}

.change-input {
    width: 175px;
    height: 50px;

    border: 1px solid #383838;
    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 18px;
    font-weight: 600;

    touch-action: auto;
}

.change-input::placeholder {
    color: #4a4a4a;
}

.change-input:focus {
    border-color: #666;
}

.change-button {
    width: 55px;
    height: 50px;

    border: 0;
    border-radius: 13px;

    background: #fff;
    color: #000;

    font-size: 15px;
    font-weight: 700;
}

.change-button:active {
    transform: scale(0.96);
}


/* =========================================================
   RESET
========================================================= */

.reset-button {
    position: absolute;

    top: calc(13px + env(safe-area-inset-top));
    right: 13px;

    height: 38px;

    padding: 0 13px;

    border: 0;
    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}


/* =========================================================
   SCHERMATA INIZIALE
========================================================= */

.start-screen {
    position: absolute;
    inset: 0;

    z-index: 100;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {
    margin-bottom: 8px;

    font-size: 30px;
    font-weight: 650;
}

.start-subtitle {
    margin-bottom: 24px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {
    width: 220px;
    height: 55px;

    border: 1px solid #444;
    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 22px;
    font-weight: 600;

    touch-action: auto;
}

.start-input::placeholder {
    color: #555;
}

.start-button {
    width: 220px;
    height: 50px;

    margin-top: 15px;

    border: 0;
    border-radius: 14px;

    background: #fff;
    color: #000;

    font-size: 16px;
    font-weight: 700;
}

.hidden {
    display: none !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    .rocket {
        width: 58px;
        height: 30px;
    }

    .current-info {
        left: 77px;
    }

    .current-value {
        font-size: 20px;
    }

    .current-note {
        width: 170px;
    }

    .note {
        font-size: 12px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- =====================================================
         PARTE SCORRIBILE
    ====================================================== -->

    <div
        id="notesScroll"
        class="notes-scroll"
    >

        <div
            id="notesContent"
            class="notes-content"
        >

            <div class="center-line"></div>

            <div id="ticks"></div>

            <div id="labels"></div>

            <div id="notes"></div>

        </div>

    </div>


    <!-- =====================================================
         ELEMENTO FISSO AL CENTRO
    ====================================================== -->

    <div
        id="fixedIndicator"
        class="fixed-indicator"
    >

        <!-- RAZZO ORIZZONTALE -->

        <svg
            id="rocket"
            class="rocket"
            viewBox="0 0 100 50"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                class="rocket-part"
                d="
                    M 8 25
                    C 25 10,
                      52 7,
                      78 25
                    C 52 43,
                      25 40,
                      8 25
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M 65 13
                    C 82 15,
                      94 21,
                      99 25
                    C 94 29,
                      82 35,
                      65 37
                    Z
                "
            />

            <circle
                cx="68"
                cy="25"
                r="5"
                class="rocket-window"
            />

            <path
                class="rocket-part"
                d="
                    M 39 16
                    L 25 5
                    L 28 20
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M 39 34
                    L 25 45
                    L 28 30
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M 12 18
                    C 1 20,
                      1 30,
                      12 32
                    L 22 25
                    Z
                "
            />

        </svg>


        <!-- VALORE ATTUALE -->

        <div class="current-info">

            <div
                id="currentValue"
                class="current-value"
            >
                0 €
            </div>

            <input
                id="currentNote"
                class="current-note"
                type="text"
                maxlength="100"
                autocomplete="off"
                placeholder="Nota..."
            >

        </div>

    </div>


    <!-- =====================================================
         CONTROLLI
    ====================================================== -->

    <div class="controls">

        <input
            id="changeInput"
            class="change-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="+ / - variazione"
        >

        <button
            id="changeButton"
            class="change-button"
        >
            OK
        </button>

    </div>


    <!-- =====================================================
         RESET
    ====================================================== -->

    <button
        id="resetButton"
        class="reset-button"
    >
        Reset
    </button>


    <!-- =====================================================
         VALORE INIZIALE
    ====================================================== -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div class="start-title">
            Rocket
        </div>

        <div class="start-subtitle">
            Inserisci il valore iniziale
        </div>

        <input
            id="startInput"
            class="start-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="Valore iniziale"
        >

        <button
            id="startButton"
            class="start-button"
        >
            OK
        </button>

    </div>

</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const START_KEY = "rocket-start-value";
const CURRENT_KEY = "rocket-current-value";
const NOTES_KEY = "rocket-notes";


/* =========================================================
   ELEMENTI
========================================================= */

const notesScroll =
    document.getElementById("notesScroll");

const notesContent =
    document.getElementById("notesContent");

const ticks =
    document.getElementById("ticks");

const labels =
    document.getElementById("labels");

const notesContainer =
    document.getElementById("notes");

const currentValueElement =
    document.getElementById("currentValue");

const currentNote =
    document.getElementById("currentNote");

const changeInput =
    document.getElementById("changeInput");

const changeButton =
    document.getElementById("changeButton");

const resetButton =
    document.getElementById("resetButton");

const startScreen =
    document.getElementById("startScreen");

const startInput =
    document.getElementById("startInput");

const startButton =
    document.getElementById("startButton");

const rocketParts =
    document.querySelectorAll(".rocket-part");


/* =========================================================
   DATI
========================================================= */

let startValue =
    parseStoredNumber(
        localStorage.getItem(START_KEY)
    );

let currentValue =
    parseStoredNumber(
        localStorage.getItem(CURRENT_KEY)
    );

let notes = {};

try {

    notes =
        JSON.parse(
            localStorage.getItem(NOTES_KEY)
        ) || {};

} catch {

    notes = {};

}


/* =========================================================
   SCALA
========================================================= */

/*
   Ogni 25 € = una piccola tacca.

   Le note NON usano questa distanza fisica.
   Serve solamente come riferimento visivo.
*/

const PIXELS_PER_25 = 18;

const PIXELS_PER_EURO =
    PIXELS_PER_25 / 25;


/*
   Altezza virtuale.

   La scala viene generata in un'area molto
   più grande dello schermo per permettere
   di scorrere quando necessario.
*/

const VIRTUAL_RANGE = 50000;


/* =========================================================
   NUMERI
========================================================= */

function parseStoredNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return NaN;
    }

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : NaN;
}


function parseInput(value) {

    if (
        typeof value !== "string"
    ) {
        return NaN;
    }

    let text =
        value.trim()
        .replace(/\s/g, "")
        .replace(",", ".");

    if (
        text === ""
    ) {
        return NaN;
    }

    return Number(text);
}


/* =========================================================
   EURO
========================================================= */

function formatValue(value) {

    const rounded =
        Math.round(value * 100) / 100;

    const absolute =
        Math.abs(rounded).toLocaleString(
            "it-IT",
            {
                minimumFractionDigits:
                    Number.isInteger(rounded)
                        ? 0
                        : 2,

                maximumFractionDigits: 2
            }
        );

    if (rounded > 0) {
        return "+" + absolute + " €";
    }

    if (rounded < 0) {
        return "-" + absolute + " €";
    }

    return "0 €";
}


/* =========================================================
   COLORI
========================================================= */

/*
   Qui abbiamo volutamente aumentato
   parecchio la differenza tra ogni
   fascia di 1.000 €.

   0       = bianco
   ±250    = quasi bianco
   ±1000   = colore chiaramente visibile
   ±2000   = colore medio
   ±3000   = deciso
   ±4000   = intenso
   ±5000   = massimo

   Oltre 5000 resta il colore massimo.
*/

function getValueColor(value) {

    if (value === 0) {
        return "rgb(255,255,255)";
    }

    const max = 5000;

    const amount =
        Math.min(
            Math.abs(value),
            max
        );

    /*
       Una curva leggermente non lineare
       rende più evidente la progressione
       nei primi 1.000 / 2.000 €.
    */

    const t =
        Math.pow(
            amount / max,
            0.82
        );


    /* =====================================================
       VERDE
    ====================================================== */

    if (value > 0) {

        /*
           Da bianco:

           255,255,255

           a verde brillante:

           25,215,105
        */

        const r =
            Math.round(
                255 - (255 - 25) * t
            );

        const g =
            Math.round(
                255 - (255 - 215) * t
            );

        const b =
            Math.round(
                255 - (255 - 105) * t
            );

        return `rgb(${r}, ${g}, ${b})`;
    }


    /* =====================================================
       ROSSO
    ====================================================== */

    /*
       Da bianco:

       255,255,255

       a rosso brillante:

       225,35,55
    */

    const r =
        Math.round(
            255 - (255 - 225) * t
        );

    const g =
        Math.round(
            255 - (255 - 35) * t
        );

    const b =
        Math.round(
            255 - (255 - 55) * t
        );

    return `rgb(${r}, ${g}, ${b})`;
}


/* =========================================================
   COLORE RAZZO
========================================================= */

function updateRocketColor() {

    const color =
        getValueColor(
            currentValue
        );


    rocketParts.forEach(
        part => {

            part.style.fill =
                color;

        }
    );


    /*
       La finestra resta nera.
    */

    currentValueElement.style.color =
        color;


    rocket.style.filter =
        `drop-shadow(0 0 7px ${color})`;
}


/* =========================================================
   COSTRUISCE LA SCALA
========================================================= */

function buildScale() {

    ticks.innerHTML = "";
    labels.innerHTML = "";


    /*
       La scala è centrata sul valore attuale.

       Il valore attuale NON si muove.

       È la scala che viene costruita intorno
       alla posizione centrale.
    */

    const center =
        Math.round(
            currentValue / 25
        ) * 25;


    const screenHeight =
        window.innerHeight;


    const visibleSteps =
        Math.ceil(
            screenHeight /
            PIXELS_PER_25
        ) + 25;


    for (
        let i = -visibleSteps;
        i <= visibleSteps;
        i++
    ) {

        const value =
            center +
            i * 25;


        const y =
            screenHeight / 2 -
            (
                value -
                center
            ) *
            PIXELS_PER_EURO;


        const tick =
            document.createElement("div");

        tick.className = "tick";

        if (value === 0) {
            tick.classList.add("zero");
        }

        if (
            Math.abs(value) % 250 === 0
        ) {
            tick.classList.add("major");
        }

        tick.style.top =
            y + "px";

        ticks.appendChild(tick);


        /*
           Numero ogni 250 €.
        */

        if (
            Math.abs(value) % 250 === 0
        ) {

            const label =
                document.createElement("div");

            label.className =
                "scale-label";

            label.style.top =
                y + "px";

            label.textContent =
                formatValue(value);

            label.style.color =
                getValueColor(value);

            label.style.opacity =
                "0.32";

            labels.appendChild(label);
        }
    }
}


/* =========================================================
   CREA NOTE
========================================================= */

function createNoteElement(
    value,
    text,
    position
) {

    const note =
        document.createElement("div");

    note.className = "note";

    note.style.top =
        position + "px";


    const color =
        getValueColor(value);


    note.style.color =
        color;


    const valueElement =
        document.createElement("span");

    valueElement.className =
        "note-value";

    valueElement.textContent =
        formatValue(value);

    valueElement.style.color =
        color;


    const textElement =
        document.createElement("span");

    textElement.className =
        "note-text";

    textElement.textContent =
        text;

    textElement.style.color =
        color;


    note.appendChild(
        valueElement
    );

    note.appendChild(
        textElement
    );


    notesContainer.appendChild(
        note
    );
}


/* =========================================================
   NOTE
========================================================= */

function drawNotes() {

    notesContainer.innerHTML = "";


    const entries =
        Object.entries(notes)
        .map(
            ([value, text]) => ({
                value: Number(value),
                text: String(text)
            })
        )
        .filter(
            item =>
                Number.isFinite(item.value)
        );


    /*
       ORDINE MATEMATICO REALE.
    */

    entries.sort(
        (a, b) =>
            a.value - b.value
    );


    /*
       Il valore attuale è sempre
       al centro dello schermo.

       Le note sono disposte in ordine
       sopra e sotto.

       NON sono trascinabili.
    */

    const above =
        entries
        .filter(
            item =>
                item.value >
                currentValue
        )
        .sort(
            (a, b) =>
                b.value - a.value
        );


    const below =
        entries
        .filter(
            item =>
                item.value <
                currentValue
        )
        .sort(
            (a, b) =>
                b.value - a.value
        );


    const same =
        entries.filter(
            item =>
                item.value === currentValue
        );


    /*
       Distanza compatta.

       Non rappresenta i chilometri
       tra i valori: serve solo a mantenere
       le note leggibili e ordinate.
    */

    const spacing = 42;


    /*
       NOTE SOPRA
    */

    above.forEach(
        (item, index) => {

            createNoteElement(
                item.value,
                item.text,

                window.innerHeight / 2
                - 48
                - index * spacing
            );
        }
    );


    /*
       NOTE SOTTO
    */

    below.forEach(
        (item, index) => {

            createNoteElement(
                item.value,
                item.text,

                window.innerHeight / 2
                + 48
                + index * spacing
            );
        }
    );


    /*
       NOTA SULLO STESSO VALORE
    */

    same.forEach(
        (item, index) => {

            createNoteElement(
                item.value,
                item.text,

                window.innerHeight / 2
                + 48
                + index * spacing
            );
        }
    );


    /*
       Aggiorniamo l'altezza dell'area
       per permettere lo scroll quando
       le note superano lo schermo.
    */

    const totalNotes =
        entries.length;


    const extraHeight =
        Math.max(
            0,
            totalNotes * spacing
        );


    notesContent.style.height =
        `calc(100vh + ${extraHeight}px)`;
}


/* =========================================================
   SALVA NOTA ATTUALE
========================================================= */

function saveCurrentNote() {

    const text =
        currentNote.value.trim();


    const key =
        String(currentValue);


    if (text === "") {

        delete notes[key];

    } else {

        notes[key] =
            text;
    }


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(notes)
    );


    drawNotes();
}


/* =========================================================
   CARICA NOTA ATTUALE
========================================================= */

function loadCurrentNote() {

    currentNote.value =
        notes[
            String(currentValue)
        ] || "";
}


/* =========================================================
   AGGIORNA TUTTO
========================================================= */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(currentValue);

    updateRocketColor();

    buildScale();

    drawNotes();

    loadCurrentNote();
}


/* =========================================================
   VALORE INIZIALE
========================================================= */

function setInitialValue() {

    const value =
        parseInput(
            startInput.value
        );


    if (
        !Number.isFinite(value)
    ) {

        startInput.focus();

        return;
    }


    startValue =
        value;

    currentValue =
        value;


    notes = {};


    localStorage.setItem(
        START_KEY,
        String(startValue)
    );

    localStorage.setItem(
        CURRENT_KEY,
        String(currentValue)
    );

    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(notes)
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();
}


/* =========================================================
   VARIAZIONE
========================================================= */

function applyChange() {

    const change =
        parseInput(
            changeInput.value
        );


    if (
        !Number.isFinite(change)
    ) {

        changeInput.focus();

        return;
    }


    /*
       Salviamo la nota prima
       di cambiare valore.
    */

    saveCurrentNote();


    /*
       QUI avviene il vero movimento:

       -3000 + 1000 = -2000

       Il valore viene aggiornato.
       Il razzo NON viene spostato.
    */

    currentValue =
        currentValue +
        change;


    localStorage.setItem(
        CURRENT_KEY,
        String(currentValue)
    );


    changeInput.value =
        "";


    updateDisplay();
}


/* =========================================================
   RESET
========================================================= */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi resettare il valore iniziale e cancellare tutte le note?"
        );


    if (!confirmed) {
        return;
    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        NOTES_KEY
    );


    startValue = NaN;
    currentValue = NaN;

    notes = {};


    startInput.value = "";
    currentNote.value = "";
    changeInput.value = "";


    startScreen.classList.remove(
        "hidden"
    );


    setTimeout(
        () => startInput.focus(),
        100
    );
}


/* =========================================================
   EVENTI
========================================================= */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();
        }
    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();
        }
    }
);


currentNote.addEventListener(
    "blur",
    saveCurrentNote
);


currentNote.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            saveCurrentNote();

            currentNote.blur();
        }
    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (
            Number.isFinite(currentValue)
        ) {

            updateDisplay();
        }
    }
);


/* =========================================================
   AVVIO
========================================================= */

if (
    Number.isFinite(startValue)
) {

    if (
        !Number.isFinite(currentValue)
    ) {

        currentValue =
            startValue;
    }


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

} else {

    startScreen.classList.remove(
        "hidden"
    );
}

</script>

</body>
</html>
