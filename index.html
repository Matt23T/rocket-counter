<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;
    overflow: hidden;
}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
}


/* =========================
   LINEA CENTRALE
========================= */

.center-line {
    position: absolute;

    left: 50%;
    top: 0;

    width: 2px;
    height: 100%;

    background: #4d4d4d;

    transform: translateX(-50%);
}


/* =========================
   TACCHETTE
========================= */

.scale {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

.tick {
    position: absolute;

    left: 50%;

    width: 7px;
    height: 1px;

    background: #666;

    transform: translateX(-50%);

    opacity: 0.3;
}


/* =========================
   INDICATORE
========================= */

.indicator {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 20;

    transition:
        top 0.25s ease;
}


/* =========================
   RAZZO
========================= */

.rocket {
    position: absolute;

    right: 12px;
    top: 50%;

    width: 60px;
    height: 30px;

    transform: translateY(-50%);

    transition:
        filter 0.2s ease;
}


/* =========================
   VALORE ATTUALE
========================= */

.current-info {
    position: absolute;

    left: 18px;
    top: 50%;

    transform: translateY(-50%);

    display: flex;
    flex-direction: column;

    white-space: nowrap;
}

.current-value {
    font-size: 22px;
    font-weight: 600;

    line-height: 26px;

    transition:
        color 0.2s ease;
}

.current-note {
    width: 180px;

    margin-top: 2px;

    padding: 0;

    border: none;
    outline: none;

    background: transparent;

    color: #888;

    font-size: 13px;
}


/* =========================
   COLORI
========================= */

.positive {
    color: #35d982;
}

.negative {
    color: #ff4d5a;
}

.neutral {
    color: white;
}


/* Razzo verde */

.rocket.positive {
    filter:
        brightness(0)
        saturate(100%)
        invert(72%)
        sepia(70%)
        saturate(600%)
        hue-rotate(95deg)
        brightness(95%);
}


/* Razzo rosso */

.rocket.negative {
    filter:
        brightness(0)
        saturate(100%)
        invert(42%)
        sepia(90%)
        saturate(1700%)
        hue-rotate(330deg)
        brightness(105%);
}


/* =========================
   INPUT VARIAZIONE
========================= */

.controls {
    position: absolute;

    left: 50%;

    bottom:
        calc(
            28px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;
    gap: 8px;

    z-index: 50;
}

.change-input {
    width: 170px;
    height: 50px;

    border:
        1px solid #3d3d3d;

    border-radius: 13px;

    background: #111;

    color: white;

    outline: none;

    text-align: center;

    font-size: 20px;
    font-weight: 600;
}

.change-input::placeholder {
    color: #4d4d4d;
}

.change-input:focus {
    border-color: #777;
}


/* =========================
   BOTTONI
========================= */

button {
    height: 50px;

    border: none;

    border-radius: 13px;

    padding: 0 16px;

    background: #181818;

    color: white;

    font-size: 16px;

    font-weight: 600;
}

button:active {
    background: #292929;
}

.reset-button {
    position: absolute;

    top:
        calc(
            16px +
            env(safe-area-inset-top)
        );

    right: 15px;

    height: 38px;

    padding: 0 13px;

    font-size: 13px;

    color: #999;

    z-index: 60;
}


/* =========================
   PANNELLO INIZIALE
========================= */

.start-screen {
    position: absolute;

    inset: 0;

    z-index: 100;

    background: #000;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;
}

.start-title {
    font-size: 28px;

    font-weight: 600;

    margin-bottom: 12px;
}

.start-subtitle {
    color: #777;

    font-size: 14px;

    margin-bottom: 25px;

    text-align: center;
}

.start-input {
    width: 220px;

    height: 55px;

    border:
        1px solid #444;

    border-radius: 14px;

    background: #111;

    color: white;

    outline: none;

    text-align: center;

    font-size: 23px;

    font-weight: 600;
}

.start-input::placeholder {
    color: #555;
}

.start-button {
    margin-top: 15px;

    width: 220px;

    height: 50px;

    background: #fff;

    color: #000;
}


/* =========================
   CRONOLOGIA NOTE
========================= */

.notes-panel {
    position: absolute;

    left:
        calc(50% + 18px);

    right: 12px;

    top: 12px;

    bottom: 100px;

    overflow-y: auto;

    pointer-events: auto;

    padding-top: 20px;

    padding-bottom: 20px;

    scrollbar-width: none;
}

.notes-panel::-webkit-scrollbar {
    display: none;
}


.note-row {
    display: flex;

    align-items: center;

    gap: 8px;

    min-height: 32px;

    margin-bottom: 5px;

    font-size: 12px;

    color: #777;
}


.note-number {
    min-width: 65px;

    font-weight: 500;
}


.note-text {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================
   ADATTAMENTO IPHONE
========================= */

@media (
    max-width: 480px
) {

    .current-value {
        font-size: 20px;
    }

    .current-note {
        width: 160px;
    }

    .notes-panel {
        left:
            calc(50% + 15px);
    }

}


/* =========================
   NASCONDI APP
========================= */

.hidden {
    display: none !important;
}

</style>

</head>


<body>

<div class="app">


    <!-- =====================
         LINEA
    ====================== -->

    <div class="center-line"></div>


    <!-- =====================
         TACCHETTE
    ====================== -->

    <div
        id="scale"
        class="scale">
    </div>


    <!-- =====================
         CRONOLOGIA NOTE
    ====================== -->

    <div
        id="notesPanel"
        class="notes-panel">
    </div>


    <!-- =====================
         RAZZO
    ====================== -->

    <div
        id="indicator"
        class="indicator">


        <svg
            id="rocket"
            class="rocket"
            viewBox="0 0 100 50"
            xmlns="http://www.w3.org/2000/svg">


            <!-- Corpo -->

            <path
                d="
                    M 10 25
                    C 28 10,
                      52 8,
                      78 25
                    C 52 42,
                      28 40,
                      10 25
                    Z
                "
                fill="white"
            />


            <!-- Punta -->

            <path
                d="
                    M 65 13
                    C 82 15,
                      94 21,
                      99 25
                    C 94 29,
                      82 35,
                      65 37
                    Z
                "
                fill="white"
            />


            <!-- Finestrino -->

            <circle
                cx="67"
                cy="25"
                r="5"
                fill="black"
            />


            <!-- Ala -->

            <path
                d="
                    M 38 16
                    L 25 5
                    L 28 20
                    Z
                "
                fill="white"
            />


            <path
                d="
                    M 38 34
                    L 25 45
                    L 28 30
                    Z
                "
                fill="white"
            />


            <!-- Fiamma -->

            <path
                d="
                    M 12 18
                    C 2 20,
                      2 30,
                      12 32
                    L 22 25
                    Z
                "
                fill="white"
            />

        </svg>


        <!-- =====================
             VALORE E NOTA
        ====================== -->

        <div
            class="current-info">


            <div
                id="currentValue"
                class="current-value">
                0 €
            </div>


            <input
                id="currentNote"
                class="current-note"
                type="text"
                maxlength="80"
                placeholder="Nota..."
                autocomplete="off"
            >

        </div>

    </div>


    <!-- =====================
         CONTROLLI
    ====================== -->

    <div
        id="controls"
        class="controls">


        <input
            id="changeInput"
            class="change-input"
            type="text"
            inputmode="text"
            placeholder="+ / - variazione"
            autocomplete="off"
        />


        <button
            id="changeButton">
            OK
        </button>

    </div>


    <!-- =====================
         RESET
    ====================== -->

    <button
        id="resetButton"
        class="reset-button">

        Reset

    </button>


    <!-- =====================
         SCHERMATA INIZIALE
    ====================== -->

    <div
        id="startScreen"
        class="start-screen">


        <div
            class="start-title">

            Rocket

        </div>


        <div
            class="start-subtitle">

            Inserisci il valore
            da cui vuoi partire

        </div>


        <input
            id="startInput"
            class="start-input"
            type="text"
            inputmode="text"
            placeholder="Valore iniziale"
            autocomplete="off"
        />


        <button
            id="startButton"
            class="start-button">

            OK

        </button>

    </div>

</div>


<script>

/* ==================================================
   MEMORIA
================================================== */

const START_KEY =
    "rocket-start-value";

const CURRENT_KEY =
    "rocket-current-value";

const NOTES_KEY =
    "rocket-notes";


/* ==================================================
   ELEMENTI
================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startInput =
    document.getElementById(
        "startInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const changeInput =
    document.getElementById(
        "changeInput"
    );

const changeButton =
    document.getElementById(
        "changeButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const currentValueElement =
    document.getElementById(
        "currentValue"
    );

const currentNote =
    document.getElementById(
        "currentNote"
    );

const indicator =
    document.getElementById(
        "indicator"
    );

const rocket =
    document.getElementById(
        "rocket"
    );

const scale =
    document.getElementById(
        "scale"
    );

const notesPanel =
    document.getElementById(
        "notesPanel"
    );


/* ==================================================
   DATI
================================================== */

let startValue =
    Number(
        localStorage.getItem(
            START_KEY
        )
    );

let currentValue =
    Number(
        localStorage.getItem(
            CURRENT_KEY
        )
    );


/* ==================================================
   NOTE
================================================== */

let notes = {};

try {

    notes =
        JSON.parse(
            localStorage.getItem(
                NOTES_KEY
            )
        ) || {};

} catch {

    notes = {};

}


/* ==================================================
   CONTROLLO PRIMA APERTURA
================================================== */

if (
    Number.isFinite(startValue)
) {

    startScreen.classList.add(
        "hidden"
    );


    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;

    }

} else {

    startScreen.classList.remove(
        "hidden"
    );

}


/* ==================================================
   FORMATTAZIONE
================================================== */

function formatValue(value) {

    const absolute =
        Math.abs(value)
        .toLocaleString(
            "it-IT"
        );


    if (
        value > 0
    ) {

        return "+" +
            absolute +
            " €";

    }


    if (
        value < 0
    ) {

        return "-" +
            absolute +
            " €";

    }


    return "0 €";
}


/* ==================================================
   COLORE
================================================== */

function updateColor() {

    currentValueElement.classList.remove(
        "positive",
        "negative",
        "neutral"
    );

    rocket.classList.remove(
        "positive",
        "negative"
    );


    if (
        currentValue > 0
    ) {

        currentValueElement.classList.add(
            "positive"
        );

        rocket.classList.add(
            "positive"
        );

    }

    else if (
        currentValue < 0
    ) {

        currentValueElement.classList.add(
            "negative"
        );

        rocket.classList.add(
            "negative"
        );

    }

    else {

        currentValueElement.classList.add(
            "neutral"
        );

    }

}


/* ==================================================
   POSIZIONE RAZZO
================================================== */

function updateRocket() {

    /*
       Non imponiamo limiti.

       La posizione viene compressa
       usando una scala logaritmica,
       così valori enormi rimangono
       comunque visualizzabili.
    */

    const height =
        window.innerHeight;


    const scaleFactor =
        110;


    let position;


    if (
        currentValue === 0
    ) {

        position =
            height / 2;

    }

    else {

        const sign =
            currentValue > 0
                ? -1
                : 1;


        const distance =
            Math.log10(
                Math.abs(
                    currentValue
                ) + 1
            ) *
            scaleFactor;


        position =
            (
                height / 2
            ) +
            sign *
            distance;

    }


    /*
       Manteniamo comunque il razzo
       dentro lo schermo.
    */

    position =
        Math.max(
            70,
            Math.min(
                height - 140,
                position
            )
        );


    indicator.style.top =
        position + "px";
}


/* ==================================================
   SALVA NOTA
================================================== */

function saveCurrentNote() {

    const key =
        String(
            currentValue
        );

    const text =
        currentNote.value.trim();


    if (
        text === ""
    ) {

        delete notes[key];

    }

    else {

        notes[key] =
            text;

    }


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    drawNotes();

}


/* ==================================================
   CARICA NOTA
================================================== */

function loadCurrentNote() {

    currentNote.value =
        notes[
            String(
                currentValue
            )
        ] || "";
}


/* ==================================================
   TACCHETTE
================================================== */

function drawScale() {

    scale.innerHTML = "";


    /*
       Le tacche sono solo
       un riferimento visivo.

       Non cerchiamo di rappresentare
       miliardi di euro fisicamente.
    */

    const center =
        window.innerHeight / 2;


    const spacing =
        32;


    for (
        let i = -12;
        i <= 12;
        i++
    ) {

        if (
            i === 0
        ) {

            continue;

        }


        const tick =
            document.createElement(
                "div"
            );


        tick.className =
            "tick";


        tick.style.top =
            (
                center +
                i * spacing
            ) + "px";


        scale.appendChild(
            tick
        );

    }


    /*
       Tacca centrale.
    */

    const zero =
        document.createElement(
            "div"
        );


    zero.className =
        "tick";


    zero.style.width =
        "15px";


    zero.style.opacity =
        "0.6";


    zero.style.top =
        center + "px";


    scale.appendChild(
        zero
    );

}


/* ==================================================
   NOTE IN ORDINE CRESCENTE
================================================== */

function drawNotes() {

    notesPanel.innerHTML = "";


    const entries =
        Object.entries(
            notes
        )
        .map(
            ([value, note]) => ({
                value:
                    Number(value),

                note:
                    note
            })
        )
        .filter(
            item =>
                Number.isFinite(
                    item.value
                )
        )
        .sort(
            (a, b) =>
                a.value -
                b.value
        );


    for (
        const item of entries
    ) {

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "note-row";


        const number =
            document.createElement(
                "span"
            );


        number.className =
            "note-number";


        number.textContent =
            formatValue(
                item.value
            );


        const text =
            document.createElement(
                "span"
            );


        text.className =
            "note-text";


        text.textContent =
            item.note;


        row.appendChild(
            number
        );

        row.appendChild(
            text
        );


        notesPanel.appendChild(
            row
        );

    }

}


/* ==================================================
   AGGIORNAMENTO
================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    loadCurrentNote();

    updateColor();

    updateRocket();

    drawScale();

    drawNotes();


    localStorage.setItem(
        CURRENT_KEY,
        currentValue
    );

}


/* ==================================================
   VALORE INIZIALE
================================================== */

function setInitialValue() {

    const text =
        startInput.value.trim();


    if (
        text === ""
    ) {

        return;

    }


    const number =
        Number(
            text.replace(
                ",",
                "."
            )
        );


    if (
        !Number.isFinite(
            number
        )
    ) {

        return;

    }


    startValue =
        number;

    currentValue =
        number;


    localStorage.setItem(
        START_KEY,
        startValue
    );

    localStorage.setItem(
        CURRENT_KEY,
        currentValue
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

}


/* ==================================================
   VARIAZIONE
================================================== */

function applyChange() {

    const text =
        changeInput.value.trim();


    if (
        text === ""
    ) {

        return;

    }


    const change =
        Number(
            text.replace(
                ",",
                "."
            )
        );


    if (
        !Number.isFinite(
            change
        )
    ) {

        return;

    }


    /*
       SALVA LA NOTA DELLA
       POSIZIONE ATTUALE
       PRIMA DI MUOVERE IL RAZZO.
    */

    saveCurrentNote();


    /*
       ECCO LA LOGICA PRINCIPALE:

       posizione nuova =
       posizione vecchia +
       variazione
    */

    currentValue +=
        change;


    changeInput.value =
        "";


    updateDisplay();


    changeInput.focus();

}


/* ==================================================
   RESET
================================================== */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi davvero resettare il valore iniziale e ripartire da zero?"
        );


    if (
        !confirmed
    ) {

        return;

    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        NOTES_KEY
    );


    startValue =
        NaN;

    currentValue =
        0;

    notes =
        {};


    startInput.value =
        "";

    changeInput.value =
        "";

    currentNote.value =
        "";


    startScreen.classList.remove(
        "hidden"
    );

}


/* ==================================================
   EVENTI
================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();

        }

    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();

        }

    }
);


currentNote.addEventListener(
    "blur",
    saveCurrentNote
);


currentNote.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            saveCurrentNote();

            currentNote.blur();

        }

    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


window.addEventListener(
    "resize",
    () => {

        updateRocket();

        drawScale();

    }
);


/* ==================================================
   AVVIO
================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    updateDisplay();

}

</script>

</body>
</html>
