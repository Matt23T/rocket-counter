<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;

    overscroll-behavior: none;
}

html {
    position: fixed;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {
    position: fixed;

    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: pan-y;
}

/* =====================================================
   PALCO
===================================================== */

.app {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100vh;
    height: 100svh;

    background: #000;

    overflow: hidden;
}

/* =====================================================
   SCALA
===================================================== */

.timeline {

    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;

    overscroll-behavior-y: contain;

    z-index: 10;

    touch-action: pan-y;
}

.timeline::-webkit-scrollbar {
    display: none;
}

.timeline-content {

    position: relative;

    width: 100%;

    height: 2400px;
}

/* =====================================================
   LINEA CENTRALE
===================================================== */

.center-line {

    position: absolute;

    top: 0;
    left: 50%;

    width: 1px;
    height: 100%;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.18);

    pointer-events: none;
}

/* =====================================================
   PUNTO DEL VALORE CORRENTE
===================================================== */

.current-marker {

    position: absolute;

    left: 50%;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 30;

    pointer-events: none;

    box-shadow:
        0 0 8px currentColor,
        0 0 14px currentColor;

    transition:
        background-color 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease;
}

/* =====================================================
   TACCHETTE
===================================================== */

.tick {

    position: absolute;

    left: 50%;

    width: 6px;
    height: 1px;

    transform:
        translateX(-50%);

    background:
        rgba(255,255,255,0.20);

    pointer-events: none;
}

.tick.major {

    width: 11px;

    background:
        rgba(255,255,255,0.35);
}

.tick.zero {

    width: 17px;

    background:
        rgba(255,255,255,0.75);
}

/* =====================================================
   NUMERI
===================================================== */

.scale-label {

    position: absolute;

    left: calc(50% - 25px);

    transform:
        translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;

    font-weight: 500;

    opacity: 0.65;

    pointer-events: none;
}

/* =====================================================
   OBIETTIVI FISSATI ALLA CIFRA
===================================================== */

.goals-layer {

    position: absolute;

    inset: 0;

    z-index: 40;

    pointer-events: none;
}

.goal-item {

    position: absolute;

    left: 8px;

    width:
        calc(50% - 42px);

    transform:
        translateY(-50%);

    display: flex;

    align-items: center;

    gap: 6px;

    padding: 5px 7px;

    border-radius: 9px;

    background:
        rgba(18,18,18,0.88);

    border:
        1px solid
        rgba(255,255,255,0.08);

    font-size: 11px;

    line-height: 15px;

    word-break: break-word;

    pointer-events: none;
}

.goal-check {

    flex:
        0 0 auto;

    width: 17px;
    height: 17px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,0.45);

    display: flex;

    align-items: center;
    justify-content: center;

    color: #000;

    font-size: 11px;

    font-weight: 800;
}

.goal-check.completed {

    background: #20DD65;

    border-color: #20DD65;
}

.goal-content {

    min-width: 0;

    flex: 1;
}

.goal-value {

    display: inline-block;

    margin-right: 4px;

    font-weight: 700;
}

.goal-text {

    opacity: 0.92;
}

/* =====================================================
   LISTA OBIETTIVI
===================================================== */

.goals-modal {

    position: absolute;

    inset: 0;

    z-index: 210;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,0.72);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);
}

.goals-box {

    width:
        min(
            340px,
            calc(100vw - 50px)
        );

    max-height:
        min(
            70vh,
            520px
        );

    display: flex;

    flex-direction: column;

    padding: 18px;

    border:
        1px solid #292929;

    border-radius: 18px;

    background: #111;
}

.goals-list-title {

    margin-bottom: 13px;

    font-size: 20px;

    font-weight: 700;
}

.goals-list {

    overflow-y: auto;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;
}

.goals-list::-webkit-scrollbar {
    display: none;
}

.goals-list-item {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 11px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);
}

.goals-list-check {

    flex:
        0 0 auto;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,0.4);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 12px;

    font-weight: 800;

    color: #000;
}

.goals-list-check.completed {

    background: #20DD65;

    border-color: #20DD65;
}

.goals-list-content {

    min-width: 0;

    flex: 1;

    font-size: 12px;

    line-height: 16px;
}

.goals-list-value {

    font-weight: 700;
}

.goals-list-name {

    margin-left: 5px;

    color: #fff;
}

.goals-list-delete {

    flex:
        0 0 auto;

    width: 22px;
    height: 22px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background: #1b1b1b;

    color: #777;

    font-size: 14px;

    line-height: 22px;

    text-align: center;
}

.goals-list-close {

    width: 100%;
    height: 44px;

    margin-top: 14px;

    border: none;

    border-radius: 12px;

    background: #fff;

    color: #000;

    font-size: 14px;

    font-weight: 700;
}

.goals-empty {

    padding: 25px 5px;

    color: #777;

    text-align: center;

    font-size: 13px;
}

/* =====================================================
   NOTE
===================================================== */

.notes-layer {

    position: absolute;

    top:
        calc(
            51px +
            env(safe-area-inset-top)
        );

    right: 7px;

    width:
        calc(50% - 40px);

    max-height:
        calc(
            37vh - 2px
        );

    transform: none;

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    z-index: 50;

    pointer-events: auto;

    -webkit-overflow-scrolling: touch;
}

.notes-layer::-webkit-scrollbar {
    display: none;
}

.note {

    width: 100%;

    margin-bottom: 14px;

    padding-bottom: 8px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

    font-size: 12px;

    line-height: 16px;

    word-break: break-word;

    overflow-wrap: anywhere;

    user-select: none;

    -webkit-user-select: none;
}

.note-date {

    display: block;

    margin-bottom: 3px;

    color: #fff !important;

    font-size: 7px;

    line-height: 9px;

    font-weight: 700;

    opacity: 0.85;

    white-space: nowrap;
}

.note-main {

    display: block;

    width: 100%;

    line-height: 16px;

    word-break: break-word;

    overflow-wrap: anywhere;
}

.note-bracket {

    color: #fff !important;

    font-weight: 500;

    white-space: nowrap;
}

.note-change {

    font-weight: 700;

    white-space: nowrap;
}

.note-result {

    margin-left: 4px;

    font-weight: 700;

    white-space: nowrap;
}

.note-text {

    display: block;

    margin-left: 0;

    color: #fff !important;

    font-weight: 700;

    white-space: normal;

    overflow-wrap: anywhere;

    word-break: break-word;
}

.note-delete {

    float: right;

    width: 19px;
    height: 19px;

    padding: 0;

    margin-left: 5px;

    border: none;

    border-radius: 50%;

    background: #1b1b1b;

    color: #777;

    font-size: 11px;

    line-height: 19px;

    text-align: center;
}

.note-delete:active {

    transform:
        scale(0.9);
}

.notes-toggle {

    display: block;

    width: 100%;

    margin-top: 2px;

    padding: 7px 0;

    border: none;

    border-radius: 9px;

    background: #181818;

    color: #aaa;

    font-size: 11px;

    font-weight: 600;

    text-align: center;
}

.notes-toggle:active {

    transform:
        scale(0.97);
}

/* =====================================================
   RAZZO
===================================================== */

.rocket-layer {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 70;

    pointer-events: none;

    will-change: transform;
}

.rocket {

    position: absolute;

    right: 8px;
    left: auto;
    top: 0;

    width: 58px;
    height: 29px;

    transform:
        translateY(-50%);

    overflow: visible;

    transition:
        filter 0.2s ease;
}

.rocket-part {

    fill: #fff;

    transition:
        fill 0.2s ease;
}

.rocket-window {

    fill: #000;
}

/* =====================================================
   VALORE
===================================================== */

.current-info {

    position: absolute;

    left: 76px;
    top: 0;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    pointer-events: none;
}

.current-value {

    font-size: 20px;

    line-height: 25px;

    font-weight: 700;

    white-space: nowrap;

    transition:
        color 0.2s ease;
}

/* =====================================================
   CONTROLLI
===================================================== */

.controls {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            16px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;

    z-index: 80;
}

.change-row {

    display: flex;

    align-items: center;

    gap: 8px;

    transform:
        translateX(31.5px);
}

.change-input {

    width: 175px;
    height: 49px;

    padding: 0 12px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 17px;

    font-weight: 600;
}

.change-input::placeholder {

    color: #555;
}

.note-input {

    width: 175px;
    height: 49px;

    padding: 0 12px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 15px;

    font-weight: 500;
}

.note-input::placeholder {

    color: #555;
}

.change-button {

    width: 55px;
    height: 49px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;
}

.change-button:active {

    transform:
        scale(0.96);
}

/* =====================================================
   +
===================================================== */

.plus-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    left: 12px;

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;

    border-radius: 12px;

    background: #181818;

    color: #fff;

    font-size: 27px;

    font-weight: 300;

    line-height: 42px;

    text-align: center;

    z-index: 90;
}

.plus-button:active {

    transform:
        scale(0.94);
}

/* =====================================================
   LISTA OBIETTIVI BUTTON
===================================================== */

.goals-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    left: 62px;

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;

    border-radius: 12px;

    background: #181818;

    color: #fff;

    font-size: 20px;

    font-weight: 400;

    line-height: 42px;

    text-align: center;

    z-index: 90;
}

.goals-button:active {

    transform:
        scale(0.94);
}

/* =====================================================
   RESET
===================================================== */

.reset-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    right: 12px;

    height: 37px;

    padding: 0 13px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}

/* =====================================================
   MODALE
===================================================== */

.goal-modal {

    position: absolute;

    inset: 0;

    z-index: 200;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,0.72);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);
}

.goal-box {

    width: min(
        330px,
        calc(100vw - 50px)
    );

    padding: 22px;

    border:
        1px solid #292929;

    border-radius: 18px;

    background: #111;
}

.goal-title {

    margin-bottom: 17px;

    font-size: 20px;

    font-weight: 700;
}

.goal-input {

    width: 100%;
    height: 49px;

    margin-bottom: 9px;

    padding: 0 13px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #080808;

    color: #fff;

    font-size: 16px;

    text-align: center;
}

.goal-input::placeholder {

    color: #555;
}

.goal-actions {

    display: flex;

    gap: 8px;

    margin-top: 6px;
}

.goal-cancel,
.goal-save {

    flex: 1;

    height: 47px;

    border: none;

    border-radius: 13px;

    font-size: 15px;

    font-weight: 700;
}

.goal-cancel {

    background: #202020;

    color: #aaa;
}

.goal-save {

    background: #fff;

    color: #000;
}

/* =====================================================
   SCHERMATA INIZIALE
===================================================== */

.start-screen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {

    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 700;
}

.start-subtitle {

    margin-bottom: 23px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {

    width: 220px;
    height: 54px;

    padding: 0 10px;

    border:
        1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 21px;

    font-weight: 600;
}

.start-input::placeholder {

    color: #555;
}

.start-button {

    width: 220px;
    height: 49px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 700;
}

.hidden {

    display: none !important;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    .rocket {

        width: 56px;
        height: 28px;
    }

    .current-info {

        left: 73px;
    }

    .current-value {

        font-size: 19px;
    }

    .goal-item {

        left: 7px;

        width:
            calc(50% - 40px);
    }

    .notes-layer {

        top:
            calc(
                51px +
                env(safe-area-inset-top)
            );

        right: 7px;

        width:
            calc(50% - 40px);

        max-height:
            calc(
                37vh - 2px
            );
    }

    .goal-item,
    .note {

        font-size: 11px;

        line-height: 16px;
    }

}

/* =====================================================
   TASTIERA: IL VIEWPORT RESTA FISSO
===================================================== */

@supports (height: 100dvh) {

    .app {
        height: 100dvh;
    }

}

</style>

</head>

<body>

<div class="app">

    <div
        id="timeline"
        class="timeline"
    >

        <div
            id="timelineContent"
            class="timeline-content"
        >

            <div
                class="center-line"
            ></div>

            <div
                id="currentMarker"
                class="current-marker"
            ></div>

            <div
                id="ticks"
            ></div>

            <div
                id="labels"
            ></div>

            <div
                id="goalsLayer"
                class="goals-layer"
            ></div>

        </div>

    </div>

    <div
        id="notesLayer"
        class="notes-layer"
    ></div>

    <div
        id="rocketLayer"
        class="rocket-layer"
    >

        <svg
            id="rocket"
            class="rocket"
            viewBox="0 0 100 50"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                class="rocket-part"
                d="
                    M8 25
                    C25 10 52 7 78 25
                    C52 43 25 40 8 25
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M65 13
                    C82 15 94 21 99 25
                    C94 29 82 35 65 37
                    Z
                "
            />

            <circle
                cx="68"
                cy="25"
                r="5"
                class="rocket-window"
            />

            <path
                class="rocket-part"
                d="
                    M39 16
                    L25 5
                    L28 20
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M39 34
                    L25 45
                    L28 30
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M12 18
                    C1 20 1 30 12 32
                    L22 25
                    Z
                "
            />

        </svg>

        <div
            class="current-info"
        >

            <div
                id="currentValue"
                class="current-value"
            >
                0 €
            </div>

        </div>

    </div>

    <div
        class="controls"
    >

        <div
            class="change-row"
        >

            <input
                id="changeInput"
                class="change-input"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="+ / - variazione"
            >

            <button
                id="changeButton"
                class="change-button"
            >
                OK
            </button>

        </div>

        <input
            id="noteInput"
            class="note-input"
            type="text"
            maxlength="100"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Nota"
        >

    </div>

    <button
        id="plusButton"
        class="plus-button"
        aria-label="Aggiungi obiettivo"
    >
        +
    </button>

    <button
        id="goalsButton"
        class="goals-button"
        aria-label="Mostra obiettivi"
    >
        ☰
    </button>

    <button
        id="resetButton"
        class="reset-button"
    >
        Reset
    </button>

    <div
        id="goalModal"
        class="goal-modal hidden"
    >

        <div
            class="goal-box"
        >

            <div
                class="goal-title"
            >
                Nuovo obiettivo
            </div>

            <input
                id="goalValueInput"
                class="goal-input"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Cifra"
            >

            <input
                id="goalNameInput"
                class="goal-input"
                type="text"
                maxlength="100"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Nome obiettivo"
            >

            <div
                class="goal-actions"
            >

                <button
                    id="goalCancel"
                    class="goal-cancel"
                >
                    Annulla
                </button>

                <button
                    id="goalSave"
                    class="goal-save"
                >
                    Salva
                </button>

            </div>

        </div>

    </div>

    <div
        id="goalsModal"
        class="goals-modal hidden"
    >

        <div
            class="goals-box"
        >

            <div
                class="goals-list-title"
            >
                Obiettivi
            </div>

            <div
                id="goalsList"
                class="goals-list"
            ></div>

            <button
                id="goalsListClose"
                class="goals-list-close"
            >
                Chiudi
            </button>

        </div>

    </div>

    <div
        id="startScreen"
        class="start-screen"
    >

        <div
            class="start-title"
        >
            Rocket
        </div>

        <div
            class="start-subtitle"
        >
            Inserisci il valore iniziale
        </div>

        <input
            id="startInput"
            class="start-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Valore iniziale"
        >

        <button

/* =====================================================

/* =====================================================
   PARAMETRI SCALA
===================================================== */

const DISPLAY_RANGE =
    1100;

const STEP =
    25;

const PIXELS_PER_STEP =
    27;

const PIXELS_PER_EURO =
    PIXELS_PER_STEP / STEP;

/* =====================================================
   NUMERI
===================================================== */

function parseNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return NaN;
    }

    let text =
        String(value).trim();

    if (
        text === ""
    ) {
        return NaN;
    }

    text =
        text.replace(
            /\s/g,
            ""
        );

    if (
        text.includes(",")
    ) {

        text =
            text.replace(
                /\./g,
                ""
            );

        text =
            text.replace(
                ",",
                "."
            );

    } else {

        text =
            text.replace(
                /^([+-]?\d+)\.(\d{3})$/,
                "$1$2"
            );
    }

    const number =
        Number(text);

    return Number.isFinite(number)
        ? number
        : NaN;
}

/* =====================================================
   FORMATTAZIONE
===================================================== */

function formatValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;

    const absolute =
        Math.abs(rounded)
            .toLocaleString(
                "it-IT",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );

    if (
        rounded > 0
    ) {

        return "+" +
            absolute +
            " €";
    }

    if (
        rounded < 0
    ) {

        return "-" +
            absolute +
            " €";
    }

    return "0 €";
}

function formatResultValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;

    const absolute =
        Math.abs(rounded)
            .toLocaleString(
                "it-IT",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );

    if (
        rounded < 0
    ) {

        return "-" +
            absolute +
            " €";
    }

    return absolute +
        " €";
}

/* =====================================================
   DATA
===================================================== */

function getTodayDate() {

    const now =
        new Date();

    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );

    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const year =
        now.getFullYear();

    return (
        day +
        "/" +
        month +
        "/" +
        year
    );
}

/* =====================================================
   COLORI
===================================================== */

function getValueColor(value) {

    if (
        value === 0
    ) {
        return "#FFFFFF";
    }

    if (
        value > 0
    ) {

        if (
            value <= 1000
        ) {
            return "#B8FFD0";
        }

        if (
            value <= 2000
        ) {
            return "#62F28A";
        }

        if (
            value <= 3000
        ) {
            return "#20DD65";
        }

        if (
            value <= 4000
        ) {
            return "#08C951";
        }

        return "#00A83F";
    }

    const amount =
        Math.abs(value);

    if (
        amount <= 1000
    ) {
        return "#FFB9C0";
    }

    if (
        amount <= 2000
    ) {
        return "#FF6877";
    }

    if (
        amount <= 3000
    ) {
        return "#F8374C";
    }

    if (
        amount <= 4000
    ) {
        return "#E91E35";
    }

    return "#C90020";
}

/* =====================================================
   COLORE RAZZO + PUNTO
===================================================== */

function updateColor() {

    const color =
        getValueColor(
            currentValue
        );

    rocketParts.forEach(
        part => {

            part.style.fill =
                color;

        }
    );

    currentValueElement.style.color =
        color;

    document.getElementById(
        "rocket"
    ).style.filter =
        `drop-shadow(
            0 0 7px ${color}
        )`;

    currentMarker.style.backgroundColor =
        color;

    currentMarker.style.color =
        color;

    currentMarker.style.boxShadow =
        `
        0 0 8px ${color},
        0 0 14px ${color}
        `;
}

/* =====================================================
   POSIZIONE DEL PUNTO
===================================================== */

function updateCurrentMarker() {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {
        return;
    }

    const totalValueRange =
        DISPLAY_RANGE * 2;

    const totalHeight =
        totalValueRange *
        PIXELS_PER_EURO;

    const centerY =
        totalHeight / 2;

    currentMarker.style.top =
        `${centerY}px`;

    updateColor();
}

/* =====================================================
   COSTRUZIONE SCALA
===================================================== */

function buildScale() {

    ticks.innerHTML =
        "";

    labels.innerHTML =
        "";

    const totalValueRange =
        DISPLAY_RANGE * 2;

    const totalHeight =
        totalValueRange *
        PIXELS_PER_EURO;

    timelineContent.style.height =
        totalHeight + "px";

    const centerY =
        totalHeight / 2;

    const minimumValue =
        currentValue -
        DISPLAY_RANGE;

    const maximumValue =
        currentValue +
        DISPLAY_RANGE;

    const firstValue =
        Math.ceil(
            minimumValue / STEP
        ) * STEP;

    const lastValue =
        Math.floor(
            maximumValue / STEP
        ) * STEP;

    for (
        let scaleValue =
            firstValue;

        scaleValue <=
            lastValue;

        scaleValue +=
            STEP
    ) {

        const difference =
            scaleValue -
            currentValue;

        const y =
            centerY -
            (
                difference *
                PIXELS_PER_EURO
            );

        const tick =
            document.createElement(
                "div"
            );

        tick.className =
            "tick";

        if (
            scaleValue % 250 === 0
        ) {

            tick.classList.add(
                "major"
            );
        }

        if (
            scaleValue === 0
        ) {

            tick.classList.add(
                "zero"
            );
        }

        tick.style.top =
            `${y}px`;

        ticks.appendChild(
            tick
        );

        if (
            scaleValue % 250 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "scale-label";

            label.style.top =
                `${y}px`;

            label.textContent =
                formatValue(
                    scaleValue
                );

            label.style.color =
                getValueColor(
                    scaleValue
                );

            labels.appendChild(
                label
            );
        }
    }

    updateCurrentMarker();

    drawGoalsOnScale();
}

/* =====================================================
   NOTE
===================================================== */

function createNote(
    entry,
    index
) {

    const note =
        document.createElement(
            "div"
        );

    note.className =
        "note";

    const resultValue =
        Number(
            entry.value
        );

    const changeValue =
        Number.isFinite(
            Number(entry.change)
        )
            ? Number(entry.change)
            : 0;

    const resultColor =
        getValueColor(
            resultValue
        );

    const changeColor =
        changeValue >= 0
            ? "#20DD65"
            : "#F8374C";

    const dateElement =
        document.createElement(
            "div"
        );

    dateElement.className =
        "note-date";

    dateElement.textContent =
        entry.date ||
        "";

    const main =
        document.createElement(
            "div"
        );

    main.className =
        "note-main";

    const openBracket =
        document.createElement(
            "span"
        );

    openBracket.className =
        "note-bracket";

    openBracket.textContent =
        "(";

    const changeElement =
        document.createElement(
            "span"
        );

    changeElement.className =
        "note-change";

    changeElement.textContent =
        formatValue(
            changeValue
        );

    changeElement.style.color =
        changeColor;

    const closeBracket =
        document.createElement(
            "span"
        );

    closeBracket.className =
        "note-bracket";

    closeBracket.textContent =
        ")";

    const resultElement =
        document.createElement(
            "span"
        );

    resultElement.className =
        "note-result";

    resultElement.textContent =
        formatResultValue(
            resultValue
        );

    resultElement.style.color =
        resultColor;

    const textElement =
        document.createElement(
            "span"
        );

    textElement.className =
        "note-text";

    textElement.textContent =
        entry.text;

    const deleteButton =
        document.createElement(
            "button"
        );

    deleteButton.className =
        "note-delete";

    deleteButton.textContent =
        "×";

    deleteButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            deleteNote(
                index
            );

        }
    );

    main.appendChild(
        openBracket
    );

    main.appendChild(
        changeElement
    );

    main.appendChild(
        closeBracket
    );

    main.appendChild(
        resultElement
    );

    main.appendChild(
        textElement
    );

    main.appendChild(
        deleteButton
    );

    note.appendChild(
        dateElement
    );

    note.appendChild(
        main
    );

    return note;
}

let notesExpanded =
    false;

function drawNotes() {

    notesLayer.innerHTML =
        "";

    const orderedNotes =
        notes
            .map(
                (entry, index) => {

                    return {

                        entry:
                            entry,

                        originalIndex:
                            index

                    };

                }
            )
            .reverse();

    const visibleNotes =
        notesExpanded
            ? orderedNotes
            : orderedNotes.slice(
                0,
                10
            );

    visibleNotes.forEach(
        item => {

            const note =
                createNote(
                    item.entry,
                    item.originalIndex
                );

            notesLayer.appendChild(
                note
            );

        }
    );

    if (
        orderedNotes.length > 10
    ) {

        const toggleButton =
            document.createElement(
                "button"
            );

        toggleButton.className =
            "notes-toggle";

        toggleButton.textContent =
            notesExpanded
                ? "Mostra meno"
                : "Mostra tutte";

        toggleButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                notesExpanded =
                    !notesExpanded;

                drawNotes();

            }
        );

        notesLayer.appendChild(
            toggleButton
        );
    }
}

function deleteNote(index) {

    if (
        index < 0 ||
        index >= notes.length
    ) {
        return;
    }

    notes.splice(
        index,
        1
    );

    saveNotes();

    if (
        notes.length <= 10
    ) {

        notesExpanded =
            false;

    }

    drawNotes();
}

function saveNotes() {

    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );
}

/* =====================================================
   OBIETTIVI FISSATI ALLA SCALA
===================================================== */

function isGoalCompleted(
    goalValue
) {

    return (
        currentValue >=
        goalValue
    );
}

function drawGoalsOnScale() {

    goalsLayer.innerHTML =
        "";

    if (
        !Number.isFinite(
            currentValue
        )
    ) {
        return;
    }

    const totalValueRange =
        DISPLAY_RANGE * 2;

    const totalHeight =
        totalValueRange *
        PIXELS_PER_EURO;

    const centerY =
        totalHeight / 2;

    const minimumValue =
        currentValue -
        DISPLAY_RANGE;

    const maximumValue =
        currentValue +
        DISPLAY_RANGE;

    goals
        .map(
            (goal, index) => {

                return {

                    value:
                        Number(
                            goal.value
                        ),

                    name:
                        String(
                            goal.name
                        ),

                    index:
                        index

                };

            }
        )
        .filter(
            goal =>
                Number.isFinite(
                    goal.value
                ) &&
                goal.value >=
                    minimumValue &&
                goal.value <=
                    maximumValue
        )
        .sort(
            (a, b) =>
                a.value -
                b.value
        )
        .forEach(
            goal => {

                const difference =
                    goal.value -
                    currentValue;

                const y =
                    centerY -
                    (
                        difference *
                        PIXELS_PER_EURO
                    );

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "goal-item";

                item.style.top =
                    `${y}px`;

                const completed =
                    isGoalCompleted(
                        goal.value
                    );

                const check =
                    document.createElement(
                        "div"
                    );

                check.className =
                    "goal-check";

                if (
                    completed
                ) {

                    check.classList.add(
                        "completed"
                    );

                    check.textContent =
                        "✓";

                }

                const content =
                    document.createElement(
                        "div"
                    );

                content.className =
                    "goal-content";

                const valueElement =
                    document.createElement(
                        "span"
                    );

                valueElement.className =
                    "goal-value";

                valueElement.textContent =
                    formatValue(
                        goal.value
                    );

                valueElement.style.color =
                    getValueColor(
                        goal.value
                    );

                const nameElement =
                    document.createElement(
                        "span"
                    );

                nameElement.className =
                    "goal-text";

                nameElement.textContent =
                    goal.name;

                content.appendChild(
                    valueElement
                );

                content.appendChild(
                    nameElement
                );

                item.appendChild(
                    check
                );

                item.appendChild(
                    content
                );

                goalsLayer.appendChild(
                    item
                );

            }
        );
}

function saveGoals() {

    localStorage.setItem(
        GOALS_KEY,
        JSON.stringify(
            goals
        )
    );
}

function deleteGoal(index) {

    if (
        index < 0 ||
        index >= goals.length
    ) {
        return;
    }

    goals.splice(
        index,
        1
    );

    saveGoals();

    drawGoalsOnScale();

    drawGoalsList();
}

function drawGoalsList() {

    goalsList.innerHTML =
        "";

    const sortedGoals =
        goals
            .map(
                (goal, index) => {

                    return {

                        value:
                            Number(
                                goal.value
                            ),

                        name:
                            String(
                                goal.name
                            ),

                        originalIndex:
                            index

                    };

                }
            )
            .filter(
                goal =>
                    Number.isFinite(
                        goal.value
                    )
            )
            .sort(
                (a, b) =>
                    a.value -
                    b.value
            );

    if (
        sortedGoals.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "goals-empty";

        empty.textContent =
            "Nessun obiettivo";

        goalsList.appendChild(
            empty
        );

        return;
    }

    sortedGoals.forEach(
        goal => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "goals-list-item";

            const completed =
                isGoalCompleted(
                    goal.value
                );

            const check =
                document.createElement(
                    "div"
                );

            check.className =
                "goals-list-check";

            if (
                completed
            ) {

                check.classList.add(
                    "completed"
                );

                check.textContent =
                    "✓";

            }

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "goals-list-content";

            const value =
                document.createElement(
                    "span"
                );

            value.className =
                "goals-list-value";

            value.textContent =
                formatValue(
                    goal.value
                );

            value.style.color =
                getValueColor(
                    goal.value
                );

            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "goals-list-name";

            name.textContent =
                goal.name;

            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "goals-list-delete";

            deleteButton.textContent =
                "×";

            deleteButton.addEventListener(
                "click",
                function() {

                    deleteGoal(
                        goal.originalIndex
                    );

                }
            );

            content.appendChild(
                value
            );

            content.appendChild(
                name
            );

            item.appendChild(
                check
            );

            item.appendChild(
                content
            );

            item.appendChild(
                deleteButton
            );

            goalsList.appendChild(
                item
            );

        }
    );
}

function openGoalsModal() {

    drawGoalsList();

    goalsModal.classList.remove(
        "hidden"
    );
}

function closeGoalsModal() {

    goalsModal.classList.add(
        "hidden"
    );
}

/* =====================================================
   MODALE NUOVO OBIETTIVO
===================================================== */

function openGoalModal() {

    goalValueInput.value =
        "";

    goalNameInput.value =
        "";

    goalModal.classList.remove(
        "hidden"
    );

    setTimeout(
        () => {

            goalValueInput.focus();

        },
        100
    );
}

function closeGoalModal() {

    goalModal.classList.add(
        "hidden"
    );

    goalValueInput.value =
        "";

    goalNameInput.value =
        "";
}

function saveGoal() {

    const value =
        parseNumber(
            goalValueInput.value
        );

    const name =
        goalNameInput.value.trim();

    if (
        !Number.isFinite(
            value
        )
    ) {

        goalValueInput.focus();

        return;
    }

    if (
        name === ""
    ) {

        goalNameInput.focus();

        return;
    }

    goals.push({

        value:
            value,

        name:
            name

    });

    saveGoals();

    drawGoalsOnScale();

    closeGoalModal();
}

/* =====================================================
   CENTRA SCALA
===================================================== */

function centerTimeline() {

    const maxScroll =
        timeline.scrollHeight -
        timeline.clientHeight;

    if (
        maxScroll <= 0
    ) {

        timeline.scrollTop =
            0;

        return;
    }

    timeline.scrollTop =
        maxScroll / 2;
}

/* =====================================================
   DISPLAY
===================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );

    updateColor();

    buildScale();

    drawNotes();

    requestAnimationFrame(
        () => {

            centerTimeline();

            stabilizeRocket();

        }
    );
}

/* =====================================================
   BLOCCO FISICO RAZZO
===================================================== */

let rocketInitialBodyTop =
    null;

let rocketInitialBodyLeft =
    null;

function stabilizeRocket() {

    const bodyRect =
        document.body.getBoundingClientRect();

    if (
        rocketInitialBodyTop === null
    ) {

        rocketInitialBodyTop =
            bodyRect.top;
    }

    if (
        rocketInitialBodyLeft === null
    ) {

        rocketInitialBodyLeft =
            bodyRect.left;
    }

    const verticalShift =
        rocketInitialBodyTop -
        bodyRect.top;

    const horizontalShift =
        rocketInitialBodyLeft -
        bodyRect.left;

    rocketLayer.style.transform =
        `translate3d(
            ${horizontalShift}px,
            ${verticalShift}px,
            0
        )`;
}

/* =====================================================
   MONITORAGGIO TASTIERA
===================================================== */

function requestRocketStabilization() {

    requestAnimationFrame(
        () => {

            stabilizeRocket();

            requestAnimationFrame(
                () => {

                    stabilizeRocket();

                }
            );

        }
    );
}

if (
    window.visualViewport
) {

    window.visualViewport.addEventListener(
        "scroll",
        requestRocketStabilization,
        {
            passive: true
        }
    );

    window.visualViewport.addEventListener(
        "resize",
        requestRocketStabilization,
        {
            passive: true
        }
    );
}

function monitorKeyboardMovement() {

    let frames = 0;

    function check() {

        stabilizeRocket();

        frames++;

        if (
            frames < 60
        ) {

            requestAnimationFrame(
                check
            );

        }

    }

    requestAnimationFrame(
        check
    );
}

document.addEventListener(
    "focusin",
    function() {

        monitorKeyboardMovement();

    }
);

document.addEventListener(
    "focusout",
    function() {

        monitorKeyboardMovement();

    }
);

/* =====================================================
   VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const value =
        parseNumber(
            startInput.value
        );

    if (
        !Number.isFinite(
            value
        )
    ) {

        startInput.focus();

        return;
    }

    startValue =
        value;

    currentValue =
        value;

    notes = [];

    goals = [];

    localStorage.setItem(
        START_KEY,
        String(
            startValue
        )
    );

    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );

    saveNotes();

    saveGoals();

    startScreen.classList.add(
        "hidden"
    );

    updateDisplay();
}

/* =====================================================
   APPLICA VARIAZIONE
===================================================== */

function applyChange() {

    const change =
        parseNumber(
            changeInput.value
        );

    if (
        !Number.isFinite(
            change
        )
    ) {

        changeInput.focus();

        return;
    }

    const comment =
        noteInput.value.trim();

    if (
        comment === ""
    ) {

        noteInput.focus();

        return;
    }

    const newValue =
        currentValue +
        change;

    notes.push({

        value:
            newValue,

        change:
            change,

        text:
            comment,

        date:
            getTodayDate()

    });

    currentValue =
        newValue;

    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );

    saveNotes();

    changeInput.value =
        "";

    noteInput.value =
        "";

    notesExpanded =
        false;

    updateDisplay();

    if (
        !goalsModal.classList.contains(
            "hidden"
        )
    ) {

        drawGoalsList();

    }
}

/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi cancellare il valore iniziale, tutte le note e tutti gli obiettivi?"
        );

    if (
        !confirmed
    ) {

        return;
    }

    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        NOTES_KEY
    );

    localStorage.removeItem(
        GOALS_KEY
    );

    startValue =
        NaN;

    currentValue =
        NaN;

    notes = [];

    goals = [];

    notesExpanded =
        false;

    startInput.value =
        "";

    changeInput.value =
        "";

    noteInput.value =
        "";

    goalModal.classList.add(
        "hidden"
    );

    goalsModal.classList.add(
        "hidden"
    );

    goalsLayer.innerHTML =
        "";

    notesLayer.innerHTML =
        "";

    goalsList.innerHTML =
        "";

    startScreen.classList.remove(
        "hidden"
    );

    rocketLayer.style.transform =
        "translate3d(0,0,0)";

    rocketInitialBodyTop =
        null;

    rocketInitialBodyLeft =
        null;
}

/* =====================================================
   EVENTI
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);

startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();

        }

    }
);

changeButton.addEventListener(
    "click",
    applyChange
);

changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();

        }

    }
);

noteInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();

        }

    }
);

plusButton.addEventListener(
    "click",
    openGoalModal
);

goalsButton.addEventListener(
    "click",
    openGoalsModal
);

goalsListClose.addEventListener(
    "click",
    closeGoalsModal
);

goalsModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            goalsModal
        ) {

            closeGoalsModal();

        }

    }
);

goalCancel.addEventListener(
    "click",
    closeGoalModal
);

goalSave.addEventListener(
    "click",
    saveGoal
);

goalValueInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            goalNameInput.focus();

        }

    }
);

goalNameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            saveGoal();

        }

    }
);

goalModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            goalModal
        ) {

            closeGoalModal();

        }

    }
);

resetButton.addEventListener(
    "click",
    resetApp
);

/* =====================================================
   CARICAMENTO DATI
===================================================== */

let startValue =
    parseNumber(
        localStorage.getItem(
            START_KEY
        )
    );

let currentValue =
    parseNumber(
        localStorage.getItem(
            CURRENT_KEY
        )
    );

let notes = [];

let goals = [];

/* =====================================================
   CARICA NOTE
===================================================== */

try {

    const savedNotes =
        JSON.parse(
            localStorage.getItem(
                NOTES_KEY
            )
        );

    if (
        Array.isArray(
            savedNotes
        )
    ) {

        notes =
            savedNotes
                .map(
                    entry => {

                        return {

                            value:
                                Number(
                                    entry.value
                                ),

                            change:
                                Number.isFinite(
                                    Number(
                                        entry.change
                                    )
                                )
                                    ? Number(
                                        entry.change
                                    )
                                    : 0,

                            text:
                                String(
                                    entry.text
                                ),

                            date:
                                String(
                                    entry.date ||
                                    ""
                                )

                        };

                    }
                )
                .filter(
                    entry =>
                        Number.isFinite(
                            entry.value
                        ) &&
                        entry.text.trim() !== ""
                );
    }

} catch {

    notes = [];

}

/* =====================================================
   CARICA OBIETTIVI
===================================================== */

try {

    const savedGoals =
        JSON.parse(
            localStorage.getItem(
                GOALS_KEY
            )
        );

    if (
        Array.isArray(
            savedGoals
        )
    ) {

        goals =
            savedGoals
                .map(
                    goal => {

                        return {

                            value:
                                Number(
                                    goal.value
                                ),

                            name:
                                String(
                                    goal.name
                                )

                        };

                    }
                )
                .filter(
                    goal =>
                        Number.isFinite(
                            goal.value
                        ) &&
                        goal.name.trim() !== ""
                );
    }

} catch {

    goals = [];

}

/* =====================================================
   AVVIO
===================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;

    }

    startScreen.classList.add(
        "hidden"
    );

    updateDisplay();

} else {

    startScreen.classList.remove(
        "hidden"
    );

}

/* =====================================================
   POSIZIONE INIZIALE RAZZO
===================================================== */

requestAnimationFrame(
    () => {

        requestAnimationFrame(
            () => {

                stabilizeRocket();

            }
        );

    }
);

/* =====================================================
   CONTROLLO MOVIMENTO BODY
===================================================== */

let lastBodyTop =
    null;

function detectBodyMovement() {

    const rect =
        document.body.getBoundingClientRect();

    if (
        lastBodyTop === null
    ) {

        lastBodyTop =
            rect.top;

        return;

    }

    if (
        Math.abs(
            rect.top -
            lastBodyTop
        ) > 0.5
    ) {

        stabilizeRocket();

        lastBodyTop =
            rect.top;

    }

}

let keyboardMonitor =
    null;

function startKeyboardMonitor() {

    if (
        keyboardMonitor !== null
    ) {

        return;

    }

    keyboardMonitor =
        setInterval(
            () => {

                detectBodyMovement();

            },
            16
        );

}

function stopKeyboardMonitor() {

    if (
        keyboardMonitor !== null
    ) {

        clearInterval(
            keyboardMonitor
        );

        keyboardMonitor =
            null;

    }

}

document.addEventListener(
    "focusin",
    function() {

        startKeyboardMonitor();

    }
);

document.addEventListener(
    "focusout",
    function() {

        setTimeout(
            () => {

                if (
                    !document.activeElement ||
                    (
                        document.activeElement.tagName !==
                        "INPUT" &&
                        document.activeElement.tagName !==
                        "TEXTAREA"
                    )
                ) {

                    stopKeyboardMonitor();

                    stabilizeRocket();

                }

            },
            300
        );

    }
);

</script>
