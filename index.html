<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Rocket</title>


<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;
}

body {

    overflow: hidden;

    overscroll-behavior: none;
}


.app {

    position: relative;

    width: 100%;
    height: 100dvh;

    background: #000;

    overflow: hidden;
}


/* =========================================================
   AREA SCALA + NOTE
========================================================= */

.timeline {

    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior-y: contain;

    scrollbar-width: none;

    z-index: 10;
}

.timeline::-webkit-scrollbar {

    display: none;
}


/* =========================================================
   CONTENITORE DELLA SCALA
========================================================= */

.timeline-content {

    position: relative;

    width: 100%;

    /*
       La vera altezza viene impostata
       da JavaScript.

       È SEMPRE limitata a ±1000 €
       dal valore attuale.
    */

    height: 2000px;
}


/* =========================================================
   LINEA VERTICALE
========================================================= */

.center-line {

    position: absolute;

    left: 50%;

    width: 1px;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.18);

    pointer-events: none;
}


/* =========================================================
   TACCHETTE
========================================================= */

.tick {

    position: absolute;

    left: 50%;

    width: 6px;
    height: 1px;

    transform:
        translateX(-50%);

    background:
        rgba(255,255,255,0.20);

    pointer-events: none;
}


/*
   Ogni 250 €
*/

.tick.major {

    width: 11px;

    background:
        rgba(255,255,255,0.34);
}


/*
   ZERO
*/

.tick.zero {

    width: 16px;

    background:
        rgba(255,255,255,0.70);
}


/* =========================================================
   NUMERI DELLA SCALA
========================================================= */

.scale-label {

    position: absolute;

    left: calc(50% - 27px);

    transform:
        translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;

    font-weight: 500;

    pointer-events: none;

    opacity: 0.40;
}


/* =========================================================
   NOTE
========================================================= */

.note {

    position: absolute;

    left:
        calc(50% + 30px);

    transform:
        translateY(-50%);

    max-width:
        calc(50% - 40px);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 13px;

    pointer-events: none;
}


.note-value {

    font-weight: 700;

    margin-right: 7px;
}


.note-text {

    opacity: 0.82;
}


/* =========================================================
   INDICATORE CENTRALE FISSO
========================================================= */

.fixed-indicator {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 50;

    pointer-events: none;
}


/* =========================================================
   RAZZO
========================================================= */

.rocket {

    position: absolute;

    left: 8px;
    top: 0;

    width: 65px;
    height: 33px;

    transform:
        translateY(-50%);

    overflow: visible;

    pointer-events: none;

    transition:
        filter 0.25s ease;
}


.rocket-part {

    fill: #fff;

    transition:
        fill 0.25s ease;
}


.rocket-window {

    fill: #000;
}


/* =========================================================
   INFORMAZIONI ATTUALI
========================================================= */

.current-info {

    position: absolute;

    left: 86px;
    top: 0;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    pointer-events: auto;
}


.current-value {

    font-size: 22px;

    line-height: 27px;

    font-weight: 700;

    white-space: nowrap;

    transition:
        color 0.25s ease;
}


.current-note {

    width: 190px;

    height: 28px;

    margin-top: 1px;

    padding: 0;

    border: none;

    outline: none;

    background: transparent;

    color: #aaa;

    font-size: 13px;

    touch-action: auto;
}


.current-note::placeholder {

    color: #505050;
}


/* =========================================================
   CAMPO VARIAZIONE
========================================================= */

.controls {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 80;
}


.change-input {

    width: 175px;

    height: 50px;

    border:
        1px solid #363636;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 18px;

    font-weight: 600;

    touch-action: auto;
}


.change-input::placeholder {

    color: #505050;
}


.change-input:focus {

    border-color: #666;
}


.change-button {

    width: 55px;

    height: 50px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;
}


.change-button:active {

    transform:
        scale(0.96);
}


/* =========================================================
   RESET
========================================================= */

.reset-button {

    position: absolute;

    top:
        calc(
            13px +
            env(safe-area-inset-top)
        );

    right: 13px;

    height: 38px;

    padding:
        0 13px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}


/* =========================================================
   SCHERMATA INIZIALE
========================================================= */

.start-screen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background: #000;
}


.start-title {

    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 700;
}


.start-subtitle {

    margin-bottom: 24px;

    color: #777;

    font-size: 14px;

    text-align: center;
}


.start-input {

    width: 220px;

    height: 55px;

    border:
        1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 22px;

    font-weight: 600;

    touch-action: auto;
}


.start-input::placeholder {

    color: #555;
}


.start-button {

    width: 220px;

    height: 50px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 700;
}


.hidden {

    display: none !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    .rocket {

        width: 58px;
        height: 30px;
    }

    .current-info {

        left: 77px;
    }

    .current-value {

        font-size: 20px;
    }

    .current-note {

        width: 170px;
    }

    .note {

        font-size: 12px;
    }
}

</style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         TIMELINE
    ====================================================== -->

    <div
        id="timeline"
        class="timeline"
    >

        <div
            id="timelineContent"
            class="timeline-content"
        >

            <div
                id="centerLine"
                class="center-line"
            ></div>

            <div
                id="ticks"
            ></div>

            <div
                id="labels"
            ></div>

            <div
                id="notes"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         RAZZO + VALORE FISSI
    ====================================================== -->

    <div
        id="fixedIndicator"
        class="fixed-indicator"
    >


        <svg
            id="rocket"
            class="rocket"
            viewBox="0 0 100 50"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                class="rocket-part"
                d="
                    M 8 25
                    C 25 10,
                      52 7,
                      78 25
                    C 52 43,
                      25 40,
                      8 25
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M 65 13
                    C 82 15,
                      94 21,
                      99 25
                    C 94 29,
                      82 35,
                      65 37
                    Z
                "
            />

            <circle
                cx="68"
                cy="25"
                r="5"
                class="rocket-window"
            />

            <path
                class="rocket-part"
                d="
                    M 39 16
                    L 25 5
                    L 28 20
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M 39 34
                    L 25 45
                    L 28 30
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M 12 18
                    C 1 20,
                      1 30,
                      12 32
                    L 22 25
                    Z
                "
            />

        </svg>


        <div
            class="current-info"
        >

            <div
                id="currentValue"
                class="current-value"
            >
                0 €
            </div>


            <input
                id="currentNote"
                class="current-note"
                type="text"
                maxlength="100"
                autocomplete="off"
                placeholder="Nota..."
            >

        </div>

    </div>


    <!-- =====================================================
         CONTROLLI
    ====================================================== -->

    <div
        class="controls"
    >

        <input
            id="changeInput"
            class="change-input"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            placeholder="+ / - variazione"
        >

        <button
            id="changeButton"
            class="change-button"
        >
            OK
        </button>

    </div>


    <!-- =====================================================
         RESET
    ====================================================== -->

    <button
        id="resetButton"
        class="reset-button"
    >
        Reset
    </button>


    <!-- =====================================================
         SCHERMATA VALORE INIZIALE
    ====================================================== -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div
            class="start-title"
        >
            Rocket
        </div>


        <div
            class="start-subtitle"
        >
            Inserisci il valore iniziale
        </div>


        <input
            id="startInput"
            class="start-input"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            placeholder="Valore iniziale"
        >


        <button
            id="startButton"
            class="start-button"
        >
            OK
        </button>

    </div>

</div>


<script>


/* =========================================================
   STORAGE
========================================================= */

const START_KEY =
    "rocket-start-value";

const CURRENT_KEY =
    "rocket-current-value";

const NOTES_KEY =
    "rocket-notes";


/* =========================================================
   ELEMENTI
========================================================= */

const timeline =
    document.getElementById(
        "timeline"
    );

const timelineContent =
    document.getElementById(
        "timelineContent"
    );

const centerLine =
    document.getElementById(
        "centerLine"
    );

const ticks =
    document.getElementById(
        "ticks"
    );

const labels =
    document.getElementById(
        "labels"
    );

const notesContainer =
    document.getElementById(
        "notes"
    );

const currentValueElement =
    document.getElementById(
        "currentValue"
    );

const currentNote =
    document.getElementById(
        "currentNote"
    );

const changeInput =
    document.getElementById(
        "changeInput"
    );

const changeButton =
    document.getElementById(
        "changeButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startInput =
    document.getElementById(
        "startInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const rocket =
    document.getElementById(
        "rocket"
    );

const rocketParts =
    document.querySelectorAll(
        ".rocket-part"
    );


/* =========================================================
   DATI
========================================================= */

let startValue =
    parseStoredNumber(
        localStorage.getItem(
            START_KEY
        )
    );

let currentValue =
    parseStoredNumber(
        localStorage.getItem(
            CURRENT_KEY
        )
    );


let notes = {};

try {

    notes =
        JSON.parse(
            localStorage.getItem(
                NOTES_KEY
            )
        ) || {};

} catch {

    notes = {};

}


/* =========================================================
   CONFIGURAZIONE SCALA
========================================================= */

/*
   IMPORTANTE:

   Il valore attuale è al centro.

   Possiamo vedere:

       +1000 €
          ↑
       centro
          ↓
       -1000 €

   Non è possibile scorrere oltre.
*/


const RANGE =
    1000;


/*
   Una tacca ogni 25 €.
*/

const TICK_STEP =
    25;


/*
   Una posizione ogni 25 €.
*/

const PIXELS_PER_25 =
    28;


/*
   Pixel per euro.
*/

const PIXELS_PER_EURO =
    PIXELS_PER_25 /
    TICK_STEP;


/* =========================================================
   NUMERI
========================================================= */

function parseStoredNumber(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return NaN;
    }


    const number =
        Number(value);


    return Number.isFinite(number)
        ? number
        : NaN;
}


function parseInput(
    value
) {

    if (
        typeof value !==
        "string"
    ) {

        return NaN;
    }


    let text =
        value
        .trim()
        .replace(/\s/g, "")
        .replace(",", ".");


    if (
        text === ""
    ) {

        return NaN;
    }


    return Number(text);
}


/* =========================================================
   FORMATTA EURO
========================================================= */

function formatValue(
    value
) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;


    const absolute =
        Math.abs(
            rounded
        ).toLocaleString(
            "it-IT",
            {
                minimumFractionDigits:
                    Number.isInteger(
                        rounded
                    )
                        ? 0
                        : 2,

                maximumFractionDigits:
                    2
            }
        );


    if (
        rounded > 0
    ) {

        return "+" +
            absolute +
            " €";
    }


    if (
        rounded < 0
    ) {

        return "-" +
            absolute +
            " €";
    }


    return "0 €";
}


/* =========================================================
   COLORI
========================================================= */

/*
   REGOLA:

   0       = BIANCO

   POSITIVI = VERDE
   NEGATIVI = ROSSO


   Il colore cresce fino a 5000.

   Ogni 1000 € la differenza
   è volutamente evidente.
*/

function getValueColor(
    value
) {


    /* =====================================================
       ZERO
    ====================================================== */

    if (
        value === 0
    ) {

        return "rgb(255,255,255)";
    }


    /*
       Limite massimo colore.
    */

    const amount =
        Math.min(
            Math.abs(value),
            5000
        );


    /*
       Percentuale.
    */

    const t =
        amount / 5000;


    /* =====================================================
       POSITIVO = VERDE
    ====================================================== */

    if (
        value > 0
    ) {


        /*
           Verde iniziale già chiaramente
           visibile anche con valori piccoli.

           0 €
           ↓
           verde chiarissimo

           5000 €
           ↓
           verde scuro brillante
        */


        const startR = 245;
        const startG = 255;
        const startB = 245;


        const endR = 25;
        const endG = 215;
        const endB = 105;


        const r =
            Math.round(
                startR -
                (startR - endR) * t
            );


        const g =
            Math.round(
                startG -
                (startG - endG) * t
            );


        const b =
            Math.round(
                startB -
                (startB - endB) * t
            );


        return `rgb(${r},${g},${b})`;
    }


    /* =====================================================
       NEGATIVO = ROSSO
    ====================================================== */

    const startR = 255;
    const startG = 245;
    const startB = 245;


    const endR = 235;
    const endG = 35;
    const endB = 55;


    const r =
        Math.round(
            startR -
            (startR - endR) * t
        );


    const g =
        Math.round(
            startG -
            (startG - endG) * t
        );


    const b =
        Math.round(
            startB -
            (startB - endB) * t
        );


    return `rgb(${r},${g},${b})`;
}


/* =========================================================
   COLORE RAZZO
========================================================= */

function updateRocketColor() {

    const color =
        getValueColor(
            currentValue
        );


    rocketParts.forEach(
        part => {

            part.style.fill =
                color;
        }
    );


    currentValueElement.style.color =
        color;


    rocket.style.filter =
        `drop-shadow(0 0 8px ${color})`;
}


/* =========================================================
   COSTRUZIONE SCALA
========================================================= */

function buildScale() {


    ticks.innerHTML = "";
    labels.innerHTML = "";


    const height =
        window.innerHeight;


    /*
       L'intera area rappresenta:

       -1000
       fino
       +1000

       rispetto al valore attuale.
    */

    const totalHeight =
        RANGE *
        2 *
        PIXELS_PER_EURO;


    timelineContent.style.height =
        totalHeight +
        "px";


    /*
       Il centro della timeline
       corrisponde al valore attuale.
    */

    const centerY =
        totalHeight / 2;


    /*
       Linea centrale.
    */

    centerLine.style.top =
        "0px";

    centerLine.style.height =
        totalHeight +
        "px";


    /*
       Generiamo una tacca ogni 25 €.
    */

    for (
        let value =
            -RANGE;

        value <= RANGE;

        value += TICK_STEP
    ) {


        const y =
            centerY -
            value *
            PIXELS_PER_EURO;


        const tick =
            document.createElement(
                "div"
            );


        tick.className =
            "tick";


        /*
           Ogni 250 €
           tacca più evidente.
        */

        if (
            value % 250 === 0
        ) {

            tick.classList.add(
                "major"
            );
        }


        /*
           Lo zero.
        */

        if (
            value === 0
        ) {

            tick.classList.add(
                "zero"
            );
        }


        tick.style.top =
            y + "px";


        ticks.appendChild(
            tick
        );


        /*
           Numero ogni 250 €.
        */

        if (
            value % 250 === 0
        ) {


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "scale-label";


            label.style.top =
                y + "px";


            /*
               Il valore mostrato
               è relativo al valore attuale.
            */

            const realValue =
                currentValue +
                value;


            label.textContent =
                formatValue(
                    realValue
                );


            label.style.color =
                getValueColor(
                    realValue
                );


            labels.appendChild(
                label
            );
        }
    }
}


/* =========================================================
   NOTE
========================================================= */

function drawNotes() {


    notesContainer.innerHTML =
        "";


    const entries =
        Object.entries(
            notes
        )
        .map(
            ([value, text]) => ({

                value:
                    Number(value),

                text:
                    String(text)
            })
        )
        .filter(
            item =>
                Number.isFinite(
                    item.value
                )
        );


    /*
       ORDINE CRESCENTE REALE.

       Questo risolve anche il problema:

       -365 viene prima di -350

       perché -365 è matematicamente
       minore di -350.
    */

    entries.sort(
        (a, b) =>
            a.value -
            b.value
    );


    const centerY =
        timelineContent
        .clientHeight /
        2;


    /*
       Le note vengono posizionate
       in base alla loro posizione
       rispetto al valore attuale.

       La distanza è COMPATTA:

       non rappresenta realmente
       i 250 €.

       Serve soltanto a mantenere
       l'ordine.
    */


    const above =
        entries
        .filter(
            item =>
                item.value >
                currentValue
        )
        .sort(
            (a,b) =>
                b.value -
                a.value
        );


    const below =
        entries
        .filter(
            item =>
                item.value <
                currentValue
        )
        .sort(
            (a,b) =>
                b.value -
                a.value
        );


    /*
       Nota sopra.

       La più vicina al valore attuale
       è quella più vicina al razzo.
    */

    above.forEach(
        (item,index) => {


            const note =
                createNote(
                    item.value,
                    item.text
                );


            note.style.top =
                (
                    centerY -
                    55 -
                    index * 44
                ) +
                "px";


            notesContainer.appendChild(
                note
            );
        }
    );


    /*
       Nota sotto.
    */

    below.forEach(
        (item,index) => {


            const note =
                createNote(
                    item.value,
                    item.text
                );


            note.style.top =
                (
                    centerY +
                    55 +
                    index * 44
                ) +
                "px";


            notesContainer.appendChild(
                note
            );
        }
    );
}


/* =========================================================
   CREA UNA NOTA
========================================================= */

function createNote(
    value,
    text
) {


    const note =
        document.createElement(
            "div"
        );


    note.className =
        "note";


    /*
       Colore della nota = colore
       della posizione in cui è stata
       salvata.
    */

    const color =
        getValueColor(
            value
        );


    note.style.color =
        color;


    const valueElement =
        document.createElement(
            "span"
        );


    valueElement.className =
        "note-value";


    valueElement.textContent =
        formatValue(
            value
        );


    valueElement.style.color =
        color;


    const textElement =
        document.createElement(
            "span"
        );


    textElement.className =
        "note-text";


    textElement.textContent =
        text;


    textElement.style.color =
        color;


    note.appendChild(
        valueElement
    );


    note.appendChild(
        textElement
    );


    return note;
}


/* =========================================================
   SALVA NOTA
========================================================= */

function saveCurrentNote() {


    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        return;
    }


    const text =
        currentNote.value.trim();


    const key =
        String(
            currentValue
        );


    if (
        text === ""
    ) {

        delete notes[key];

    } else {

        notes[key] =
            text;
    }


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    drawNotes();
}


/* =========================================================
   CARICA NOTA
========================================================= */

function loadCurrentNote() {


    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentNote.value =
            "";

        return;
    }


    currentNote.value =
        notes[
            String(
                currentValue
            )
        ] || "";
}


/* =========================================================
   AGGIORNA SCHERMATA
========================================================= */

function updateDisplay() {


    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    updateRocketColor();


    buildScale();


    drawNotes();


    loadCurrentNote();


    /*
       Il valore attuale deve stare
       esattamente al centro della
       finestra di scrolling.
    */

    requestAnimationFrame(
        () => {

            timeline.scrollTop =
                (
                    timelineContent
                    .clientHeight -
                    timeline.clientHeight
                ) / 2;

        }
    );
}


/* =========================================================
   IMPOSTA VALORE INIZIALE
========================================================= */

function setInitialValue() {


    const value =
        parseInput(
            startInput.value
        );


    if (
        !Number.isFinite(
            value
        )
    ) {

        startInput.focus();

        return;
    }


    startValue =
        value;


    currentValue =
        value;


    /*
       Nuovo progetto:

       le note vengono azzerate
       soltanto quando viene impostato
       un nuovo valore iniziale.
    */

    notes = {};


    localStorage.setItem(
        START_KEY,
        String(
            startValue
        )
    );


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();
}


/* =========================================================
   APPLICA VARIAZIONE
========================================================= */

function applyChange() {


    const change =
        parseInput(
            changeInput.value
        );


    if (
        !Number.isFinite(
            change
        )
    ) {

        changeInput.focus();

        return;
    }


    /*
       Prima salviamo la nota
       associata al valore attuale.
    */

    saveCurrentNote();


    /*
       QUI il valore cambia davvero.

       Esempio:

       iniziale -3000

       +1000

       = -2000
    */

    currentValue =
        currentValue +
        change;


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    changeInput.value =
        "";


    updateDisplay();
}


/* =========================================================
   RESET
========================================================= */

function resetApp() {


    const confirmed =
        confirm(
            "Vuoi resettare tutto e inserire un nuovo valore iniziale?"
        );


    if (
        !confirmed
    ) {

        return;
    }


    localStorage.removeItem(
        START_KEY
    );


    localStorage.removeItem(
        CURRENT_KEY
    );


    localStorage.removeItem(
        NOTES_KEY
    );


    startValue =
        NaN;


    currentValue =
        NaN;


    notes = {};


    startInput.value =
        "";

    changeInput.value =
        "";

    currentNote.value =
        "";


    startScreen.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {

            startInput.focus();

        },
        100
    );
}


/* =========================================================
   EVENTI
========================================================= */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();
        }
    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();
        }
    }
);


currentNote.addEventListener(
    "blur",
    saveCurrentNote
);


currentNote.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            saveCurrentNote();

            currentNote.blur();
        }
    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (
            Number.isFinite(
                currentValue
            )
        ) {

            updateDisplay();
        }
    }
);


/* =========================================================
   AVVIO
========================================================= */

if (
    Number.isFinite(
        startValue
    )
) {


    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;
    }


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

} else {


    startScreen.classList.remove(
        "hidden"
    );
}

</script>
