<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0,
           viewport-fit=cover, user-scalable=no"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;

    touch-action: none;
}

.app {
    position: relative;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;
}


/* =========================================================
   AREA SCALA
========================================================= */

#world {
    position: absolute;

    inset: 0;

    overflow: hidden;

    touch-action: none;
}

#scaleWorld {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    will-change: transform;

    pointer-events: none;
}


/* =========================================================
   LINEA VERTICALE
========================================================= */

.center-line {
    position: absolute;

    left: 50%;

    top: -50000px;

    width: 1px;
    height: 100000px;

    background: rgba(255,255,255,0.30);

    transform: translateX(-50%);
}


/* =========================================================
   TACCHETTE
========================================================= */

.tick {
    position: absolute;

    left: 50%;

    width: 7px;
    height: 1px;

    background: rgba(255,255,255,0.28);

    transform: translateX(-50%);
}

.tick.major {
    width: 11px;

    background: rgba(255,255,255,0.40);
}

.tick.zero {
    width: 16px;

    background: rgba(255,255,255,0.65);
}


/* =========================================================
   VALORI DELLA SCALA
========================================================= */

.scale-label {
    position: absolute;

    left: calc(50% - 34px);

    transform: translate(-100%, -50%);

    white-space: nowrap;

    font-size: 11px;

    color: rgba(255,255,255,0.28);

    pointer-events: none;
}


/* =========================================================
   NOTE
========================================================= */

.floating-note {
    position: absolute;

    left: calc(50% + 25px);

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 7px;

    white-space: nowrap;

    font-size: 12px;

    pointer-events: none;

    transition:
        top 0.25s ease,
        color 0.25s ease;
}

.floating-note-value {
    font-weight: 600;
}

.floating-note-text {
    opacity: 0.72;
}


/* =========================================================
   INDICATORE CENTRALE
========================================================= */

#indicator {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 40;

    pointer-events: none;
}


/* =========================================================
   RAZZO
========================================================= */

.rocket {
    position: absolute;

    left: 8px;
    top: 50%;

    width: 64px;
    height: 32px;

    transform: translateY(-50%);

    transition:
        filter 0.25s ease;
}


/* =========================================================
   VALORE ATTUALE
========================================================= */

.current-info {
    position: absolute;

    left: 82px;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    flex-direction: column;

    min-width: 150px;

    pointer-events: auto;
}

.current-value {
    font-size: 21px;

    line-height: 26px;

    font-weight: 600;

    transition:
        color 0.25s ease;
}

.current-note {
    width: 180px;

    height: 27px;

    margin-top: 2px;

    padding: 0;

    border: none;
    outline: none;

    background: transparent;

    color: #999;

    font-size: 13px;

    touch-action: auto;
}

.current-note::placeholder {
    color: #444;
}


/* =========================================================
   CONTROLLI
========================================================= */

.controls {
    position: absolute;

    left: 50%;

    bottom:
        calc(
            22px +
            env(safe-area-inset-bottom)
        );

    transform: translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 60;
}

.change-input {
    width: 175px;
    height: 50px;

    padding: 0 14px;

    border: 1px solid #383838;
    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 18px;
    font-weight: 600;

    touch-action: auto;
}

.change-input::placeholder {
    color: #4b4b4b;
}

.change-input:focus {
    border-color: #666;
}

.change-button {
    width: 55px;
    height: 50px;

    border: none;
    border-radius: 13px;

    background: #fff;
    color: #000;

    font-size: 15px;
    font-weight: 700;
}

.change-button:active {
    transform: scale(0.96);
}


/* =========================================================
   RESET
========================================================= */

.reset-button {
    position: absolute;

    top:
        calc(
            14px +
            env(safe-area-inset-top)
        );

    right: 14px;

    height: 38px;

    padding: 0 13px;

    border: none;
    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 70;
}


/* =========================================================
   SCHERMATA INIZIALE
========================================================= */

.start-screen {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {
    margin-bottom: 9px;

    font-size: 30px;

    font-weight: 600;
}

.start-subtitle {
    margin-bottom: 24px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {
    width: 220px;
    height: 55px;

    border: 1px solid #444;
    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 22px;
    font-weight: 600;

    touch-action: auto;
}

.start-input::placeholder {
    color: #555;
}

.start-button {
    width: 220px;
    height: 50px;

    margin-top: 15px;

    border: none;
    border-radius: 14px;

    background: #fff;
    color: #000;

    font-size: 16px;
    font-weight: 700;
}

.hidden {
    display: none !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    .rocket {
        width: 58px;
        height: 29px;
    }

    .current-info {
        left: 74px;
    }

    .current-value {
        font-size: 20px;
    }

    .floating-note {
        font-size: 11px;
    }
}

</style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         SCALA
    ====================================================== -->

    <div id="world">

        <div id="scaleWorld">

            <div class="center-line"></div>

            <div id="ticks"></div>

            <div id="labels"></div>

            <div id="notes"></div>

        </div>

    </div>


    <!-- =====================================================
         INDICATORE FISSO AL CENTRO
    ====================================================== -->

    <div id="indicator">

        <!-- RAZZO ORIZZONTALE -->

        <svg
            id="rocket"
            class="rocket"
            viewBox="0 0 100 50"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                d="
                    M 8 25
                    C 25 10,
                      52 7,
                      78 25
                    C 52 43,
                      25 40,
                      8 25
                    Z
                "
                fill="white"
            />

            <path
                d="
                    M 65 13
                    C 82 15,
                      94 21,
                      99 25
                    C 94 29,
                      82 35,
                      65 37
                    Z
                "
                fill="white"
            />

            <circle
                cx="68"
                cy="25"
                r="5"
                fill="black"
            />

            <path
                d="
                    M 39 16
                    L 25 5
                    L 28 20
                    Z
                "
                fill="white"
            />

            <path
                d="
                    M 39 34
                    L 25 45
                    L 28 30
                    Z
                "
                fill="white"
            />

            <path
                d="
                    M 12 18
                    C 1 20,
                      1 30,
                      12 32
                    L 22 25
                    Z
                "
                fill="white"
            />

        </svg>


        <!-- VALORE + NOTA -->

        <div class="current-info">

            <div
                id="currentValue"
                class="current-value"
            >
                0 €
            </div>

            <input
                id="currentNote"
                class="current-note"
                type="text"
                maxlength="100"
                autocomplete="off"
                placeholder="Nota..."
            >

        </div>

    </div>


    <!-- =====================================================
         VARIAZIONE
    ====================================================== -->

    <div class="controls">

        <input
            id="changeInput"
            class="change-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="+ / - variazione"
        >

        <button
            id="changeButton"
            class="change-button"
        >
            OK
        </button>

    </div>


    <!-- =====================================================
         RESET
    ====================================================== -->

    <button
        id="resetButton"
        class="reset-button"
    >
        Reset
    </button>


    <!-- =====================================================
         VALORE INIZIALE
    ====================================================== -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div class="start-title">
            Rocket
        </div>

        <div class="start-subtitle">
            Inserisci il valore iniziale
        </div>

        <input
            id="startInput"
            class="start-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="Valore iniziale"
        >

        <button
            id="startButton"
            class="start-button"
        >
            OK
        </button>

    </div>

</div>


<script>

/* =========================================================
   MEMORIA
========================================================= */

const START_KEY =
    "rocket-start-value";

const CURRENT_KEY =
    "rocket-current-value";

const NOTES_KEY =
    "rocket-notes";


/* =========================================================
   ELEMENTI
========================================================= */

const world =
    document.getElementById("world");

const scaleWorld =
    document.getElementById("scaleWorld");

const ticks =
    document.getElementById("ticks");

const labels =
    document.getElementById("labels");

const notesContainer =
    document.getElementById("notes");

const currentValueElement =
    document.getElementById("currentValue");

const currentNote =
    document.getElementById("currentNote");

const changeInput =
    document.getElementById("changeInput");

const changeButton =
    document.getElementById("changeButton");

const resetButton =
    document.getElementById("resetButton");

const startScreen =
    document.getElementById("startScreen");

const startInput =
    document.getElementById("startInput");

const startButton =
    document.getElementById("startButton");

const rocket =
    document.getElementById("rocket");


/* =========================================================
   DATI
========================================================= */

let startValue =
    parseStoredNumber(
        localStorage.getItem(START_KEY)
    );

let currentValue =
    parseStoredNumber(
        localStorage.getItem(CURRENT_KEY)
    );


let notes = {};

try {

    notes =
        JSON.parse(
            localStorage.getItem(NOTES_KEY)
        ) || {};

} catch {

    notes = {};

}


/* =========================================================
   POSIZIONE DELLA SCALA
========================================================= */

/*
   Questo valore indica quanto è stata
   spostata manualmente la scala.
*/

let manualScroll = 0;

let dragging = false;

let dragStartY = 0;

let dragStartScroll = 0;


/*
   Valore che deve trovarsi al centro.
*/

let centeredValue = 0;


/* =========================================================
   SCALA
========================================================= */

/*
   Ogni 25 € abbiamo una tacca.

   Le tacche sono volutamente piccole.
*/

const PIXELS_PER_25 =
    17;


/*
   Quindi:

   25 €  = 17 px
   50 €  = 34 px
   250 € = 170 px
*/

const PIXELS_PER_EURO =
    PIXELS_PER_25 / 25;


/* =========================================================
   FUNZIONI NUMERICHE
========================================================= */

function parseStoredNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return NaN;
    }

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : NaN;
}


function parseInput(value) {

    if (
        typeof value !== "string"
    ) {
        return NaN;
    }

    let text =
        value.trim();

    if (
        text === ""
    ) {
        return NaN;
    }


    /*
       Permette:

       300
       +300
       -300
       300,50
       -300,50
    */

    text =
        text.replace(
            /\s/g,
            ""
        );


    text =
        text.replace(
            ",",
            "."
        );


    return Number(text);
}


/* =========================================================
   FORMATTA EURO
========================================================= */

function formatValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;


    const absolute =
        Math.abs(
            rounded
        ).toLocaleString(
            "it-IT",
            {
                minimumFractionDigits:
                    Number.isInteger(rounded)
                        ? 0
                        : 2,

                maximumFractionDigits: 2
            }
        );


    if (
        rounded > 0
    ) {

        return "+" +
            absolute +
            " €";
    }


    if (
        rounded < 0
    ) {

        return "-" +
            absolute +
            " €";
    }


    return "0 €";
}


/* =========================================================
   COLORE
========================================================= */

/*
   Questa funzione è la stessa per:

   - razzo
   - valore attuale
   - nota
   - valore della nota

   Quindi ogni elemento mantiene
   il colore corrispondente AL SUO
   valore.
*/

function getValueColor(value) {

    /*
       ZERO = BIANCO
    */

    if (
        value === 0
    ) {
        return "rgb(255,255,255)";
    }


    /*
       MASSIMO COLORE:

       5000 €

       Oltre 5000 rimane uguale.
    */

    const MAX =
        5000;


    const amount =
        Math.min(
            Math.abs(value),
            MAX
        );


    /*
       Intensità da 0 a 1.
    */

    const intensity =
        amount / MAX;


    /*
       POSITIVO

       Verde brillante.

       Partenza:
       quasi bianco.

       Arrivo:
       verde scuro ma brillante.
    */

    if (
        value > 0
    ) {

        /*
           Verde massimo volutamente
           non troppo scuro.

           RGB finale circa:

           45, 220, 125
        */

        const r =
            Math.round(
                255 -
                (255 - 45) *
                intensity
            );

        const g =
            Math.round(
                255 -
                (255 - 220) *
                intensity
            );

        const b =
            Math.round(
                255 -
                (255 - 125) *
                intensity
            );


        return `rgb(${r}, ${g}, ${b})`;
    }


    /*
       NEGATIVO

       Partenza:
       rosa chiarissimo.

       Arrivo:
       rosso scuro ma brillante.
    */

    const r =
        Math.round(
            255 -
            (255 - 235) *
            intensity
        );

    const g =
        Math.round(
            255 -
            (255 - 65) *
            intensity
        );

    const b =
        Math.round(
            255 -
            (255 - 75) *
            intensity
        );


    return `rgb(${r}, ${g}, ${b})`;
}


/* =========================================================
   APPLICA COLORE
========================================================= */

function updateColors() {

    const color =
        getValueColor(
            currentValue
        );


    currentValueElement.style.color =
        color;


    rocket.style.filter =
        `drop-shadow(0 0 5px ${color})`;


    /*
       Il razzo SVG è bianco.
       Lo coloriamo usando CSS.
    */

    rocket.style.fill =
        color;

}


/* =========================================================
   CREA SCALA
========================================================= */

function drawScale() {

    ticks.innerHTML =
        "";

    labels.innerHTML =
        "";


    /*
       Creiamo abbastanza scala
       per poter scorrere liberamente
       intorno al valore attuale.

       Non esiste un limite al valore.
       La scala viene generata dinamicamente
       quando serve.
    */

    const visibleHeight =
        window.innerHeight;


    const amount =
        Math.ceil(
            visibleHeight /
            PIXELS_PER_25
        ) + 20;


    /*
       Centinaia di tacche vengono
       generate intorno al valore
       attualmente centrato.
    */

    for (
        let i = -amount;
        i <= amount;
        i++
    ) {

        const value =
            centeredValue +
            i * 25;


        const y =
            window.innerHeight / 2 -
            (
                value -
                centeredValue
            ) *
            PIXELS_PER_EURO;


        const tick =
            document.createElement(
                "div"
            );


        tick.className =
            "tick";


        if (
            value === 0
        ) {

            tick.classList.add(
                "zero"
            );

        }
        else if (
            Math.abs(value) % 250 === 0
        ) {

            tick.classList.add(
                "major"
            );

        }


        tick.style.top =
            y + "px";


        ticks.appendChild(
            tick
        );


        /*
           Numero ogni 250 €.

           Non scriviamo tutti i numeri,
           altrimenti lo schermo diventerebbe
           troppo affollato.
        */

        if (
            Math.abs(value) % 250 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "scale-label";


            label.style.top =
                y + "px";


            label.textContent =
                formatValue(
                    value
                );


            label.style.color =
                getValueColor(
                    value
                );


            label.style.opacity =
                "0.25";


            labels.appendChild(
                label
            );

        }

    }

}


/* =========================================================
   POSIZIONA SCALA
========================================================= */

function centerScaleOnCurrentValue() {

    /*
       Il valore attuale deve essere
       esattamente al centro.

       Il razzo non si muove.

       Si muove soltanto la scala.
    */

    centeredValue =
        currentValue;


    manualScroll =
        0;


    scaleWorld.style.transform =
        "translateY(0px)";


    drawScale();

    drawNotes();

}


/* =========================================================
   CREA NOTA
========================================================= */

function createNote(
    value,
    text,
    y
) {

    const note =
        document.createElement(
            "div"
        );


    note.className =
        "floating-note";


    note.style.top =
        y + "px";


    /*
       IMPORTANTE:

       Il colore dipende dal valore
       DELLA NOTA.

       Non dal valore attuale.
    */

    const color =
        getValueColor(
            value
        );


    note.style.color =
        color;


    const number =
        document.createElement(
            "span"
        );


    number.className =
        "floating-note-value";


    number.textContent =
        formatValue(
            value
        );


    number.style.color =
        color;


    const noteText =
        document.createElement(
            "span"
        );


    noteText.className =
        "floating-note-text";


    noteText.textContent =
        text;


    noteText.style.color =
        color;


    note.appendChild(
        number
    );


    note.appendChild(
        noteText
    );


    notesContainer.appendChild(
        note
    );

}


/* =========================================================
   DISEGNA NOTE
========================================================= */

function drawNotes() {

    notesContainer.innerHTML =
        "";


    const entries =
        Object.entries(
            notes
        )
        .map(
            ([value, text]) => ({
                value:
                    Number(value),

                text:
                    String(text)
            })
        )
        .filter(
            item =>
                Number.isFinite(
                    item.value
                )
        );


    /*
       ORDINE NUMERICO REALE.

       -3500
       -3000
       -2500
       -1000
       0
       +1000
       +3000
    */

    entries.sort(
        (a, b) =>
            a.value -
            b.value
    );


    /*
       Distanzamento visual.

       Non dipende dalla distância
       monetaria.

       Serve per evitar enormes
       espaços vazios.
    */

    const spacing =
        38;


    /*
       NOTE SUPERIORI

       Se:

       nota > valore attuale

       allora va sopra.
    */

    const above =
        entries
        .filter(
            item =>
                item.value >
                currentValue
        )
        .sort(
            (a, b) =>
                b.value -
                a.value
        );


    /*
       NOTE INFERIORI

       Se:

       nota < valore attuale

       allora va sotto.
    */

    const below =
        entries
        .filter(
            item =>
                item.value <
                currentValue
        )
        .sort(
            (a, b) =>
                b.value -
                a.value
        );


    /*
       Nota esattamente sul valore
       attuale.

       La mettiamo subito sotto
       il valore attuale.
    */

    const same =
        entries.filter(
            item =>
                item.value ===
                currentValue
        );


    /*
       SOPRA
    */

    above.forEach(
        (item, index) => {

            createNote(
                item.value,
                item.text,

                window.innerHeight / 2 -
                spacing *
                (index + 1)
            );

        }
    );


    /*
       SOTTO
    */

    below.forEach(
        (item, index) => {

            createNote(
                item.value,
                item.text,

                window.innerHeight / 2 +
                spacing *
                (index + 1)
            );

        }
    );


    /*
       STESSO VALORE
    */

    same.forEach(
        (item, index) => {

            createNote(
                item.value,
                item.text,

                window.innerHeight / 2 +
                36 +
                index * spacing
            );

        }
    );

}


/* =========================================================
   SALVA NOTA
========================================================= */

function saveCurrentNote() {

    const text =
        currentNote.value.trim();


    const key =
        String(
            currentValue
        );


    if (
        text === ""
    ) {

        delete notes[key];

    }
    else {

        notes[key] =
            text;

    }


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    drawNotes();

}


/* =========================================================
   CARICA NOTA
========================================================= */

function loadCurrentNote() {

    currentNote.value =
        notes[
            String(
                currentValue
            )
        ] || "";

}


/* =========================================================
   AGGIORNA SCHERMATA
========================================================= */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    updateColors();

    loadCurrentNote();

    centerScaleOnCurrentValue();

}


/* =========================================================
   VALORE INIZIALE
========================================================= */

function setInitialValue() {

    const value =
        parseInput(
            startInput.value
        );


    if (
        !Number.isFinite(
            value
        )
    ) {

        startInput.focus();

        return;

    }


    startValue =
        value;


    currentValue =
        value;


    notes =
        {};


    localStorage.setItem(
        START_KEY,
        String(
            startValue
        )
    );


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

}


/* =========================================================
   VARIAZIONE
========================================================= */

function applyChange() {

    const change =
        parseInput(
            changeInput.value
        );


    if (
        !Number.isFinite(
            change
        )
    ) {

        changeInput.focus();

        return;

    }


    /*
       Prima salviamo l'eventuale
       nota del valore precedente.
    */

    saveCurrentNote();


    /*
       QUESTA È LA FUNZIONE PRINCIPALE:

       valore attuale
       +
       variazione
       =
       nuovo valore
    */

    currentValue =
        currentValue +
        change;


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    changeInput.value =
        "";


    /*
       Il nuovo valore diventa
       il punto centrale della scala.
    */

    updateDisplay();

}


/* =========================================================
   RESET
========================================================= */

function resetApp() {

    const ok =
        window.confirm(
            "Vuoi cancellare il valore attuale e tutte le note?"
        );


    if (
        !ok
    ) {

        return;

    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        NOTES_KEY
    );


    startValue =
        NaN;


    currentValue =
        0;


    notes =
        {};


    currentNote.value =
        "";

    changeInput.value =
        "";


    startInput.value =
        "";


    scaleWorld.style.transform =
        "translateY(0px)";


    startScreen.classList.remove(
        "hidden"
    );


    startInput.focus();

}


/* =========================================================
   SCROLL TOUCH
========================================================= */

world.addEventListener(
    "touchstart",
    function(event) {

        /*
           Se tocchiamo un input,
           non iniziamo lo scroll.
        */

        if (
            event.target.closest(
                "input"
            )
        ) {

            return;

        }


        if (
            event.touches.length !== 1
        ) {

            return;

        }


        dragging =
            true;


        dragStartY =
            event.touches[0].clientY;


        dragStartScroll =
            manualScroll;

    },
    {
        passive: false
    }
);


world.addEventListener(
    "touchmove",
    function(event) {

        if (
            !dragging
        ) {

            return;

        }


        if (
            event.touches.length !== 1
        ) {

            return;

        }


        event.preventDefault();


        const y =
            event.touches[0].clientY;


        const delta =
            y -
            dragStartY;


        manualScroll =
            dragStartScroll +
            delta;


        scaleWorld.style.transform =
            `translateY(${manualScroll}px)`;

    },
    {
        passive: false
    }
);


world.addEventListener(
    "touchend",
    function() {

        dragging =
            false;

    }
);


world.addEventListener(
    "touchcancel",
    function() {

        dragging =
            false;

    }
);


/* =========================================================
   EVENTI
========================================================= */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();

        }

    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            applyChange();

        }

    }
);


currentNote.addEventListener(
    "blur",
    saveCurrentNote
);


currentNote.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            saveCurrentNote();

            currentNote.blur();

        }

    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (
            Number.isFinite(
                currentValue
            )
        ) {

            centerScaleOnCurrentValue();

        }

    }
);


/* =========================================================
   AVVIO
========================================================= */

if (
    Number.isFinite(
        startValue
    )
) {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;

    }


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

}
else {

    startScreen.classList.remove(
        "hidden"
    );

}

</script>

</body>
</html>
