<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;

    overscroll-behavior: none;
}

html {
    position: fixed;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {
    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: pan-y;
}


/* =====================================================
   PALCO APP
===================================================== */

.app {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100vh;

    height: 100svh;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   SCALA
===================================================== */

.timeline {

    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;

    overscroll-behavior-y: contain;

    z-index: 10;

    touch-action: pan-y;
}

.timeline::-webkit-scrollbar {
    display: none;
}

.timeline-content {

    position: relative;

    width: 100%;

    height: 2400px;
}


/* =====================================================
   LINEA CENTRALE
===================================================== */

.center-line {

    position: absolute;

    top: 0;
    left: 50%;

    width: 1px;
    height: 100%;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.18);

    pointer-events: none;
}


/* =====================================================
   TACCHETTE
===================================================== */

.tick {

    position: absolute;

    left: 50%;

    width: 6px;
    height: 1px;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.20);

    pointer-events: none;
}

.tick.major {

    width: 11px;

    background:
        rgba(255,255,255,0.35);
}

.tick.zero {

    width: 17px;

    background:
        rgba(255,255,255,0.75);
}


/* =====================================================
   NUMERI SCALA
===================================================== */

.scale-label {

    position: absolute;

    left: calc(50% - 25px);

    transform:
        translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;

    font-weight: 500;

    opacity: 0.65;

    pointer-events: none;
}


/* =====================================================
   PUNTO FISSO VALORE ATTUALE
===================================================== */

.current-point {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 9px;
    height: 9px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    z-index: 65;

    pointer-events: none;

    box-shadow:
        0 0 7px currentColor;
}


/* =====================================================
   OBIETTIVI
===================================================== */

.goals-layer {

    position: absolute;

    top: 50%;

    left: 7px;

    width: calc(50% - 45px);

    max-height: 58vh;

    transform:
        translateY(-50%);

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    z-index: 50;

    pointer-events: auto;

    -webkit-overflow-scrolling: touch;
}

.goals-layer::-webkit-scrollbar {
    display: none;
}


/* =====================================================
   SINGOLO OBIETTIVO
===================================================== */

.goal-item {

    width: 100%;

    margin-bottom: 14px;

    padding-bottom: 10px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

    font-size: 12px;

    line-height: 17px;

    word-break: break-word;

    user-select: none;

    -webkit-user-select: none;
}

.goal-value {

    display: inline-block;

    margin-right: 5px;

    font-weight: 700;
}

.goal-text {

    opacity: 0.90;
}

.goal-delete {

    float: right;

    width: 19px;
    height: 19px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background: #1b1b1b;

    color: #777;

    font-size: 11px;

    line-height: 19px;

    text-align: center;
}

.goal-delete:active {

    transform:
        scale(0.9);
}


/* =====================================================
   NOTE
===================================================== */

.notes-layer {

    position: absolute;

    top: 50%;

    right: 7px;

    width: calc(50% - 40px);

    max-height: 58vh;

    transform:
        translateY(-50%);

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    z-index: 50;

    pointer-events: auto;

    -webkit-overflow-scrolling: touch;
}

.notes-layer::-webkit-scrollbar {
    display: none;
}


/* =====================================================
   NOTA SINGOLA
===================================================== */

.note {

    width: 100%;

    margin-bottom: 14px;

    padding-bottom: 10px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

    font-size: 12px;

    line-height: 16px;

    word-break: break-word;

    user-select: none;

    -webkit-user-select: none;
}


/*
   VARIAZIONE
*/

.note-change {

    display: inline;

    margin-right: 4px;

    font-weight: 700;
}


/*
   VALORE RAGGIUNTO
*/

.note-value {

    display: inline;

    margin-right: 5px;

    font-weight: 700;
}


/*
   TESTO NOTA
*/

.note-text {

    display: inline;

    color: #fff !important;

    opacity: 1;
}


/*
   CANCELLA NOTA
*/

.note-delete {

    float: right;

    width: 19px;
    height: 19px;

    padding: 0;

    margin-left: 4px;

    border: none;

    border-radius: 50%;

    background: #1b1b1b;

    color: #777;

    font-size: 11px;

    line-height: 19px;

    text-align: center;
}

.note-delete:active {

    transform:
        scale(0.9);
}


/* =====================================================
   RAZZO
===================================================== */

.rocket-layer {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 70;

    pointer-events: none;

    will-change: transform;
}

.rocket {

    position: absolute;

    right: 8px;
    left: auto;
    top: 0;

    width: 58px;
    height: 29px;

    transform:
        translateY(-50%);

    overflow: visible;

    transition:
        filter 0.2s ease;
}

.rocket-part {

    fill: #fff;

    transition:
        fill 0.2s ease;
}

.rocket-window {

    fill: #000;
}


/* =====================================================
   VALORE ATTUALE
===================================================== */

.current-info {

    position: absolute;

    left: 76px;
    top: 0;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    pointer-events: none;
}

.current-value {

    font-size: 20px;

    line-height: 25px;

    font-weight: 700;

    white-space: nowrap;

    transition:
        color 0.2s ease;
}


/* =====================================================
   CONTROLLI
===================================================== */

.controls {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            16px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;

    z-index: 80;
}

.change-row {

    display: flex;

    align-items: center;

    gap: 8px;
}

.change-input {

    width: 175px;
    height: 49px;

    padding: 0 12px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 17px;

    font-weight: 600;
}

.change-input::placeholder {

    color: #555;
}

.note-input {

    width: 175px;
    height: 49px;

    padding: 0 12px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 15px;

    font-weight: 500;
}

.note-input::placeholder {

    color: #555;
}

.change-button {

    width: 55px;
    height: 49px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;
}

.change-button:active {

    transform:
        scale(0.96);
}


/* =====================================================
   PULSANTE +
===================================================== */

.plus-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    left: 12px;

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;

    border-radius: 12px;

    background: #181818;

    color: #fff;

    font-size: 27px;

    font-weight: 300;

    line-height: 42px;

    text-align: center;

    z-index: 90;
}

.plus-button:active {

    transform:

}


/* =====================================================
   RESET
===================================================== */

.reset-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    right: 12px;

    height: 37px;

    padding: 0 13px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}


/* =====================================================
   MODALE OBIETTIVO
===================================================== */

.goal-modal {

    position: absolute;

    inset: 0;

    z-index: 200;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,0.72);

    backdrop-filter:

    -webkit-backdrop-filter:

}

.goal-box {

    width: min(
        330px,
        calc(100vw - 50px)
    );

    padding: 22px;

    border:
        1px solid #292929;

    border-radius: 18px;

    background: #111;
}

.goal-title {

    margin-bottom: 17px;

    font-size: 20px;

    font-weight: 700;
}

.goal-input {

    width: 100%;
    height: 49px;

    margin-bottom: 9px;

    padding: 0 13px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #080808;

    color: #fff;

    font-size: 16px;

    text-align: center;
}

.goal-input::placeholder {

    color: #555;
}

.goal-actions {

    display: flex;

    gap: 8px;

    margin-top: 6px;
}

.goal-cancel,
.goal-save {

    flex: 1;

    height: 47px;

    border: none;

    border-radius: 13px;

    font-size: 15px;

    font-weight: 700;
}

.goal-cancel {

    background: #202020;

    color: #aaa;
}

.goal-save {

    background: #fff;

    color: #000;
}


/* =====================================================
   SCHERMATA INIZIALE
===================================================== */

.start-screen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {

    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 700;
}

.start-subtitle {

    margin-bottom: 23px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {

    width: 220px;
    height: 54px;

    padding: 0 10px;

    border:
        1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 21px;

    font-weight: 600;
}

.start-input::placeholder {

    color: #555;
}

.start-button {

    width: 220px;
    height: 49px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 700;
}

.hidden {

    display: none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    .rocket {

        width: 56px;
        height: 28px;
    }

    .current-info {

        left: 73px;
    }

    .current-value {

        font-size: 19px;
    }

    .goals-layer {

        left: 7px;

        width:
            calc(50% - 40px);
    }

    .notes-layer {

        right: 7px;

        width:
            calc(50% - 40px);
    }

    .goal-item,
    .note {

        font-size: 11px;

        line-height: 16px;
    }

}


/* =====================================================
   TASTIERA IOS
   L'APP NON VIENE RICENTRATA.
   LA TASTIERA SI SOVRAPPONE.
===================================================== */

@supports (-webkit-touch-callout: none) {

    html,
    body,
    .app {

        height: 100vh;
        min-height: 100vh;
        max-height: 100vh;
    }

}

</style>

</head>

const STEP =

const PIXELS_PER_STEP =
    27;

const PIXELS_PER_EURO =
    PIXELS_PER_STEP / STEP;


/* =====================================================
   NUMERI
===================================================== */

function parseNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return NaN;
    }

    let text =
        String(value).trim();

    if (
        text === ""
    ) {
        return NaN;
    }

    text =
        text.replace(
            /\s/g,
            ""
        );

    if (
        text.includes(",")
    ) {

        text =
            text.replace(
                /\./g,
                ""
            );

        text =
            text.replace(
                ",",
                "."
            );

    } else {

        text =
            text.replace(
                /^([+-]?\d+)\.(\d{3})$/,
                "$1$2"
            );
    }

    const number =
        Number(text);

    return Number.isFinite(number)
        ? number
        : NaN;
}


/* =====================================================
   FORMATTAZIONE
===================================================== */

function formatValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;

    const absolute =
        Math.abs(rounded)
            .toLocaleString(
                "it-IT",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );

    if (
        rounded > 0
    ) {

        return "+" +
            absolute +
            " €";
    }

    if (
        rounded < 0
    ) {

        return "-" +
            absolute +
            " €";
    }

    return "0 €";
}


/* =====================================================
   COLORI
===================================================== */

function getValueColor(value) {

    if (
        value === 0
    ) {
        return "#FFFFFF";
    }

    if (
        value > 0
    ) {

        if (
            value <= 1000
        ) {
            return "#B8FFD0";
        }

        if (
            value <= 2000
        ) {
            return "#62F28A";
        }

        if (
            value <= 3000
        ) {
            return "#20DD65";
        }

        if (
            value <= 4000
        ) {
            return "#08C951";
        }

        return "#00A83F";
    }

    const amount =
        Math.abs(value);

    if (
        amount <= 1000
    ) {
        return "#FFB9C0";
    }

    if (
        amount <= 2000
    ) {
        return "#FF6877";
    }

    if (
        amount <= 3000
    ) {
        return "#F8374C";
    }

    if (
        amount <= 4000
    ) {
        return "#E91E35";
    }

    return "#C90020";
}


/* =====================================================
   COLORE RAZZO + PUNTO
===================================================== */

function updateColor() {

    const color =
        getValueColor(
            currentValue
        );

    rocketParts.forEach(
        part => {

            part.style.fill =
                color;
        }
    );

    currentValueElement.style.color =
        color;

    currentPoint.style.color =
        color;

    currentPoint.style.background =
        color;

    rocket.style.filter =
        `drop-shadow(
            0 0 7px ${color}
        )`;
}


/* =====================================================
   COSTRUZIONE SCALA
===================================================== */

function buildScale() {

    ticks.innerHTML =
        "";

    labels.innerHTML =
        "";

    const totalValueRange =
        DISPLAY_RANGE * 2;

    const totalHeight =
        totalValueRange *
        PIXELS_PER_EURO;

    timelineContent.style.height =
        totalHeight + "px";

    const centerY =
        totalHeight / 2;

    const minimumValue =
        currentValue -
        DISPLAY_RANGE;

    const maximumValue =
        currentValue +
        DISPLAY_RANGE;

    const firstValue =
        Math.ceil(
            minimumValue / STEP
        ) * STEP;

    const lastValue =
        Math.floor(
            maximumValue / STEP
        ) * STEP;

    for (
        let scaleValue =
            firstValue;

        scaleValue <=
            lastValue;

        scaleValue +=
            STEP
    ) {

        const difference =
            scaleValue -
            currentValue;

        const y =
            centerY -
            (
                difference *
                PIXELS_PER_EURO
            );

        const tick =
            document.createElement(
                "div"
            );

        tick.className =
            "tick";

        if (
            scaleValue % 250 === 0
        ) {

            tick.classList.add(
                "major"
            );
        }

        if (
            scaleValue === 0
        ) {

            tick.classList.add(
                "zero"
            );
        }

        tick.style.top =
            `${y}px`;

        ticks.appendChild(
            tick
        );

        if (
            scaleValue % 250 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "scale-label";

            label.style.top =
                `${y}px`;

            label.textContent =
                formatValue(
                    scaleValue
                );

            label.style.color =
                getValueColor(
                    scaleValue
                );

            labels.appendChild(
                label
            );
        }
    }
}


/* =====================================================
   NOTE
===================================================== */

function createNote(
    change,
    value,
    text,
    index
) {

    const note =
        document.createElement(
            "div"
        );

    note.className =
        "note";


    /* -----------------------------------------------
       VARIAZIONE
    ----------------------------------------------- */

    const changeElement =
        document.createElement(
            "span"
        );

    changeElement.className =
        "note-change";

    changeElement.textContent =
        "(" +
        formatValue(
            change
        ) +
        ")";

    /*
       Il colore della variazione dipende
       esclusivamente dal segno della variazione.
    */

    if (
        change > 0
    ) {

        changeElement.style.color =
            "#20DD65";

    } else if (
        change < 0
    ) {

        changeElement.style.color =
            "#F8374C";

    } else {

        changeElement.style.color =
            "#FFFFFF";
    }


    /* -----------------------------------------------
       VALORE RAGGIUNTO
    ----------------------------------------------- */

    const valueElement =
        document.createElement(
            "span"
        );

    valueElement.className =
        "note-value";

    valueElement.textContent =
        formatValue(
            value
        );

    valueElement.style.color =
        getValueColor(
            value
        );


    /* -----------------------------------------------
       TESTO NOTA
    ----------------------------------------------- */

    const textElement =
        document.createElement(
            "span"
        );

    textElement.className =
        "note-text";

    textElement.textContent =
        text;

    textElement.style.color =
        "#FFFFFF";


    /* -----------------------------------------------
       CANCELLA
    ----------------------------------------------- */

    const deleteButton =
        document.createElement(
            "button"
        );

    deleteButton.className =
        "note-delete";

    deleteButton.textContent =
        "×";

    deleteButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            deleteNote(
                index
            );

        }
    );


    note.appendChild(
        changeElement
    );

    note.appendChild(
        valueElement
    );

    note.appendChild(
        textElement
    );

    note.appendChild(
        deleteButton
    );

    return note;
}


function drawNotes() {

    notesLayer.innerHTML =
        "";

    notes.forEach(
        (entry, index) => {

            const note =
                createNote(
                    entry.change,
                    entry.value,
                    entry.text,
                    index
                );

            notesLayer.appendChild(
                note
            );
        }
    );
}


function deleteNote(index) {

    if (
        index < 0 ||
        index >= notes.length
    ) {
        return;
    }

    notes.splice(
        index,
        1
    );

    saveNotes();

    drawNotes();
}


function saveNotes() {

    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );
}


/* =====================================================
   OBIETTIVI
===================================================== */

function createGoal(
    value,
    name,
    index
) {

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "goal-item";

    const color =
        getValueColor(
            value
        );

    item.style.color =
        color;

    const valueElement =
        document.createElement(
            "span"
        );

    valueElement.className =
        "goal-value";

    valueElement.textContent =
        formatValue(
            value
        );

    valueElement.style.color =
        color;

    const nameElement =
        document.createElement(
            "span"
        );

    nameElement.className =
        "goal-text";

    nameElement.textContent =
        name;

    nameElement.style.color =
        color;

    const deleteButton =
        document.createElement(
            "button"
        );

    deleteButton.className =
        "goal-delete";

    deleteButton.textContent =
        "×";

    deleteButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            deleteGoal(
                index
            );

        }
    );

    item.appendChild(
        valueElement
    );

    item.appendChild(
        nameElement
    );

    item.appendChild(
        deleteButton
    );

    return item;
}


function drawGoals() {

    goalsLayer.innerHTML =
        "";

    const sortedGoals =
        goals
            .map(
                (goal, index) => {

                    return {
                        value:
                            Number(
                                goal.value
                            ),

                        name:
                            String(
                                goal.name
                            ),

                        originalIndex:
                            index
                    };

                }
            )
            .filter(
                goal =>
                    Number.isFinite(
                        goal.value
                    )
            )
            .sort(
                (a, b) =>
                    a.value -
                    b.value
            );

    sortedGoals.forEach(
        goal => {

            const item =
                createGoal(
                    goal.value,
                    goal.name,
                    goal.originalIndex
                );

            goalsLayer.appendChild(
                item
            );

        }
    );
}


function saveGoals() {

    localStorage.setItem(
        GOALS_KEY,
        JSON.stringify(
            goals
        )
    );
}


function deleteGoal(index) {

    if (
        index < 0 ||
        index >= goals.length
    ) {
        return;
    }

    goals.splice(
        index,
        1
    );

    saveGoals();

    drawGoals();
}


/* =====================================================
   MODALE
===================================================== */

function openGoalModal() {

    goalValueInput.value =
        "";

    goalNameInput.value =
        "";

    goalModal.classList.remove(
        "hidden"
    );

    setTimeout(
        () => {

            goalValueInput.focus();

        },
        100
    );
}


function closeGoalModal() {

    goalModal.classList.add(
        "hidden"
    );

    goalValueInput.value =
        "";

    goalNameInput.value =
        "";
}


function saveGoal() {

    const value =
        parseNumber(
            goalValueInput.value
        );

    const name =
        goalNameInput.value.trim();

    if (
        !Number.isFinite(
            value
        )
    ) {

        goalValueInput.focus();

        return;
    }

    if (
        name === ""
    ) {

        goalNameInput.focus();

        return;
    }

    goals.push({

        value:
            value,

        name:
            name

    });

    saveGoals();

    drawGoals();

    closeGoalModal();
}


/* =====================================================
   CENTRA SCALA
===================================================== */

function centerTimeline() {

    const maxScroll =
        timeline.scrollHeight -
        timeline.clientHeight;

    if (
        maxScroll <= 0
    ) {

        timeline.scrollTop =
            0;

        return;
    }

    timeline.scrollTop =
        maxScroll / 2;
}


/* =====================================================
   DISPLAY
===================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );

    updateColor();

    buildScale();

    drawGoals();

    drawNotes();

    requestAnimationFrame(
        () => {

            centerTimeline();

            stabilizeRocket();

        }
    );
}


/* =====================================================
   POSIZIONE RAZZO
===================================================== */

let rocketInitialBodyTop = null;

let rocketInitialBodyLeft = null;


function stabilizeRocket() {

    const bodyRect =
        document.body.getBoundingClientRect();

    if (
        rocketInitialBodyTop === null
    ) {

        rocketInitialBodyTop =
            bodyRect.top;
    }

    if (
        rocketInitialBodyLeft === null
    ) {

        rocketInitialBodyLeft =
            bodyRect.left;
    }

    const verticalShift =
        rocketInitialBodyTop -
        bodyRect.top;

    const horizontalShift =
        rocketInitialBodyLeft -
        bodyRect.left;

    rocketLayer.style.transform =
        `translate3d(
            ${horizontalShift}px,
            ${verticalShift}px,
            0
        )`;
}


/* =====================================================
   MONITORAGGIO TASTIERA
===================================================== */

function requestRocketStabilization() {

    requestAnimationFrame(
        () => {

            stabilizeRocket();

            requestAnimationFrame(
                () => {

                    stabilizeRocket();

                }
            );

        }
    );
}


if (
    window.visualViewport
) {

    window.visualViewport.addEventListener(
        "scroll",
        requestRocketStabilization,
        {
            passive: true
        }
    );

    window.visualViewport.addEventListener(
        "resize",
        requestRocketStabilization,
        {
            passive: true
        }
    );
}


function monitorKeyboardMovement() {

    let frames = 0;

    function check() {

        stabilizeRocket();

        frames++;

        if (
            frames < 60
        ) {

            requestAnimationFrame(
                check
            );
        }
    }

    requestAnimationFrame(
        check
    );
}


document.addEventListener(
    "focusin",
    function() {

        monitorKeyboardMovement();

    }
);


document.addEventListener(
    "focusout",
    function() {

        monitorKeyboardMovement();

    }
);


/* =====================================================
   VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const value =
        parseNumber(
            startInput.value
        );

    if (
        !Number.isFinite(
            value
        )
    ) {

        startInput.focus();

        return;
    }

    startValue =
        value;

    currentValue =
        value;

    notes = [];

    goals = [];

    localStorage.setItem(
        START_KEY,
        String(
            startValue
        )
    );

    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );

    saveNotes();

    saveGoals();

    startScreen.classList.add(
        "hidden"
    );

    updateDisplay();
}


/* =====================================================
   APPLICA VARIAZIONE
===================================================== */

function applyChange() {

    const change =
        parseNumber(
            changeInput.value
        );

    if (
        !Number.isFinite(
            change
        )
    ) {

        changeInput.focus();

        return;
    }

    const comment =
        noteInput.value.trim();

    if (
        comment === ""
    ) {

        noteInput.focus();

        return;
    }

    const newValue =
        currentValue +
        change;


    /*
       Salviamo separatamente:

       change = variazione effettuata
       value  = valore raggiunto
       text   = nota
    */

    notes.push({

        change:
            change,

        value:
            newValue,

        text:
            comment

    });

    currentValue =
        newValue;

    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );

    saveNotes();

    changeInput.value =
        "";

    noteInput.value =
        "";

    updateDisplay();
}


/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi cancellare il valore iniziale, tutte le note e tutti gli obiettivi?"
        );

    if (
        !confirmed
    ) {

        return;
    }

    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        NOTES_KEY
    );

    localStorage.removeItem(
        GOALS_KEY
    );

    startValue =
        NaN;

    currentValue =
        NaN;

    notes = [];

    goals = [];

    startInput.value =
        "";

    changeInput.value =
        "";

    noteInput.value =
        "";

    goalModal.classList.add(
        "hidden"
    );

    goalsLayer.innerHTML =
        "";

    notesLayer.innerHTML =
        "";

    startScreen.classList.remove(
        "hidden"
    );

    rocketLayer.style.transform =
        "translate3d(0,0,0)";

    rocketInitialBodyTop =
        null;

    rocketInitialBodyLeft =
        null;

    setTimeout(
        () => {

            startInput.focus();

        },
        100
    );
}


/* =====================================================
   EVENTI
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();
        }

    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();
        }

    }
);


noteInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();
        }

    }
);


plusButton.addEventListener(
    "click",
    openGoalModal
);


goalCancel.addEventListener(
    "click",
    closeGoalModal
);


goalSave.addEventListener(
    "click",
    saveGoal
);


goalValueInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            goalNameInput.focus();
        }

    }
);


goalNameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            saveGoal();
        }

    }
);


goalModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            goalModal
        ) {

            closeGoalModal();
        }

    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =====================================================
   CARICAMENTO DATI
===================================================== */

let startValue =
    parseNumber(
        localStorage.getItem(
            START_KEY
        )
    );


let currentValue =
    parseNumber(
        localStorage.getItem(
            CURRENT_KEY
        )
    );


let notes = [];

let goals = [];


/* =====================================================
   CARICA NOTE
===================================================== */

try {

    const savedNotes =
        JSON.parse(
            localStorage.getItem(
                NOTES_KEY
            )
        );

    if (
        Array.isArray(
            savedNotes
        )
    ) {

        notes =
            savedNotes
                .map(
                    entry => {

                        const value =
                            Number(
                                entry.value
                            );

                        const text =
                            String(
                                entry.text
                            );

                        /*
                           Le nuove note contengono
                           direttamente la variazione.

                           Per eventuali note precedenti
                           senza change utilizziamo 0
                           invece di inventare una variazione.
                        */

                        const change =
                            Number(
                                entry.change
                            );

                        return {

                            change:
                                Number.isFinite(
                                    change
                                )
                                    ? change
                                    : 0,

                            value:
                                value,

                            text:
                                text

                        };

                    }
                )
                .filter(
                    entry =>
                        Number.isFinite(
                            entry.value
                        ) &&
                        entry.text.trim() !== ""
                );
    }

} catch {

    notes = [];
}


/* =====================================================
   CARICA OBIETTIVI
===================================================== */

try {

    const savedGoals =
        JSON.parse(
            localStorage.getItem(
                GOALS_KEY
            )
        );

    if (
        Array.isArray(
            savedGoals
        )
    ) {

        goals =
            savedGoals
                .map(
                    goal => {

                        return {

                            value:
                                Number(
                                    goal.value
                                ),

                            name:
                                String(
                                    goal.name
                                )

                        };

                    }
                )
                .filter(
                    goal =>
                        Number.isFinite(
                            goal.value
                        ) &&
                        goal.name.trim() !== ""
                );
    }

} catch {

    goals = [];
}


/* =====================================================
   AVVIO
===================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;
    }

    startScreen.classList.add(
        "hidden"
    );

    updateDisplay();

} else {

    startScreen.classList.remove(
        "hidden"
    );

}


/* =====================================================
   POSIZIONE INIZIALE RAZZO
===================================================== */

requestAnimationFrame(
    () => {

        requestAnimationFrame(
            () => {

                stabilizeRocket();

            }
        );

    }
);


/* =====================================================
   CONTROLLO MOVIMENTO BODY
===================================================== */

let lastBodyTop = null;


function detectBodyMovement() {

    const rect =
        document.body.getBoundingClientRect();

    if (
        lastBodyTop === null
    ) {

        lastBodyTop =
            rect.top;

        return;
    }

    if (
        Math.abs(
            rect.top -
            lastBodyTop
        ) > 0.5
    ) {

        stabilizeRocket();

        lastBodyTop =
            rect.top;
    }
}


let keyboardMonitor = null;


function startKeyboardMonitor() {

    if (
        keyboardMonitor !== null
    ) {

        return;
    }

    keyboardMonitor =
        setInterval(
            () => {

                detectBodyMovement();

            },
            16
        );
}


function stopKeyboardMonitor() {

    if (
        keyboardMonitor !== null
    ) {

        clearInterval(
            keyboardMonitor
        );

        keyboardMonitor =
            null;
    }
}


document.addEventListener(
    "focusin",
    function() {

        startKeyboardMonitor();

    }
);


document.addEventListener(
    "focusout",
    function() {

        setTimeout(
            () => {

                if (
                    !document.activeElement ||
                    (
                        document.activeElement.tagName !==
                        "INPUT" &&
                        document.activeElement.tagName !==
                        "TEXTAREA"
                    )
                ) {

                    stopKeyboardMonitor();

                    stabilizeRocket();
                }

            },
            300
        );

    }
);

</script>
