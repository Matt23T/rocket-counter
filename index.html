<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;

    overscroll-behavior: none;
}

body {
    position: fixed;

    width: 100%;
    height: 100%;

    touch-action: pan-y;
}

.app {
    position: relative;

    width: 100%;
    height: 100dvh;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   SCALA
===================================================== */

.timeline {

    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;

    overscroll-behavior-y: contain;

    z-index: 10;

    touch-action: pan-y;
}

.timeline::-webkit-scrollbar {
    display: none;
}

.timeline-content {

    position: relative;

    width: 100%;

    height: 2400px;
}


/* =====================================================
   LINEA CENTRALE
===================================================== */

.center-line {

    position: absolute;

    top: 0;
    left: 50%;

    width: 1px;
    height: 100%;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.18);

    pointer-events: none;
}


/* =====================================================
   TACCHETTE
===================================================== */

.tick {

    position: absolute;

    left: 50%;

    width: 6px;
    height: 1px;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.20);

    pointer-events: none;
}

.tick.major {

    width: 11px;

    background:
        rgba(255,255,255,0.35);
}

.tick.zero {

    width: 17px;

    background:
        rgba(255,255,255,0.75);
}


/* =====================================================
   NUMERI DELLA SCALA
===================================================== */

.scale-label {

    position: absolute;

    left: calc(50% - 25px);

    transform:
        translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;

    font-weight: 500;

    opacity: 0.65;

    pointer-events: none;
}


/* =====================================================
   NOTE / PLUSVALENZE
===================================================== */

.notes-layer {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 50;

    overflow: hidden;
}


/* =====================================================
   SINGOLA PLUSVALENZA
===================================================== */

.note {

    position: absolute;

    left: calc(50% + 31px);

    width:
        calc(50% - 42px);

    min-height: 32px;

    padding-right: 4px;

    pointer-events: auto;

    user-select: none;

    -webkit-user-select: none;

    z-index: 55;
}

.note-main {

    display: flex;

    align-items: center;

    gap: 6px;

    width: 100%;
}

.note-arrow {

    font-size: 11px;

    opacity: 0.65;

    flex-shrink: 0;
}

.note-movement {

    font-size: 12px;

    font-weight: 700;

    white-space: nowrap;

    flex-shrink: 0;
}

.note-difference {

    font-size: 11px;

    font-weight: 700;

    white-space: nowrap;

    flex-shrink: 0;
}

.note-text {

    min-width: 0;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 12px;

    font-weight: 500;

    opacity: 0.90;
}

.note-actions {

    display: flex;

    gap: 5px;

    margin-top: 3px;

    margin-left: 0;

    opacity: 0;

    transition: opacity 0.15s ease;
}

.note:hover .note-actions {

    opacity: 1;
}

.note-edit,
.note-delete {

    border: none;

    background: #181818;

    color: #aaa;

    border-radius: 6px;

    padding: 3px 7px;

    font-size: 10px;
}

.note-edit:active,
.note-delete:active {

    transform: scale(0.95);
}


/* =====================================================
   RAZZO CENTRALE
===================================================== */

.fixed-indicator {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 70;

    pointer-events: none;
}

.rocket {

    position: absolute;

    left: 8px;
    top: 0;

    width: 58px;
    height: 29px;

    transform:
        translateY(-50%);

    overflow: visible;

    transition:
        filter 0.2s ease;
}

.rocket-part {

    fill: #fff;

    transition:
        fill 0.2s ease;
}

.rocket-window {

    fill: #000;
}


/* =====================================================
   VALORE ATTUALE
===================================================== */

.current-info {

    position: absolute;

    left: 76px;
    top: 0;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    pointer-events: auto;
}

.current-value {

    font-size: 20px;

    line-height: 25px;

    font-weight: 700;

    white-space: nowrap;

    transition:
        color 0.2s ease;
}

.current-note {

    width: 180px;
    height: 27px;

    margin: 0;
    padding: 0;

    border: none;

    outline: none;

    background: transparent;

    color: #aaa;

    font-size: 13px;

    touch-action: auto;
}

.current-note::placeholder {

    color: #555;
}


/* =====================================================
   CONTROLLI
===================================================== */

.controls {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            16px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 80;
}

.change-input {

    width: 175px;
    height: 49px;

    padding: 0 12px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 17px;

    font-weight: 600;
}

.change-input::placeholder {

    color: #555;
}

.change-button {

    width: 55px;
    height: 49px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;
}

.change-button:active {

    transform:
        scale(0.96);
}


/* =====================================================
   RESET
===================================================== */

.reset-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    right: 12px;

    height: 37px;

    padding: 0 13px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}


/* =====================================================
   SCHERMATA INIZIALE
===================================================== */

.start-screen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {

    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 700;
}

.start-subtitle {

    margin-bottom: 23px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {

    width: 220px;
    height: 54px;

    padding: 0 10px;

    border:
        1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 21px;

    font-weight: 600;
}

.start-input::placeholder {

    color: #555;
}

.start-button {

    width: 220px;
    height: 49px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 700;
}

.hidden {

    display: none !important;
}


/* =====================================================
   MODIFICA NOTA
===================================================== */

.edit-overlay {

    position: absolute;

    inset: 0;

    z-index: 200;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        rgba(0,0,0,0.75);

    padding: 25px;
}

.edit-box {

    width: 100%;
    max-width: 340px;

    padding: 20px;

    border-radius: 17px;

    background: #111;

    border: 1px solid #333;
}

.edit-title {

    margin-bottom: 12px;

    font-size: 17px;

    font-weight: 700;
}

.edit-input {

    width: 100%;

    height: 45px;

    padding: 0 12px;

    border: 1px solid #333;

    border-radius: 10px;

    background: #000;

    color: #fff;

    outline: none;

    font-size: 15px;
}

.edit-buttons {

    display: flex;

    gap: 8px;

    margin-top: 12px;
}

.edit-buttons button {

    flex: 1;

    height: 42px;

    border: none;

    border-radius: 10px;

    font-weight: 700;
}

.edit-save {

    background: #fff;

    color: #000;
}

.edit-cancel {

    background: #222;

    color: #aaa;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    .rocket {

        width: 56px;
        height: 28px;
    }

    .current-info {

        left: 73px;
    }

    .current-value {

        font-size: 19px;
    }

    .current-note {

        width: 165px;
    }

    .note {

        font-size: 12px;
    }
}

</style>

</head>


<body>

<div class="app">


    <!-- =================================================
         SCALA SCORRIBILE
    ================================================= -->

    <div
        id="timeline"
        class="timeline"
    >

        <div
            id="timelineContent"
            class="timeline-content"
        >

            <div

            ></div>

                "

            />

            <path

                d="

            />

            <path

                "

            <path

    <!-- =================================================
         SCHERMATA INIZIALE
    ================================================= -->

    <div

    >

        <div
            class="start-title"
        >
            Rocket
        </div>

        <div

        >

        </div>

        <input
            id="startInput"
            class="start-input"
            type="text"
            autocomplete="off"

            autocapitalize="off"

            placeholder="Valore iniziale"
        >

        <button
            id="startButton"

    <!-- =================================================

            <input
                id="editInput"

                    id="editCancel"

                    id="editSave"

                    Salva
                </button>

    </div>

</div>


<script>

/* =====================================================
   BLOCCO ZOOM
===================================================== */

document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturechange",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gestureend",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "touchmove",
    function(event) {

        if (
            event.touches.length > 1
        ) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);


/* =====================================================
   STORAGE
===================================================== */

const START_KEY =
    "rocket_start_value_v6";

const CURRENT_KEY =
    "rocket_current_value_v6";

const NOTES_KEY =
    "rocket_notes_v6";


/* =====================================================
   ELEMENTI
===================================================== */

const timeline =
    document.getElementById(
        "timeline"
    );

const timelineContent =
    document.getElementById(
        "timelineContent"
    );

const ticks =
    document.getElementById(
        "ticks"
    );

const labels =
    document.getElementById(
        "labels"
    );

const notesLayer =
    document.getElementById(
        "notesLayer"
    );

const currentValueElement =
    document.getElementById(
        "currentValue"
    );

const currentNote =
    document.getElementById(
        "currentNote"
    );

const changeInput =
    document.getElementById(
        "changeInput"
    );

const changeButton =
    document.getElementById(
        "changeButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startInput =
    document.getElementById(
        "startInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const rocketParts =
    document.querySelectorAll(
        ".rocket-part"
    );

const rocket =
    document.getElementById(
        "rocket"
    );

const editOverlay =
    document.getElementById(
        "editOverlay"
    );

const editInput =
    document.getElementById(
        "editInput"
    );

const editSave =
    document.getElementById(
        "editSave"
    );

const editCancel =
    document.getElementById(
        "editCancel"
    );


/* =====================================================
   PARAMETRI SCALA
===================================================== */

const DISPLAY_RANGE =
    1100;

const STEP =
    25;

const PIXELS_PER_STEP =
    27;

const PIXELS_PER_EURO =
    PIXELS_PER_STEP / STEP;


/* =====================================================
   CONVERSIONE NUMERI
===================================================== */

function parseNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return NaN;
    }

    let text =
        String(value).trim();

    if (
        text === ""
    ) {

        return NaN;
    }

    text =
        text.replace(
            /\s/g,
            ""
        );

    text =
        text.replace(
            /\./g,
            ""
        );

    text =
        text.replace(
            ",",
            "."
        );

    const number =
        Number(text);

    return Number.isFinite(number)
        ? number
        : NaN;
}


/* =====================================================
   FORMATTAZIONE
===================================================== */

function formatValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;

    const absolute =
        Math.abs(rounded)
            .toLocaleString(
                "it-IT",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );

    if (
        rounded > 0
    ) {

        return "+" +
            absolute +
            " €";
    }

    if (
        rounded < 0
    ) {

        return "-" +
            absolute +
            " €";
    }

    return "0 €";
}


/* =====================================================
   COLORE
===================================================== */

function getValueColor(value) {

    if (
        value === 0
    ) {

        return "#FFFFFF";
    }


    if (
        value > 0
    ) {

        if (
            value <= 1000
        ) {

            return "#B8FFD0";
        }

        if (
            value <= 2000
        ) {

            return "#62F28A";
        }

        if (
            value <= 3000
        ) {

            return "#20DD65";
        }

        if (
            value <= 4000
        ) {

            return "#08C951";
        }

        return "#00A83F";
    }


    const amount =
        Math.abs(value);


    if (
        amount <= 1000
    ) {

        return "#FFB9C0";
    }

    if (
        amount <= 2000
    ) {

        return "#FF6877";
    }

    if (
        amount <= 3000
    ) {

        return "#F8374C";
    }

    if (
        amount <= 4000
    ) {

        return "#E91E35";
    }

    return "#C90020";
}


/* =====================================================
   COLORE RAZZO
===================================================== */

function updateColor() {

    const color =
        getValueColor(
            currentValue
        );


    rocketParts.forEach(
        part => {

            part.style.fill =
                color;

        }
    );


    currentValueElement.style.color =
        color;


    rocket.style.filter =
        `drop-shadow(
            0 0 7px ${color}
        )`;
}


/* =====================================================
   COSTRUZIONE SCALA
===================================================== */

function buildScale() {

    ticks.innerHTML = "";

    labels.innerHTML = "";


    const totalHeight =
        (
            DISPLAY_RANGE * 2
        ) *
        PIXELS_PER_EURO;


    timelineContent.style.height =
        totalHeight + "px";


    const centerY =
        totalHeight / 2;


    for (
        let relativeValue = -DISPLAY_RANGE;

        relativeValue <= DISPLAY_RANGE;

        relativeValue += STEP
    ) {

        const y =
            centerY -
            (
                relativeValue *
                PIXELS_PER_EURO
            );


        const tick =
            document.createElement(
                "div"
            );

        tick.className =
            "tick";


        if (
            relativeValue % 250 === 0
        ) {

            tick.classList.add(
                "major"
            );
        }


        if (
            relativeValue === 0
        ) {

            tick.classList.add(
                "zero"
            );
        }


        tick.style.top =
            `${y}px`;


        ticks.appendChild(
            tick
        );


        if (
            relativeValue % 250 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "scale-label";

            label.style.top =
                `${y}px`;


            const scaleValue =
                currentValue +
                relativeValue;


            label.textContent =
                formatValue(
                    scaleValue
                );


            label.style.color =
                getValueColor(
                    scaleValue
                );


            labels.appendChild(
                label
            );
        }
    }
}


/* =====================================================
   CREA PLUSVALENZA
===================================================== */

function createNote(
    item,
    index
) {

    const note =
        document.createElement(
            "div"
        );

    note.className =
        "note";


    const color =
        getValueColor(
            item.to
        );


    note.style.color =
        color;


    /*
       RIGA PRINCIPALE
    */

    const main =
        document.createElement(
            "div"
        );

    main.className =
        "note-main";


    const arrow =
        document.createElement(
            "span"
        );

    arrow.className =
        "note-arrow";

    arrow.textContent =
        "→";


    const movement =
        document.createElement(
            "span"
        );

    movement.className =
        "note-movement";

    movement.textContent =
        formatValue(
            item.to
        );

    movement.style.color =
        color;


    /*
       PLUSVALENZA / MINUSVALENZA
    */

    const difference =
        document.createElement(
            "span"
        );

    difference.className =
        "note-difference";

    difference.textContent =
        "(" +
        formatSignedDifference(
            item.change
        ) +
        ")";

    difference.style.color =
        getValueColor(
            item.change
        );


    const text =
        document.createElement(
            "span"
        );

    text.className =
        "note-text";

    text.textContent =
        item.text;

    text.style.color =
        color;


    main.appendChild(
        arrow
    );

    main.appendChild(
        movement
    );

    main.appendChild(
        difference
    );

    main.appendChild(
        text
    );


    note.appendChild(
        main
    );


    /*
       AZIONI
    */

    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "note-actions";


    const editButton =
        document.createElement(
            "button"
        );

    editButton.className =
        "note-edit";

    editButton.textContent =
        "Modifica";


    const deleteButton =
        document.createElement(
            "button"
        );

    deleteButton.className =
        "note-delete";

    deleteButton.textContent =
        "Elimina";


    editButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            openEditNote(
                item.id
            );

        }
    );


    deleteButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            deleteNote(
                item.id
            );

        }
    );


    actions.appendChild(
        editButton
    );

    actions.appendChild(
        deleteButton
    );

    note.appendChild(
        actions
    );


    return note;
}


/* =====================================================
   FORMATTA VARIAZIONE
===================================================== */

function formatSignedDifference(
    value
) {

    if (
        value > 0
    ) {

        return "+" +
            Math.abs(value)
                .toLocaleString(
                    "it-IT"
                ) +
            " €";
    }


    if (
        value < 0
    ) {

        return "-" +
            Math.abs(value)
                .toLocaleString(
                    "it-IT"
                ) +
            " €";
    }


    return "0 €";
}


/* =====================================================
   DISEGNA NOTE CRONOLOGICHE
===================================================== */

function drawNotes() {

    notesLayer.innerHTML = "";


    /*
       NON viene più fatto nessun
       ordinamento numerico.

       L'ordine dell'array è l'ordine
       cronologico in cui le note
       sono state create.
    */

    notes.forEach(
        (item, index) => {

            const note =
                createNote(
                    item,
                    index
                );


            /*
               Le note sono semplicemente
               disposte una sotto l'altra
               sul lato destro.

               Non vengono più ancorate
               alla scala.
            */

            note.style.top =
                (
                    18 +
                    index * 43
                ) +
                "px";


            notesLayer.appendChild(
                note
            );

        }
    );
}


/* =====================================================
   SALVA NOTA COME PLUSVALENZA
===================================================== */

function saveCurrentNote() {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        return;
    }


    const text =
        currentNote.value.trim();


    /*
       La nota inserita sul valore
       corrente viene utilizzata come
       descrizione del movimento che
       avverrà con la prossima variazione.

       Se non c'è testo non viene
       creata nessuna plusvalenza.
    */

    return text;
}


/* =====================================================
   CREA MOVIMENTO
===================================================== */

function createMovement(
    from,
    to,
    text
) {

    if (
        text === ""
    ) {

        return;
    }


    const change =
        to - from;


    const movement = {

        id:
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2),

        from:
            from,

        to:
            to,

        change:
            change,

        text:
            text,

        createdAt:
            Date.now()
    };


    notes.push(
        movement
    );


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );
}


/* =====================================================
   MODIFICA NOTA
===================================================== */

let editingNoteId =
    null;


function openEditNote(
    id
) {

    const item =
        notes.find(
            note =>
                note.id === id
        );


    if (
        !item
    ) {

        return;
    }


    editingNoteId =
        id;


    editInput.value =
        item.text;


    editOverlay.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {

            editInput.focus();

        },
        100
    );
}


/* =====================================================
   SALVA MODIFICA
===================================================== */

function saveEditedNote() {

    if (
        !editingNoteId
    ) {

        return;
    }


    const item =
        notes.find(
            note =>
                note.id ===
                editingNoteId
        );


    if (
        !item
    ) {

        return;
    }


    const text =
        editInput.value.trim();


    if (
        text === ""
    ) {

        return;
    }


    item.text =
        text;


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    editOverlay.classList.add(
        "hidden"
    );


    editingNoteId =
        null;


    drawNotes();
}


/* =====================================================
   ELIMINA NOTA
===================================================== */

function deleteNote(
    id
) {

    const confirmed =
        confirm(
            "Vuoi eliminare questa nota?"
        );


    if (
        !confirmed
    ) {

        return;
    }


    notes =
        notes.filter(
            item =>
                item.id !== id
        );


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    drawNotes();
}


/* =====================================================
   CENTRA SCALA
===================================================== */

function centerTimeline() {

    const maxScroll =
        timeline.scrollHeight -
        timeline.clientHeight;


    if (
        maxScroll <= 0
    ) {

        timeline.scrollTop =
            0;

        return;
    }


    timeline.scrollTop =
        maxScroll / 2;
}


/* =====================================================
   AGGIORNA DISPLAY
===================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    updateColor();

    buildScale();

    drawNotes();


    /*
       Non esiste più una nota
       legata direttamente al valore.
    */

    currentNote.value =
        "";


    requestAnimationFrame(
        () => {

            centerTimeline();

        }
    );
}


/* =====================================================
   VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const value =
        parseNumber(
            startInput.value
        );


    if (
        !Number.isFinite(value)
    ) {

        startInput.focus();

        return;
    }


    startValue =
        value;

    currentValue =
        value;


    notes = [];


    localStorage.setItem(
        START_KEY,
        String(startValue)
    );


    localStorage.setItem(
        CURRENT_KEY,
        String(currentValue)
    );


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();
}


/* =====================================================
   APPLICA VARIAZIONE
===================================================== */

function applyChange() {

    const change =
        parseNumber(
            changeInput.value
        );


    if (
        !Number.isFinite(change)
    ) {

        changeInput.focus();

        return;
    }


    /*
       Il valore attuale è il punto
       di partenza del movimento.
    */

    const previousValue =
        currentValue;


    /*
       La variazione viene sommata
       al valore attuale.
    */

    const newValue =
        previousValue +
        change;


    /*
       La nota viene associata
       ESCLUSIVAMENTE a questo
       movimento.

       Quindi anche se si torna
       sullo stesso numero, viene
       creata una nuova registrazione.
    */

    const text =
        currentNote.value.trim();


    if (
        text !== ""
    ) {

        createMovement(
            previousValue,
            newValue,
            text
        );
    }


    currentValue =
        newValue;


    localStorage.setItem(
        CURRENT_KEY,
        String(currentValue)
    );


    changeInput.value =
        "";

    currentNote.value =
        "";


    updateDisplay();
}


/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi cancellare il valore iniziale e tutte le note?"
        );


    if (
        !confirmed
    ) {

        return;
    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        NOTES_KEY
    );


    startValue =
        NaN;

    currentValue =
        NaN;

    notes = [];


    startInput.value =
        "";

    changeInput.value =
        "";

    currentNote.value =
        "";


    startScreen.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {

            startInput.focus();

        },
        100
    );
}


/* =====================================================
   EVENTI
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();

        }

    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();

        }

    }
);


currentNote.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            currentNote.blur();

        }

    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


editSave.addEventListener(
    "click",
    saveEditedNote
);


editCancel.addEventListener(
    "click",
    function() {

        editOverlay.classList.add(
            "hidden"
        );

        editingNoteId =
            null;

    }
);


/* =====================================================
   CARICAMENTO DATI
===================================================== */

let startValue =
    parseNumber(
        localStorage.getItem(
            START_KEY
        )
    );


let currentValue =
    parseNumber(
        localStorage.getItem(
            CURRENT_KEY
        )
    );


let notes = [];


/*
   Caricamento compatibile anche
   con eventuali dati precedenti.
*/

try {

    const saved =
        JSON.parse(
            localStorage.getItem(
                NOTES_KEY
            )
        );


    if (
        Array.isArray(saved)
    ) {

        notes =
            saved;

    } else {

        notes =
            [];

    }

} catch {

    notes =
        [];
}


/* =====================================================
   AVVIO
===================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;
    }


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

} else {

    startScreen.classList.remove(
        "hidden"
    );

}

</script>
