<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;
}

body {
    overflow: hidden;
    overscroll-behavior: none;
}

.app {
    position: relative;
    width: 100%;
    height: 100dvh;
    background: #000;
    overflow: hidden;
}


/* =====================================================
   SCROLL
===================================================== */

.timeline {
    position: absolute;
    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;

    scrollbar-width: none;

    z-index: 10;
}

.timeline::-webkit-scrollbar {
    display: none;
}

.timeline-content {
    position: relative;
    width: 100%;
    height: 2200px;
}


/* =====================================================
   LINEA
===================================================== */

.center-line {
    position: absolute;

    left: 50%;

    width: 1px;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.18);

    pointer-events: none;
}


/* =====================================================
   TACCHETTE
===================================================== */

.tick {
    position: absolute;

    left: 50%;

    width: 6px;
    height: 1px;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.20);

    pointer-events: none;
}

.tick.major {
    width: 11px;
    background: rgba(255,255,255,0.34);
}

.tick.zero {
    width: 16px;
    background: rgba(255,255,255,0.70);
}


/* =====================================================
   NUMERI SCALA
===================================================== */

.scale-label {
    position: absolute;

    left: calc(50% - 27px);

    transform: translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;
    font-weight: 500;

    pointer-events: none;

    opacity: 0.55;
}


/* =====================================================
   NOTE
===================================================== */

.note {
    position: absolute;

    left: calc(50% + 30px);

    transform: translateY(-50%);

    max-width: calc(50% - 40px);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 13px;

    pointer-events: none;
}

.note-value {
    font-weight: 700;
    margin-right: 7px;
}

.note-text {
    opacity: 0.85;
}


/* =====================================================
   INDICATORE FISSO
===================================================== */

.fixed-indicator {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 50;

    pointer-events: none;
}


/* =====================================================
   RAZZO
===================================================== */

.rocket {
    position: absolute;

    left: 8px;
    top: 0;

    width: 60px;
    height: 31px;

    transform: translateY(-50%);

    overflow: visible;

    pointer-events: none;

    transition: filter 0.25s ease;
}

.rocket-part {
    fill: #fff;
    transition: fill 0.25s ease;
}

.rocket-window {
    fill: #000;
}


/* =====================================================
   VALORE + NOTA ATTUALE
===================================================== */

.current-info {
    position: absolute;

    left: 80px;
    top: 0;

    transform: translateY(-50%);

    display: flex;
    flex-direction: column;

    pointer-events: auto;
}

.current-value {
    font-size: 21px;
    line-height: 26px;

    font-weight: 700;

    white-space: nowrap;

    transition: color 0.25s ease;
}

.current-note {
    width: 185px;
    height: 28px;

    margin-top: 1px;
    padding: 0;

    border: none;
    outline: none;

    background: transparent;

    color: #aaa;

    font-size: 13px;

    touch-action: auto;
}

.current-note::placeholder {
    color: #505050;
}


/* =====================================================
   VARIAZIONE
===================================================== */

.controls {
    position: absolute;

    left: 50%;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    transform: translateX(-50%);

    display: flex;
    align-items: center;

    gap: 8px;

    z-index: 80;
}

.change-input {
    width: 175px;
    height: 50px;

    border: 1px solid #363636;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 18px;
    font-weight: 600;

    /*
       TASTIERA NORMALE.
       NON forziamo più quella numerica.
       In questo modo puoi scrivere:
       +1300
       -1300
       ecc.
    */

    touch-action: auto;
}

.change-input::placeholder {
    color: #505050;
}

.change-input:focus {
    border-color: #666;
}

.change-button {
    width: 55px;
    height: 50px;

    border: none;
    border-radius: 13px;

    background: #fff;
    color: #000;

    font-size: 15px;
    font-weight: 700;
}

.change-button:active {
    transform: scale(0.96);
}


/* =====================================================
   RESET
===================================================== */

.reset-button {
    position: absolute;

    top:
        calc(
            13px +
            env(safe-area-inset-top)
        );

    right: 13px;

    height: 38px;

    padding: 0 13px;

    border: none;
    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}


/* =====================================================
   SCHERMATA INIZIALE
===================================================== */

.start-screen {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {
    margin-bottom: 8px;

    font-size: 30px;
    font-weight: 700;
}

.start-subtitle {
    margin-bottom: 24px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {
    width: 220px;
    height: 55px;

    border: 1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;
    color: #fff;

    text-align: center;

    font-size: 22px;
    font-weight: 600;

    /*
       Anche qui tastiera normale,
       così puoi mettere eventualmente
       un valore iniziale negativo.
    */
}

.start-input::placeholder {
    color: #555;
}

.start-button {
    width: 220px;
    height: 50px;

    margin-top: 15px;

    border: none;
    border-radius: 14px;

    background: #fff;
    color: #000;

    font-size: 16px;
    font-weight: 700;
}

.hidden {
    display: none !important;
}


@media (max-width: 480px) {

    .rocket {
        width: 56px;
        height: 29px;
    }

    .current-info {
        left: 74px;
    }

    .current-value {
        font-size: 20px;
    }

    .current-note {
        width: 170px;
    }

    .note {
        font-size: 12px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- SCROLL -->

    <div
        id="timeline"
        class="timeline"
    >

        <div
            id="timelineContent"
            class="timeline-content"
        >

            <div
                id="centerLine"
                class="center-line"
            ></div>

            <div id="ticks"></div>

            <div id="labels"></div>

            <div id="notes"></div>

        </div>

    </div>


    <!-- RAZZO FISSO -->

    <div
        id="fixedIndicator"
        class="fixed-indicator"
    >

        <svg
            id="rocket"
            class="rocket"
            viewBox="0 0 100 50"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                class="rocket-part"
                d="
                    M 8 25
                    C 25 10,
                      52 7,
                      78 25
                    C 52 43,
                      25 40,
                      8 25
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M 65 13
                    C 82 15,
                      94 21,
                      99 25
                    C 94 29,
                      82 35,
                      65 37
                    Z
                "
            />

            <circle
                cx="68"
                cy="25"
                r="5"
                class="rocket-window"
            />

            <path
                class="rocket-part"
                d="
                    M 39 16
                    L 25 5
                    L 28 20
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M 39 34
                    L 25 45
                    L 28 30
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M 12 18
                    C 1 20,
                      1 30,
                      12 32
                    L 22 25
                    Z
                "
            />

        </svg>


        <div class="current-info">

            <div
                id="currentValue"
                class="current-value"
            >
                0 €
            </div>

            <input
                id="currentNote"
                class="current-note"
                type="text"
                maxlength="100"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Nota..."
            >

        </div>

    </div>


    <!-- VARIAZIONE -->

    <div class="controls">

        <input
            id="changeInput"
            class="change-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="+ / - variazione"
        >

        <button
            id="changeButton"
            class="change-button"
        >
            OK
        </button>

    </div>


    <!-- RESET -->

    <button
        id="resetButton"
        class="reset-button"
    >
        Reset
    </button>


    <!-- VALORE INIZIALE -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div class="start-title">
            Rocket
        </div>

        <div class="start-subtitle">
            Inserisci il valore iniziale
        </div>

        <input
            id="startInput"
            class="start-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Valore iniziale"
        >

        <button
            id="startButton"
            class="start-button"
        >
            OK
        </button>

    </div>

</div>


<script>


/* =====================================================
   STORAGE
===================================================== */

const START_KEY =
    "rocket-start-value";

const CURRENT_KEY =
    "rocket-current-value";

const NOTES_KEY =
    "rocket-notes";


/* =====================================================
   ELEMENTI
===================================================== */

const timeline =
    document.getElementById("timeline");

const timelineContent =
    document.getElementById("timelineContent");

const centerLine =
    document.getElementById("centerLine");

const ticks =
    document.getElementById("ticks");

const labels =
    document.getElementById("labels");

const notesContainer =
    document.getElementById("notes");

const currentValueElement =
    document.getElementById("currentValue");

const currentNote =
    document.getElementById("currentNote");

const changeInput =
    document.getElementById("changeInput");

const changeButton =
    document.getElementById("changeButton");

const resetButton =
    document.getElementById("resetButton");

const startScreen =
    document.getElementById("startScreen");

const startInput =
    document.getElementById("startInput");

const startButton =
    document.getElementById("startButton");

const rocket =
    document.getElementById("rocket");

const rocketParts =
    document.querySelectorAll(".rocket-part");


/* =====================================================
   DATI
===================================================== */

let startValue =
    parseStoredNumber(
        localStorage.getItem(
            START_KEY
        )
    );

let currentValue =
    parseStoredNumber(
        localStorage.getItem(
            CURRENT_KEY
        )
    );

let notes = {};

try {

    notes =
        JSON.parse(
            localStorage.getItem(
                NOTES_KEY
            )
        ) || {};

} catch {

    notes = {};
}


/* =====================================================
   SCALA

   PORTATA LEGGERMENTE OLTRE ±1000

   Questo serve a non tagliare
   il riferimento +1000 / -1000.
===================================================== */

const RANGE = 1100;

const DISPLAY_STEP = 25;

const PIXELS_PER_25 = 27;

const PIXELS_PER_EURO =
    PIXELS_PER_25 /
    DISPLAY_STEP;


/* =====================================================
   PARSING
===================================================== */

function parseStoredNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return NaN;
    }

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : NaN;
}


/*
    Accetta:

    1300
    +1300
    -1300
    - 1300
    + 1300
    1300,50
    -1300,50
*/

function parseInput(value) {

    if (
        typeof value !== "string"
    ) {
        return NaN;
    }

    let text =
        value.trim();

    if (
        text === ""
    ) {
        return NaN;
    }

    text =
        text.replace(
            /\s/g,
            ""
        );

    text =
        text.replace(
            ",",
            "."
        );

    if (
        !/^[+-]?\d*\.?\d+$/.test(text)
    ) {
        return NaN;
    }

    const number =
        Number(text);

    return Number.isFinite(number)
        ? number
        : NaN;
}


/* =====================================================
   FORMATTA EURO
===================================================== */

function formatValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;

    const absolute =
        Math.abs(
            rounded
        ).toLocaleString(
            "it-IT",
            {
                minimumFractionDigits:
                    Number.isInteger(rounded)
                        ? 0
                        : 2,

                maximumFractionDigits: 2
            }
        );

    if (
        rounded > 0
    ) {
        return "+" +
            absolute +
            " €";
    }

    if (
        rounded < 0
    ) {
        return "-" +
            absolute +
            " €";
    }

    return "0 €";
}


/* =====================================================
   COLORI

   0       = bianco
   positivo = verde
   negativo = rosso

   Fino a ±5000.
===================================================== */

function getValueColor(value) {

    if (
        value === 0
    ) {
        return "rgb(255,255,255)";
    }

    const amount =
        Math.min(
            Math.abs(value),
            5000
        );

    const t =
        amount / 5000;


    /* VERDE */

    if (
        value > 0
    ) {

        const startR = 245;
        const startG = 255;
        const startB = 245;

        const endR = 25;
        const endG = 215;
        const endB = 105;

        const r =
            Math.round(
                startR -
                (startR - endR) * t
            );

        const g =
            Math.round(
                startG -
                (startG - endG) * t
            );

        const b =
            Math.round(
                startB -
                (startB - endB) * t
            );

        return `rgb(${r},${g},${b})`;
    }


    /* ROSSO */

    const startR = 255;
    const startG = 245;
    const startB = 245;

    const endR = 235;
    const endG = 35;
    const endB = 55;

    const r =
        Math.round(
            startR -
            (startR - endR) * t
        );

    const g =
        Math.round(
            startG -
            (startG - endG) * t
        );

    const b =
        Math.round(
            startB -
            (startB - endB) * t
        );

    return `rgb(${r},${g},${b})`;
}


/* =====================================================
   COLORE RAZZO
===================================================== */

function updateRocketColor() {

    const color =
        getValueColor(
            currentValue
        );

    rocketParts.forEach(
        part => {
            part.style.fill =
                color;
        }
    );

    currentValueElement.style.color =
        color;

    rocket.style.filter =
        `drop-shadow(0 0 8px ${color})`;
}


/* =====================================================
   COSTRUISCI SCALA
===================================================== */

function buildScale() {

    ticks.innerHTML = "";
    labels.innerHTML = "";

    const totalHeight =
        RANGE *
        2 *
        PIXELS_PER_EURO;

    timelineContent.style.height =
        totalHeight + "px";

    const centerY =
        totalHeight / 2;

    centerLine.style.top =
        "0px";

    centerLine.style.height =
        totalHeight + "px";


    for (
        let value = -RANGE;

        value <= RANGE;

        value += DISPLAY_STEP
    ) {

        const y =
            centerY -
            value *
            PIXELS_PER_EURO;


        /* TACCA */

        const tick =
            document.createElement("div");

        tick.className =
            "tick";


        if (
            value % 250 === 0
        ) {
            tick.classList.add(
                "major"
            );
        }


        if (
            value === 0
        ) {
            tick.classList.add(
                "zero"
            );
        }


        tick.style.top =
            y + "px";

        ticks.appendChild(
            tick
        );


        /* NUMERO */

        if (
            value % 250 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "scale-label";

            label.style.top =
                y + "px";


            const realValue =
                currentValue +
                value;


            label.textContent =
                formatValue(
                    realValue
                );


            label.style.color =
                getValueColor(
                    realValue
                );


            labels.appendChild(
                label
            );
        }
    }
}


/* =====================================================
   NOTE
===================================================== */

function drawNotes() {

    notesContainer.innerHTML =
        "";

    const entries =
        Object.entries(
            notes
        )
        .map(
            ([value, text]) => ({
                value: Number(value),
                text: String(text)
            })
        )
        .filter(
            item =>
                Number.isFinite(
                    item.value
                )
        );


    /*
       ORDINE MATEMATICO.

       -365
       viene prima di
       -350.
    */

    entries.sort(
        (a, b) =>
            a.value -
            b.value
    );


    const centerY =
        timelineContent
        .clientHeight / 2;


    /*
       NOTE SOPRA
    */

    const above =
        entries
        .filter(
            item =>
                item.value >
                currentValue
        )
        .sort(
            (a,b) =>
                b.value -
                a.value
        );


    /*
       NOTE SOTTO
    */

    const below =
        entries
        .filter(
            item =>
                item.value <
                currentValue
        )
        .sort(
            (a,b) =>
                b.value -
                a.value
        );


    above.forEach(
        (item, index) => {

            const note =
                createNote(
                    item.value,
                    item.text
                );

            note.style.top =
                (
                    centerY -
                    55 -
                    index * 44
                ) + "px";

            notesContainer.appendChild(
                note
            );
        }
    );


    below.forEach(
        (item, index) => {

            const note =
                createNote(
                    item.value,
                    item.text
                );

            note.style.top =
                (
                    centerY +
                    55 +
                    index * 44
                ) + "px";

            notesContainer.appendChild(
                note
            );
        }
    );
}


/* =====================================================
   CREA NOTA
===================================================== */

function createNote(
    value,
    text
) {

    const note =
        document.createElement(
            "div"
        );

    note.className =
        "note";


    const color =
        getValueColor(
            value
        );

    note.style.color =
        color;


    const valueElement =
        document.createElement(
            "span"
        );

    valueElement.className =
        "note-value";

    valueElement.textContent =
        formatValue(
            value
        );

    valueElement.style.color =
        color;


    const textElement =
        document.createElement(
            "span"
        );

    textElement.className =
        "note-text";

    textElement.textContent =
        text;

    textElement.style.color =
        color;


    note.appendChild(
        valueElement
    );

    note.appendChild(
        textElement
    );


    return note;
}


/* =====================================================
   SALVA NOTA
===================================================== */

function saveCurrentNote() {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {
        return;
    }


    const text =
        currentNote.value.trim();


    const key =
        String(
            currentValue
        );


    if (
        text === ""
    ) {

        delete notes[key];

    } else {

        notes[key] =
            text;
    }


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    drawNotes();
}


/* =====================================================
   CARICA NOTA
===================================================== */

function loadCurrentNote() {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentNote.value =
            "";

        return;
    }


    currentNote.value =
        notes[
            String(
                currentValue
            )
        ] || "";
}


/* =====================================================
   AGGIORNA SCHERMATA
===================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );

    updateRocketColor();

    buildScale();

    drawNotes();

    loadCurrentNote();


    /*
       Il razzo rimane sempre
       al centro.
    */

    requestAnimationFrame(
        () => {

            timeline.scrollTop =
                (
                    timelineContent
                    .clientHeight -
                    timeline.clientHeight
                ) / 2;
        }
    );
}


/* =====================================================
   VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const value =
        parseInput(
            startInput.value
        );


    if (
        !Number.isFinite(
            value
        )
    ) {

        startInput.focus();

        return;
    }


    startValue =
        value;

    currentValue =
        value;

    notes = {};


    localStorage.setItem(
        START_KEY,
        String(
            startValue
        )
    );

    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );

    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();
}


/* =====================================================
   VARIAZIONE
===================================================== */

function applyChange() {

    const change =
        parseInput(
            changeInput.value
        );


    if (
        !Number.isFinite(
            change
        )
    ) {

        changeInput.focus();

        return;
    }


    /*
       Salva prima la nota
       del valore attuale.
    */

    saveCurrentNote();


    /*
       Esempio:

       valore = -3000
       variazione = +1000

       risultato = -2000
    */

    currentValue =
        currentValue +
        change;


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    changeInput.value =
        "";


    updateDisplay();
}


/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi resettare tutto e inserire un nuovo valore iniziale?"
        );


    if (
        !confirmed
    ) {
        return;
    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        NOTES_KEY
    );


    startValue =
        NaN;

    currentValue =
        NaN;

    notes = {};


    startInput.value =
        "";

    changeInput.value =
        "";

    currentNote.value =
        "";


    startScreen.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {
            startInput.focus();
        },
        100
    );
}


/* =====================================================
   EVENTI
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {
            setInitialValue();
        }
    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {
            applyChange();
        }
    }
);


currentNote.addEventListener(
    "blur",
    saveCurrentNote
);


currentNote.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            saveCurrentNote();

            currentNote.blur();
        }
    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        if (
            Number.isFinite(
                currentValue
            )
        ) {
            updateDisplay();
        }
    }
);


/* =====================================================
   AVVIO
===================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {
        currentValue =
            startValue;
    }


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

} else {

    startScreen.classList.remove(
        "hidden"
    );
}

</script>

</body>
</html>
