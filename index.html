<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;
}

body {
    overscroll-behavior: none;
}

.app {

    position: relative;

    width: 100%;
    height: 100dvh;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   AREA SCORRIMENTO
===================================================== */

.timeline {

    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;

    overscroll-behavior-y: contain;

    z-index: 10;
}

.timeline::-webkit-scrollbar {
    display: none;
}


/* =====================================================
   CONTENITORE SCALA
===================================================== */

.timeline-content {

    position: relative;

    width: 100%;

    /*
       Spazio verticale limitato.

       Non permettiamo uno scroll infinito.
    */

    height: 2400px;
}


/* =====================================================
   LINEA CENTRALE
===================================================== */

.center-line {

    position: absolute;

    top: 0;

    left: 50%;

    width: 1px;

    height: 100%;

    transform:
        translateX(-50%);

    background:
        rgba(255,255,255,0.18);

    pointer-events: none;
}


/* =====================================================
   TACCHETTE
===================================================== */

.tick {

    position: absolute;

    left: 50%;

    width: 6px;
    height: 1px;

    transform:
        translateX(-50%);

    background:
        rgba(255,255,255,0.20);

    pointer-events: none;
}

.tick.major {

    width: 11px;

    background:
        rgba(255,255,255,0.35);
}

.tick.zero {

    width: 17px;

    background:
        rgba(255,255,255,0.75);
}


/* =====================================================
   NUMERI DELLA SCALA
===================================================== */

.scale-label {

    position: absolute;

    left: calc(50% - 25px);

    transform:
        translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;

    font-weight: 500;

    opacity: 0.65;

    pointer-events: none;
}


/* =====================================================
   NOTE
===================================================== */

.note {

    position: absolute;

    left: calc(50% + 31px);

    transform:
        translateY(-50%);

    max-width:
        calc(50% - 42px);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 13px;

    font-weight: 500;

    pointer-events: none;

    z-index: 30;
}

.note-value {

    margin-right: 7px;

    font-weight: 700;
}

.note-text {

    opacity: 0.90;
}


/* =====================================================
   INDICATORE FISSO
===================================================== */

.fixed-indicator {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 70;

    pointer-events: none;
}


/* =====================================================
   RAZZO
===================================================== */

.rocket {

    position: absolute;

    left: 8px;
    top: 0;

    width: 58px;
    height: 29px;

    transform:
        translateY(-50%);

    overflow: visible;

    transition:
        filter 0.2s ease;
}

.rocket-part {

    fill: #fff;

    transition:
        fill 0.2s ease;
}

.rocket-window {

    fill: #000;
}


/* =====================================================
   VALORE ATTUALE
===================================================== */

.current-info {

    position: absolute;

    left: 76px;
    top: 0;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    pointer-events: auto;
}

.current-value {

    font-size: 20px;

    line-height: 25px;

    font-weight: 700;

    white-space: nowrap;

    transition:
        color 0.2s ease;
}

.current-note {

    width: 180px;

    height: 27px;

    margin: 0;

    padding: 0;

    border: none;

    outline: none;

    background: transparent;

    color: #aaa;

    font-size: 13px;

    touch-action: auto;
}

.current-note::placeholder {

    color: #555;
}


/* =====================================================
   CONTROLLI
===================================================== */

.controls {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            16px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 80;
}

.change-input {

    width: 175px;

    height: 49px;

    padding:
        0 12px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 17px;

    font-weight: 600;

    /*
       TASTIERA NORMALE.
       In questo modo puoi inserire:

       -700
       +1300
       500
    */

    touch-action: auto;
}

.change-input::placeholder {

    color: #555;
}

.change-input:focus {

    border-color: #666;
}

.change-button {

    width: 55px;

    height: 49px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;
}

.change-button:active {

    transform:
        scale(0.96);
}


/* =====================================================
   RESET
===================================================== */

.reset-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    right: 12px;

    height: 37px;

    padding:
        0 13px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}


/* =====================================================
   SCHERMATA VALORE INIZIALE
===================================================== */

.start-screen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {

    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 700;
}

.start-subtitle {

    margin-bottom: 23px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {

    width: 220px;

    height: 54px;

    padding:
        0 10px;

    border:
        1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 21px;

    font-weight: 600;
}

.start-input::placeholder {

    color: #555;
}

.start-button {

    width: 220px;

    height: 49px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 700;
}

.hidden {

    display: none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    .rocket {

        width: 56px;
        height: 28px;
    }

    .current-info {

        left: 73px;
    }

    .current-value {

        font-size: 19px;
    }

    .current-note {

        width: 165px;
    }

    .note {

        font-size: 12px;
    }
}

</style>

</head>


<body>

<div class="app">


    <!-- =================================================
         SCALA SCORRIBILE
    ================================================== -->

    <div
        id="timeline"
        class="timeline"
    >

        <div
            id="timelineContent"
            class="timeline-content"
        >

            <div
                id="centerLine"
                class="center-line"
            ></div>

            <div id="ticks"></div>

            <div id="labels"></div>

            <div id="notes"></div>

        </div>

    </div>


    <!-- =================================================
         RAZZO FISSO AL CENTRO
    ================================================== -->

    <div
        id="fixedIndicator"
        class="fixed-indicator"
    >

        <svg
            id="rocket"
            class="rocket"
            viewBox="0 0 100 50"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                class="rocket-part"
                d="
                    M8 25
                    C25 10 52 7 78 25
                    C52 43 25 40 8 25
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M65 13
                    C82 15 94 21 99 25
                    C94 29 82 35 65 37
                    Z
                "
            />

            <circle
                cx="68"
                cy="25"
                r="5"
                class="rocket-window"
            />

            <path
                class="rocket-part"
                d="
                    M39 16
                    L25 5
                    L28 20
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M39 34
                    L25 45
                    L28 30
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M12 18
                    C1 20 1 30 12 32
                    L22 25
                    Z
                "
            />

        </svg>


        <div class="current-info">

            <div
                id="currentValue"
                class="current-value"
            >
                0 €
            </div>

            <input
                id="currentNote"
                class="current-note"
                type="text"
                maxlength="100"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Nota..."
            >

        </div>

    </div>


    <!-- =================================================
         VARIAZIONE
    ================================================== -->

    <div class="controls">

        <input
            id="changeInput"
            class="change-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="+ / - variazione"
        >

        <button
            id="changeButton"
            class="change-button"
        >
            OK
        </button>

    </div>


    <!-- =================================================
         RESET
    ================================================== -->

    <button
        id="resetButton"
        class="reset-button"
    >
        Reset
    </button>


    <!-- =================================================
         VALORE INIZIALE
    ================================================== -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div class="start-title">
            Rocket
        </div>

        <div class="start-subtitle">
            Inserisci il valore iniziale
        </div>

        <input
            id="startInput"
            class="start-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Valore iniziale"
        >

        <button
            id="startButton"
            class="start-button"
        >
            OK
        </button>

    </div>

</div>


<script>

/* =====================================================
   STORAGE
===================================================== */

const START_KEY =
    "rocket_start_value_v3";

const CURRENT_KEY =
    "rocket_current_value_v3";

const NOTES_KEY =
    "rocket_notes_v3";


/* =====================================================
   ELEMENTI
===================================================== */

const timeline =
    document.getElementById(
        "timeline"
    );

const timelineContent =
    document.getElementById(
        "timelineContent"
    );

const ticks =
    document.getElementById(
        "ticks"
    );

const labels =
    document.getElementById(
        "labels"
    );

const notesContainer =
    document.getElementById(
        "notes"
    );

const currentValueElement =
    document.getElementById(
        "currentValue"
    );

const currentNote =
    document.getElementById(
        "currentNote"
    );

const changeInput =
    document.getElementById(
        "changeInput"
    );

const changeButton =
    document.getElementById(
        "changeButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startInput =
    document.getElementById(
        "startInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const rocketParts =
    document.querySelectorAll(
        ".rocket-part"
    );

const rocket =
    document.getElementById(
        "rocket"
    );


/* =====================================================
   PARAMETRI SCALA
===================================================== */

const DISPLAY_RANGE =
    1100;

/*
   Ogni 25 euro c'è una tacchetta.

   25 euro = 27 pixel.

   Quindi la scala è abbastanza
   leggibile ma non enorme.
*/

const STEP =
    25;

const PIXELS_PER_STEP =
    27;

const PIXELS_PER_EURO =
    PIXELS_PER_STEP /
    STEP;


/* =====================================================
   LETTURA NUMERI
===================================================== */

function parseNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return NaN;
    }

    let text =
        String(value).trim();

    if (
        text === ""
    ) {
        return NaN;
    }

    text =
        text.replace(
            /\s/g,
            ""
        );

    /*
       Accetta:

       -700
       +700
       700
       -1.500
       +1.500
    */

    text =
        text.replace(
            /\./g,
            ""
        );

    text =
        text.replace(
            ",",
            "."
        );

    /*
       Se rimane un numero valido,
       lo convertiamo.
    */

    const number =
        Number(text);

    return Number.isFinite(number)
        ? number
        : NaN;
}


/* =====================================================
   FORMATTAZIONE
===================================================== */

function formatValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;

    const absolute =
        Math.abs(
            rounded
        ).toLocaleString(
            "it-IT",
            {
                minimumFractionDigits:
                    0,

                maximumFractionDigits:
                    2
            }
        );

    if (
        rounded > 0
    ) {

        return "+" +
            absolute +
            " €";
    }

    if (
        rounded < 0
    ) {

        return "-" +
            absolute +
            " €";
    }

    return "0 €";
}


/* =====================================================
   COLORI
=====================================================

   BIANCO
   0

   VERDE
   +1 → +1000
   +1001 → +2000
   +2001 → +3000
   +3001 → +4000
   +4001 → +5000

   ROSSO
   stessa logica sotto zero.
===================================================== */

function getValueColor(value) {

    if (
        value === 0
    ) {

        return "#FFFFFF";
    }


    /* -------------------------------
       VERDE
    -------------------------------- */

    if (
        value > 0
    ) {

        if (
            value <= 1000
        ) {

            return "#B8FFD0";
        }

        if (
            value <= 2000
        ) {

            return "#62F28A";
        }

        if (
            value <= 3000
        ) {

            return "#20DD65";
        }

        if (
            value <= 4000
        ) {

            return "#08C951";
        }

        return "#00A83F";
    }


    /* -------------------------------
       ROSSO
    -------------------------------- */

    const amount =
        Math.abs(
            value
        );

    if (
        amount <= 1000
    ) {

        return "#FFB9C0";
    }

    if (
        amount <= 2000
    ) {

        return "#FF6877";
    }

    if (
        amount <= 3000
    ) {

        return "#F8374C";
    }

    if (
        amount <= 4000
    ) {

        return "#E91E35";
    }

    return "#C90020";
}


/* =====================================================
   COLORE RAZZO + NUMERO
===================================================== */

function updateColor() {

    const color =
        getValueColor(
            currentValue
        );


    rocketParts.forEach(
        part => {

            part.style.fill =
                color;
        }
    );


    currentValueElement.style.color =
        color;


    rocket.style.filter =
        `drop-shadow(
            0 0 7px ${color}
        )`;
}


/* =====================================================
   COSTRUZIONE SCALA
===================================================== */

function buildScale() {

    ticks.innerHTML =
        "";

    labels.innerHTML =
        "";


    /*
       1100 sopra
       1100 sotto

       Rispetto al centro.
    */

    const halfRange =
        DISPLAY_RANGE;


    const totalHeight =
        (
            halfRange * 2
        ) *
        PIXELS_PER_EURO;


    timelineContent.style.height =
        totalHeight +
        "px";


    const centerY =
        totalHeight / 2;


    /*
       Tacchette ogni 25.
    */

    for (
        let relativeValue =
            -halfRange;

        relativeValue <=
            halfRange;

        relativeValue += STEP
    ) {


        /*
           Questa è una
           vera coordinata
           sulla retta numerica.

           Valore positivo
           -> sopra

           Valore negativo
           -> sotto
        */

        const y =
            centerY -
            (
                relativeValue *
                PIXELS_PER_EURO
            );


        const tick =
            document.createElement(
                "div"
            );

        tick.className =
            "tick";


        if (
            relativeValue %
            250 === 0
        ) {

            tick.classList.add(
                "major"
            );
        }


        if (
            relativeValue === 0
        ) {

            tick.classList.add(
                "zero"
            );
        }


        tick.style.top =
            `${y}px`;


        ticks.appendChild(
            tick
        );


        /*
           Numeri ogni 250.
        */

        if (
            relativeValue %
            250 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "scale-label";

            label.style.top =
                `${y}px`;


            /*
               IMPORTANTISSIMO:

               La scala rappresenta
               il valore relativo
               al valore attuale.

               Se attuale = -400

               sopra:

               -150
               +100
               ...

               sotto:

               -650
               -900
               ...
            */

            const scaleValue =
                currentValue +
                relativeValue;


            label.textContent =
                formatValue(
                    scaleValue
                );


            label.style.color =
                getValueColor(
                    scaleValue
                );


            labels.appendChild(
                label
            );
        }
    }
}


/* =====================================================
   CREAZIONE NOTA
===================================================== */

function createNote(
    value,
    text
) {

    const note =
        document.createElement(
            "div"
        );

    note.className =
        "note";


    const color =
        getValueColor(
            value
        );


    note.style.color =
        color;


    const valueElement =
        document.createElement(
            "span"
        );

    valueElement.className =
        "note-value";

    valueElement.textContent =
        formatValue(
            value
        );

    valueElement.style.color =
        color;


    const textElement =
        document.createElement(
            "span"
        );

    textElement.className =
        "note-text";

    textElement.textContent =
        text;

    textElement.style.color =
        color;


    note.appendChild(
        valueElement
    );

    note.appendChild(
        textElement
    );


    return note;
}


/* =====================================================
   DISEGNA NOTE
===================================================== */

function drawNotes() {

    notesContainer.innerHTML =
        "";


    const entries =
        Object.entries(
            notes
        )
        .map(
            ([value, text]) => {

                return {

                    value:
                        Number(value),

                    text:
                        String(text)
                };
            }
        )
        .filter(
            item =>
                Number.isFinite(
                    item.value
                )
        );


    /*
       Ordine numerico VERO.

       Non viene usato Math.abs().

       Esempio:

       -2000
       -700
       -400
       +100
       +500
    */

    entries.sort(
        (a, b) =>
            a.value -
            b.value
    );


    /*
       Centro reale della scala.
    */

    const centerY =
        timelineContent
        .clientHeight / 2;


    entries.forEach(
        item => {


            /*
               Se la nota è esattamente
               sul valore attuale,
               non la disegniamo come
               nota separata perché
               abbiamo il campo "Nota..."
               sotto il razzo.
            */

            if (
                item.value ===
                currentValue
            ) {

                return;
            }


            /*
               =================================================
               PARTE FONDAMENTALE
               =================================================

               NON:

               Math.abs()

               NON:

               valore assoluto

               MA:

               nota - valore attuale


               Esempio:

               attuale = -400
               nota    = -700

               -700 - (-400)
               = -300

               differenza NEGATIVA

               quindi:

               Y = centro + distanza

               -> SOTTO


               Altro esempio:

               attuale = -700
               nota    = -400

               -400 - (-700)
               = +300

               differenza POSITIVA

               quindi:

               Y = centro - distanza

               -> SOPRA
            */

            const difference =
                item.value -
                currentValue;


            /*
               CSS:

               Y piccolo
               = sopra

               Y grande
               = sotto
            */

            const y =
                centerY -
                (
                    difference *
                    PIXELS_PER_EURO
                );


            const note =
                createNote(
                    item.value,
                    item.text
                );


            note.style.top =
                `${y}px`;


            notesContainer.appendChild(
                note
            );
        }
    );
}


/* =====================================================
   SALVA NOTA
===================================================== */

function saveCurrentNote() {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        return;
    }


    const text =
        currentNote.value.trim();


    const key =
        String(
            currentValue
        );


    if (
        text === ""
    ) {

        delete notes[key];

    } else {

        notes[key] =
            text;
    }


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    drawNotes();
}


/* =====================================================
   CARICA NOTA
===================================================== */

function loadCurrentNote() {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentNote.value =
            "";

        return;
    }


    currentNote.value =
        notes[
            String(
                currentValue
            )
        ] || "";
}


/* =====================================================
   CENTRA LO SCROLL
===================================================== */

function centerTimeline() {

    const maxScroll =
        timelineContent
        .scrollHeight -
        timeline.clientHeight;


    if (
        maxScroll <= 0
    ) {

        timeline.scrollTop =
            0;

        return;
    }


    timeline.scrollTop =
        maxScroll / 2;
}


/* =====================================================
   AGGIORNA SCHERMATA
===================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    updateColor();

    buildScale();

    drawNotes();

    loadCurrentNote();


    /*
       Il razzo è fisso.
       Riportiamo la scala
       al centro.
    */

    requestAnimationFrame(
        () => {

            centerTimeline();
        }
    );
}


/* =====================================================
   IMPOSTA VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const value =
        parseNumber(
            startInput.value
        );


    if (
        !Number.isFinite(
            value
        )
    ) {

        startInput.focus();

        return;
    }


    startValue =
        value;

    currentValue =
        value;


    /*
       Nuova partenza
       = nuove note.
    */

    notes = {};


    localStorage.setItem(
        START_KEY,
        String(
            startValue
        )
    );

    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );

    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();
}


/* =====================================================
   APPLICA VARIAZIONE
===================================================== */

function applyChange() {

    const change =
        parseNumber(
            changeInput.value
        );


    if (
        !Number.isFinite(
            change
        )
    ) {

        changeInput.focus();

        return;
    }


    /*
       Prima salviamo la nota
       del valore dal quale
       stiamo partendo.
    */

    saveCurrentNote();


    /*
       Variazione vera.

       -700 + 300 = -400

       -700 - 300 = -1000
    */

    currentValue =
        currentValue +
        change;


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    changeInput.value =
        "";


    updateDisplay();
}


/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi cancellare il valore iniziale e tutte le note?"
        );


    if (
        !confirmed
    ) {

        return;
    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        NOTES_KEY
    );


    startValue =
        NaN;

    currentValue =
        NaN;

    notes = {};


    startInput.value =
        "";

    changeInput.value =
        "";

    currentNote.value =
        "";


    startScreen.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {

            startInput.focus();

        },
        100
    );
}


/* =====================================================
   EVENTI
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            setInitialValue();
        }
    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            applyChange();
        }
    }
);


currentNote.addEventListener(
    "blur",
    saveCurrentNote
);


currentNote.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            saveCurrentNote();

            currentNote.blur();
        }
    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =====================================================
   AVVIO
===================================================== */

let savedStart =
    parseNumber(
        localStorage.getItem(
            START_KEY
        )
    );

let savedCurrent =
    parseNumber(
        localStorage.getItem(
            CURRENT_KEY
        )
    );


if (
    Number.isFinite(
        savedStart
    )
) {

    startValue =
        savedStart;

    currentValue =
        Number.isFinite(
            savedCurrent
        )
        ? savedCurrent
        : savedStart;


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

} else {

    startScreen.classList.remove(
        "hidden"
    );
}

</script>
