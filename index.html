<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;

    overscroll-behavior: none;
}

body {
    position: fixed;

    width: 100%;
    height: 100%;

    touch-action: pan-y;
}

.app {
    position: relative;

    width: 100%;
    height: 100dvh;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   SCALA
===================================================== */

.timeline {

    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;

    overscroll-behavior-y: contain;

    z-index: 10;

    touch-action: pan-y;
}

.timeline::-webkit-scrollbar {
    display: none;
}

.timeline-content {

    position: relative;

    width: 100%;

    height: 2400px;
}


/* =====================================================
   LINEA CENTRALE
===================================================== */

.center-line {

    position: absolute;

    top: 0;
    left: 50%;

    width: 1px;
    height: 100%;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.18);

    pointer-events: none;
}


/* =====================================================
   TACCHETTE
===================================================== */

.tick {

    position: absolute;

    left: 50%;

    width: 6px;
    height: 1px;

    transform: translateX(-50%);

    background:
        rgba(255,255,255,0.20);

    pointer-events: none;
}

.tick.major {

    width: 11px;

    background:
        rgba(255,255,255,0.35);
}

.tick.zero {

    width: 17px;

    background:
        rgba(255,255,255,0.75);
}


/* =====================================================
   NUMERI DELLA SCALA
===================================================== */

.scale-label {

    position: absolute;

    left: calc(50% - 25px);

    transform:
        translate(-100%, -50%);

    white-space: nowrap;

    font-size: 10px;

    font-weight: 500;

    opacity: 0.65;

    pointer-events: none;
}


/* =====================================================
   OBIETTIVI
===================================================== */

.goals-layer {

    position: absolute;

    top: 50%;

    left: 10px;

    width: calc(50% - 45px);

    max-height: 58vh;

    transform:
        translateY(-50%);

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    z-index: 50;

    pointer-events: auto;

    -webkit-overflow-scrolling: touch;
}

.goals-layer::-webkit-scrollbar {
    display: none;
}


/* =====================================================
   SINGOLO OBIETTIVO
===================================================== */

.goal-item {

    width: 100%;

    margin-bottom: 14px;

    padding-bottom: 10px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

    font-size: 12px;

    line-height: 17px;

    word-break: break-word;

    user-select: none;

    -webkit-user-select: none;
}

.goal-value {

    display: inline-block;

    margin-right: 5px;

    font-weight: 700;
}

.goal-text {

    opacity: 0.90;
}

.goal-delete {

    float: left;

    width: 19px;
    height: 19px;

    margin-right: 5px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background: #1b1b1b;

    color: #777;

    font-size: 11px;

    line-height: 19px;

    text-align: center;
}

.goal-delete:active {

    transform:
        scale(0.9);
}


/* =====================================================
   RAZZO CENTRALE
===================================================== */

.fixed-indicator {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    z-index: 70;

    pointer-events: none;
}

.rocket {

    position: absolute;

    left: 8px;
    top: 0;

    width: 58px;
    height: 29px;

    transform:
        translateY(-50%);

    overflow: visible;

    transition:
        filter 0.2s ease;
}

.rocket-part {

    fill: #fff;

    transition:
        fill 0.2s ease;
}

.rocket-window {

    fill: #000;
}


/* =====================================================
   VALORE ATTUALE
===================================================== */

.current-info {

    position: absolute;

    left: 76px;
    top: 0;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    pointer-events: auto;
}

.current-value {

    font-size: 20px;

    line-height: 25px;

    font-weight: 700;

    white-space: nowrap;

    transition:
        color 0.2s ease;
}


/* =====================================================
   CONTROLLI
===================================================== */

.controls {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            16px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 80;
}

.change-input {

    width: 175px;
    height: 49px;

    padding: 0 12px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 17px;

    font-weight: 600;
}

.change-input::placeholder {

    color: #555;
}

.change-note {

    position: absolute;

    width: 175px;
    height: 49px;

    padding: 0 12px;

    left: 0;

    top: 57px;

    border:
        1px solid #333;

    border-radius: 13px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 17px;

    font-weight: 600;
}

.change-note::placeholder {

    color: #555;
}

.change-button {

    width: 55px;
    height: 49px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;
}

.change-button:active {

    transform:
        scale(0.96);
}


/* =====================================================
   PLUS OBIETTIVI
===================================================== */

.add-goal-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    left: 12px;

    width: 37px;
    height: 37px;

    padding: 0;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #fff;

    font-size: 25px;

    font-weight: 400;

    line-height: 37px;

    text-align: center;

    z-index: 90;
}

.add-goal-button:active {

    transform:
        scale(0.94);
}


/* =====================================================
   FINESTRA NUOVO OBIETTIVO
===================================================== */

.goal-modal {

    position: absolute;

    top: 60px;
    left: 12px;

    width: 220px;

    padding: 14px;

    border:
        1px solid #333;

    border-radius: 14px;

    background: #111;

    z-index: 95;
}

.goal-modal-title {

    margin-bottom: 10px;

    font-size: 15px;

    font-weight: 700;
}

.goal-input {

    width: 100%;
    height: 42px;

    margin-bottom: 8px;

    padding: 0 10px;

    border:
        1px solid #333;

    border-radius: 11px;

    outline: none;

    background: #000;

    color: #fff;

    font-size: 15px;
}

.goal-input::placeholder {

    color: #555;
}

.goal-name-input {

    width: 100%;
    height: 42px;

    margin-bottom: 10px;

    padding: 0 10px;

    border:
        1px solid #333;

    border-radius: 11px;

    outline: none;

    background: #000;

    color: #fff;

    font-size: 15px;
}

.goal-name-input::placeholder {

    color: #555;
}

.goal-save-button {

    width: 100%;
    height: 42px;

    border: none;

    border-radius: 11px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;
}


/* =====================================================
   RESET
===================================================== */

.reset-button {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    right: 12px;

    height: 37px;

    padding: 0 13px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 90;
}


/* =====================================================
   SCHERMATA INIZIALE
===================================================== */

.start-screen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background: #000;
}

.start-title {

    margin-bottom: 8px;

    font-size: 30px;

    font-weight: 700;
}

.start-subtitle {

    margin-bottom: 23px;

    color: #777;

    font-size: 14px;

    text-align: center;
}

.start-input {

    width: 220px;
    height: 54px;

    padding: 0 10px;

    border:
        1px solid #444;

    border-radius: 14px;

    outline: none;

    background: #111;

    color: #fff;

    text-align: center;

    font-size: 21px;

    font-weight: 600;
}

.start-input::placeholder {

    color: #555;
}

.start-button {

    width: 220px;
    height: 49px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 700;
}

.hidden {

    display: none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    .rocket {

        width: 56px;
        height: 28px;
    }

    .current-info {

        left: 73px;
    }

    .current-value {

        font-size: 19px;
    }

    .goals-layer {

        left: 7px;

        width: calc(50% - 40px);
    }

    .goal-item {

        font-size: 11px;

        line-height: 16px;
    }

}

</style>

</head>


<body>

<div class="app">


    <!-- =================================================
         SCALA SCORRIBILE
    ================================================= -->

    <div

    >

        <div
            id="timelineContent"

        >

            <div

        </div>

    </div>


    <!-- =================================================
         OBIETTIVI
    ================================================= -->

        id="goalsLayer"
        class="goals-layer"
    ></div>


    <!-- =================================================
         RAZZO
    ================================================= -->

    <div

    >

        <svg

            <path

                    C52 43 25 40 8 25

            />

                    M65 13

                    Z
                "
            />

            <circle
                cx="68"
                cy="25"
                r="5"
                class="rocket-window"
            />

            <path
                class="rocket-part"
                d="
                    M39 16
                    L25 5
                    L28 20
                    Z
                "
            />

            <path
                class="rocket-part"
                d="
                    M39 34
                    L25 45
                    L28 30
                    Z
                "
            />

            <path

                d="

                    L22 25

                "

    <!-- =================================================

    <button

    ================================================= -->

    <div

        class="goal-modal hidden"

        <div
            class="goal-modal-title"

        </div>

        <input
            id="goalInput"

    <div

        <button
            id="startButton"

            OK

<script>

/* =====================================================
   BLOCCO ZOOM
===================================================== */

document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturechange",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gestureend",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "touchmove",
    function(event) {

        if (
            event.touches.length > 1
        ) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);


/* =====================================================
   STORAGE
===================================================== */

const START_KEY =
    "rocket_start_value_v8";

const CURRENT_KEY =
    "rocket_current_value_v8";

const HISTORY_KEY =
    "rocket_history_v8";

const GOALS_KEY =
    "rocket_goals_v8";


/* =====================================================
   ELEMENTI
===================================================== */

const timeline =
    document.getElementById(
        "timeline"
    );

const timelineContent =
    document.getElementById(
        "timelineContent"
    );

const ticks =
    document.getElementById(
        "ticks"
    );

const labels =
    document.getElementById(
        "labels"
    );

const goalsLayer =
    document.getElementById(
        "goalsLayer"
    );

const currentValueElement =
    document.getElementById(
        "currentValue"
    );

const changeInput =
    document.getElementById(
        "changeInput"
    );

const changeNote =
    document.getElementById(
        "changeNote"
    );

const changeButton =
    document.getElementById(
        "changeButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const addGoalButton =
    document.getElementById(
        "addGoalButton"
    );

const goalModal =
    document.getElementById(
        "goalModal"
    );

const goalInput =
    document.getElementById(
        "goalInput"
    );

const goalNameInput =
    document.getElementById(
        "goalNameInput"
    );

const goalSaveButton =
    document.getElementById(
        "goalSaveButton"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startInput =
    document.getElementById(
        "startInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const rocketParts =
    document.querySelectorAll(
        ".rocket-part"
    );

const rocket =
    document.getElementById(
        "rocket"
    );


/* =====================================================
   PARAMETRI SCALA
===================================================== */

const DISPLAY_RANGE =
    1100;

const STEP =
    25;

const PIXELS_PER_STEP =
    27;

const PIXELS_PER_EURO =
    PIXELS_PER_STEP /
    STEP;


/* =====================================================
   NUMERI
===================================================== */

function parseNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return NaN;
    }

    let text =
        String(value).trim();


    if (
        text === ""
    ) {

        return NaN;
    }


    text =
        text.replace(
            /\s/g,
            ""
        );


    if (
        text.includes(",")
    ) {

        text =
            text.replace(
                /\./g,
                ""
            );

        text =
            text.replace(
                ",",
                "."
            );

    } else {

        text =
            text.replace(
                /^([+-]?\d+)\.(\d{3})$/,
                "$1$2"
            );
    }


    const number =
        Number(text);


    return Number.isFinite(number)
        ? number
        : NaN;
}


/* =====================================================
   FORMATTAZIONE
===================================================== */

function formatValue(value) {

    const rounded =
        Math.round(
            value * 100
        ) / 100;


    const absolute =
        Math.abs(rounded)
            .toLocaleString(
                "it-IT",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );


    if (
        rounded > 0
    ) {

        return "+" +
            absolute +
            " €";
    }


    if (
        rounded < 0
    ) {

        return "-" +
            absolute +
            " €";
    }


    return "0 €";
}


/* =====================================================
   COLORI
===================================================== */

function getValueColor(value) {

    if (
        value === 0
    ) {

        return "#FFFFFF";
    }


    if (
        value > 0
    ) {

        if (
            value <= 1000
        ) {

            return "#B8FFD0";
        }

        if (
            value <= 2000
        ) {

            return "#62F28A";
        }

        if (
            value <= 3000
        ) {

            return "#20DD65";
        }

        if (
            value <= 4000
        ) {

            return "#08C951";
        }

        return "#00A83F";
    }


    const amount =
        Math.abs(value);


    if (
        amount <= 1000
    ) {

        return "#FFB9C0";
    }

    if (
        amount <= 2000
    ) {

        return "#FF6877";
    }

    if (
        amount <= 3000
    ) {

        return "#F8374C";
    }

    if (
        amount <= 4000
    ) {

        return "#E91E35";
    }

    return "#C90020";
}


/* =====================================================
   COLORE RAZZO
===================================================== */

function updateColor() {

    const color =
        getValueColor(
            currentValue
        );


    rocketParts.forEach(
        part => {

            part.style.fill =
                color;

        }
    );


    currentValueElement.style.color =
        color;


    rocket.style.filter =
        `drop-shadow(
            0 0 7px ${color}
        )`;
}


/* =====================================================
   COSTRUZIONE SCALA
===================================================== */

function buildScale() {

    ticks.innerHTML =
        "";

    labels.innerHTML =
        "";


    const totalValueRange =
        DISPLAY_RANGE * 2;


    const totalHeight =
        totalValueRange *
        PIXELS_PER_EURO;


    timelineContent.style.height =
        totalHeight + "px";


    const centerY =
        totalHeight / 2;


    const minimumValue =
        currentValue -
        DISPLAY_RANGE;


    const maximumValue =
        currentValue +
        DISPLAY_RANGE;


    const firstValue =
        Math.ceil(
            minimumValue / STEP
        ) * STEP;


    const lastValue =
        Math.floor(
            maximumValue / STEP
        ) * STEP;


    for (
        let scaleValue =
            firstValue;

        scaleValue <=
            lastValue;

        scaleValue +=
            STEP
    ) {


        const difference =
            scaleValue -
            currentValue;


        const y =
            centerY -
            (
                difference *
                PIXELS_PER_EURO
            );


        const tick =
            document.createElement(
                "div"
            );


        tick.className =
            "tick";


        if (
            scaleValue % 250 === 0
        ) {

            tick.classList.add(
                "major"
            );
        }


        if (
            scaleValue === 0
        ) {

            tick.classList.add(
                "zero"
            );
        }


        tick.style.top =
            `${y}px`;


        ticks.appendChild(
            tick
        );


        if (
            scaleValue % 250 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "scale-label";


            label.style.top =
                `${y}px`;


            label.textContent =
                formatValue(
                    scaleValue
                );


            label.style.color =
                getValueColor(
                    scaleValue
                );


            labels.appendChild(
                label
            );
        }
    }
}


/* =====================================================
   DISEGNA OBIETTIVI
===================================================== */

function drawGoals() {

    goalsLayer.innerHTML =
        "";


    /*
       ORDINE NUMERICO.

       Esempio:

       -500
       -200
       100
       1000

       NON:

       -200
       -500

       quindi usiamo direttamente
       a.value - b.value.
    */

    const sortedGoals =
        [...goals]
            .sort(
                (a, b) =>
                    a.value -
                    b.value
            );


    sortedGoals.forEach(
        (goal, index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "goal-item";


            const color =
                getValueColor(
                    goal.value
                );


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "goal-delete";

            deleteButton.textContent =
                "×";


            deleteButton.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();


                    goals =
                        goals.filter(
                            currentGoal =>
                                currentGoal.id !==
                                goal.id
                        );


                    saveGoals();

                    drawGoals();

                }
            );


            const valueElement =
                document.createElement(
                    "span"
                );


            valueElement.className =
                "goal-value";


            valueElement.textContent =
                formatValue(
                    goal.value
                );


            valueElement.style.color =
                color;


            const textElement =
                document.createElement(
                    "span"
                );


            textElement.className =
                "goal-text";


            textElement.textContent =
                goal.name;


            textElement.style.color =
                color;


            item.appendChild(
                deleteButton
            );


            item.appendChild(
                valueElement
            );


            item.appendChild(
                textElement
            );


            goalsLayer.appendChild(
                item
            );

        }
    );
}


/* =====================================================
   SALVA OBIETTIVI
===================================================== */

function saveGoals() {

    localStorage.setItem(
        GOALS_KEY,
        JSON.stringify(
            goals
        )
    );
}


/* =====================================================
   AGGIUNGI OBIETTIVO
===================================================== */

function addGoal() {

    const value =
        parseNumber(
            goalInput.value
        );


    const name =
        goalNameInput.value.trim();


    /*
       Entrambi obbligatori.
    */

    if (
        !Number.isFinite(value)
    ) {

        goalInput.focus();

        return;
    }


    if (
        name === ""
    ) {

        goalNameInput.focus();

        return;
    }


    goals.push({

        id:
            Date.now(),

        value:
            value,

        name:
            name

    });


    saveGoals();

    drawGoals();


    goalInput.value =
        "";

    goalNameInput.value =
        "";


    goalModal.classList.add(
        "hidden"
    );
}


/* =====================================================
   CENTRA SCALA
===================================================== */

function centerTimeline() {

    const maxScroll =
        timeline.scrollHeight -
        timeline.clientHeight;


    if (
        maxScroll <= 0
    ) {

        timeline.scrollTop =
            0;

        return;
    }


    timeline.scrollTop =
        maxScroll / 2;
}


/* =====================================================
   DISPLAY
===================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    updateColor();

    buildScale();

    drawGoals();


    requestAnimationFrame(
        () => {

            centerTimeline();

        }
    );
}


/* =====================================================
   VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const value =
        parseNumber(
            startInput.value
        );


    if (
        !Number.isFinite(value)
    ) {

        startInput.focus();

        return;
    }


    startValue =
        value;


    currentValue =
        value;


    history = [];

    goals = [];


    localStorage.setItem(
        START_KEY,
        String(
            startValue
        )
    );


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
            history
        )
    );


    localStorage.setItem(
        GOALS_KEY,
        JSON.stringify(
            goals
        )
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();
}


/* =====================================================
   VARIAZIONE
===================================================== */

function applyChange() {

    const change =
        parseNumber(
            changeInput.value
        );


    const note =
        changeNote.value.trim();


    /*
       VARIAZIONE E NOTA
       SONO ENTRAMBI OBBLIGATORI.
    */

    if (
        !Number.isFinite(change)
    ) {

        changeInput.focus();

        return;
    }


    if (
        note === ""
    ) {

        changeNote.focus();

        return;
    }


    /*
       Il nuovo valore viene
       calcolato:

       precedente + variazione
    */

    const newValue =
        currentValue +
        change;


    history.push({

        value:
            newValue,

        text:
            note

    });


    currentValue =
        newValue;


    localStorage.setItem(
        CURRENT_KEY,
        String(
            currentValue
        )
    );


    saveHistory();


    changeInput.value =
        "";

    changeNote.value =
        "";


    updateDisplay();
}


/* =====================================================
   SALVA STORICO
===================================================== */

function saveHistory() {

    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
            history
        )
    );
}


/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmed =
        confirm(
            "Vuoi cancellare il valore iniziale, lo storico e tutti gli obiettivi?"
        );


    if (
        !confirmed
    ) {

        return;
    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        HISTORY_KEY
    );

    localStorage.removeItem(
        GOALS_KEY
    );


    startValue =
        NaN;


    currentValue =
        NaN;


    history =
        [];


    goals =
        [];


    startInput.value =
        "";

    changeInput.value =
        "";

    changeNote.value =
        "";


    goalsLayer.innerHTML =
        "";


    startScreen.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {

            startInput.focus();

        },
        100
    );
}


/* =====================================================
   EVENTI
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();

        }

    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();

        }

    }
);


changeNote.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            applyChange();

        }

    }
);


/* =====================================================
   APERTURA OBIETTIVI
===================================================== */

addGoalButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        goalModal.classList.toggle(
            "hidden"
        );


        if (
            !goalModal.classList.contains(
                "hidden"
            )
        ) {

            goalInput.focus();

        }

    }
);


/* =====================================================
   SALVATAGGIO OBIETTIVO
===================================================== */

goalSaveButton.addEventListener(
    "click",
    addGoal
);


goalInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            goalNameInput.focus();

        }

    }
);


goalNameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            addGoal();

        }

    }
);


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
    "click",
    resetApp
);


/* =====================================================
   CARICAMENTO DATI
===================================================== */

let startValue =
    parseNumber(
        localStorage.getItem(
            START_KEY
        )
    );


let currentValue =
    parseNumber(
        localStorage.getItem(
            CURRENT_KEY
        )
    );


let history = [];


let goals = [];


/* =====================================================
   CARICA STORICO
===================================================== */

try {

    history =
        JSON.parse(
            localStorage.getItem(
                HISTORY_KEY
            )
        ) || [];


    if (
        !Array.isArray(
            history
        )
    ) {

        history = [];

    }

} catch {

    history = [];

}


/* =====================================================
   CARICA OBIETTIVI
===================================================== */

try {

    goals =
        JSON.parse(
            localStorage.getItem(
                GOALS_KEY
            )
        ) || [];


    if (
        !Array.isArray(
            goals
        )
    ) {

        goals = [];

    }

} catch {

    goals = [];

}


/* =====================================================
   AVVIO
===================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;

    }


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

} else {

    startScreen.classList.remove(
        "hidden"
    );

}

</script>
