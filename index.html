<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    viewport-fit=cover,
    user-scalable=no"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>


<style>

/* ==================================================
   BASE
================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;

    touch-action: none;
}


.app {

    position: relative;

    width: 100%;
    height: 100%;

    background: #000;
}


/* ==================================================
   AREA SCROLLABILE
================================================== */

#world {

    position: absolute;

    inset: 0;

    overflow: hidden;

    touch-action: none;
}


/* ==================================================
   LINEA CENTRALE
================================================== */

.center-line {

    position: absolute;

    left: 50%;
    top: -10000px;

    width: 2px;
    height: 20000px;

    background: #505050;

    transform:
        translateX(-50%);
}


/* ==================================================
   SCALA
================================================== */

#scale {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;

    pointer-events: none;
}


.tick {

    position: absolute;

    left: 50%;

    height: 1px;

    background: #666;

    transform:
        translateX(-50%);
}


.tick.small {

    width: 7px;

    opacity: 0.28;
}


.tick.medium {

    width: 11px;

    opacity: 0.42;
}


.tick.zero {

    width: 16px;

    opacity: 0.65;
}


/* ==================================================
   NOTE SULLA SCALA
================================================== */

.saved-note {

    position: absolute;

    left:
        calc(50% + 18px);

    transform:
        translateY(-50%);

    color: #777;

    font-size: 12px;

    white-space: nowrap;

    max-width: 42vw;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* ==================================================
   INDICATORE
================================================== */

.indicator {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 0;
    height: 0;

    z-index: 20;

    pointer-events: none;
}


/* ==================================================
   RAZZO
================================================== */

.rocket {

    position: absolute;

    right: 12px;

    top: 50%;

    width: 58px;
    height: 30px;

    transform:
        translateY(-50%);

    transition:
        filter 0.15s ease;
}


/* ==================================================
   PANNELLO VALORE ATTUALE
================================================== */

.current-panel {

    position: absolute;

    left: 18px;

    top: 50%;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    pointer-events: auto;

    white-space: nowrap;
}


.current-value {

    font-size: 21px;

    line-height: 25px;

    font-weight: 600;

    transition:
        color 0.15s ease;
}


.note-input {

    width: 155px;

    height: 30px;

    margin-top: 2px;

    padding: 0;

    background: transparent;

    border: none;

    outline: none;

    color: #888;

    font-size: 13px;

    line-height: 18px;
}


.note-input::placeholder {

    color: #444;
}


.note-input:focus {

    color: #aaa;
}


/* ==================================================
   COLORI
================================================== */

.positive {

    color: #35d982;
}


.negative {

    color: #ff4d5a;
}


.neutral {

    color: #fff;
}


.rocket.positive {

    filter:
        brightness(0)
        saturate(100%)
        invert(72%)
        sepia(70%)
        saturate(600%)
        hue-rotate(95deg)
        brightness(95%);
}


.rocket.negative {

    filter:
        brightness(0)
        saturate(100%)
        invert(42%)
        sepia(90%)
        saturate(1700%)
        hue-rotate(330deg)
        brightness(105%);
}


/* ==================================================
   INPUT
================================================== */

.input-area {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            30px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    z-index: 50;
}


.value-input {

    width: 185px;

    height: 52px;

    padding: 0 15px;

    background: #111;

    border:
        1px solid #3d3d3d;

    border-radius: 13px;

    outline: none;

    color: #fff;

    text-align: center;

    font-size: 22px;

    font-weight: 600;
}


.value-input:focus {

    border-color: #777;
}


.value-input::placeholder {

    color: #4d4d4d;
}


/* ==================================================
   INDICAZIONE ZOOM
================================================== */

.zoom-info {

    position: absolute;

    top:
        calc(
            14px +
            env(safe-area-inset-top)
        );

    right: 15px;

    color: #333;

    font-size: 10px;

    z-index: 40;

    pointer-events: none;
}

</style>

</head>


<body>


<div class="app">


    <div id="world">


        <!-- LINEA -->

        <div class="center-line"></div>


        <!-- SCALA -->

        <div id="scale"></div>


        <!-- INDICATORE -->

        <div
            id="indicator"
            class="indicator"
        >


            <!-- RAZZO -->

            <svg
                id="rocket"
                class="rocket"
                viewBox="0 0 100 50"
                xmlns="http://www.w3.org/2000/svg"
            >

                <path
                    d="
                        M 10 25
                        C 28 10,
                          52 8,
                          78 25
                        C 52 42,
                          28 40,
                          10 25
                        Z
                    "
                    fill="white"
                />

                <path
                    d="
                        M 65 13
                        C 82 15,
                          94 21,
                          99 25
                        C 94 29,
                          82 35,
                          65 37
                        Z
                    "
                    fill="white"
                />

                <circle
                    cx="67"
                    cy="25"
                    r="5"
                    fill="black"
                />

                <path
                    d="
                        M 38 16
                        L 25 5
                        L 28 20
                        Z
                    "
                    fill="white"
                />

                <path
                    d="
                        M 38 34
                        L 25 45
                        L 28 30
                        Z
                    "
                    fill="white"
                />

                <path
                    d="
                        M 12 18
                        C 2 20,
                          2 30,
                          12 32
                        L 22 25
                        Z
                    "
                    fill="white"
                />

            </svg>


            <!-- VALORE ATTUALE -->

            <div
                class="current-panel"
            >

                <div
                    id="currentValue"
                    class="current-value"
                >
                    0 €
                </div>


                <input
                    id="noteInput"
                    class="note-input"
                    type="text"
                    maxlength="60"
                    autocomplete="off"
                    autocorrect="on"
                    autocapitalize="sentences"
                    placeholder="Nota..."
                >

            </div>

        </div>

    </div>


    <!-- INPUT VALORE -->

    <div
        class="input-area"
    >

        <input
            id="valueInput"
            class="value-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Inserisci valore"
        >

    </div>


</div>


<script>

/* ==================================================
   CONFIGURAZIONE
================================================== */

const MIN_VALUE = -10000;

const MAX_VALUE = 20000;

const STEP = 25;


/*
   Distanza iniziale tra
   due tacche da 25 €.
*/

let pixelsPerStep = 8;


/*
   Memoria.
*/

const VALUE_KEY =
    "rocket-current-value";

const NOTES_KEY =
    "rocket-notes";

const ZOOM_KEY =
    "rocket-zoom";


/* ==================================================
   VALORE ATTUALE
================================================== */

let currentValue =
    Number(
        localStorage.getItem(
            VALUE_KEY
        )
    );


if (
    !Number.isFinite(
        currentValue
    )
) {

    currentValue = 0;

}


/* ==================================================
   NOTE
================================================== */

let notes = {};

try {

    notes =
        JSON.parse(
            localStorage.getItem(
                NOTES_KEY
            )
        ) || {};

}

catch {

    notes = {};

}


/* ==================================================
   ZOOM SALVATO
================================================== */

const savedZoom =
    Number(
        localStorage.getItem(
            ZOOM_KEY
        )
    );


if (
    Number.isFinite(
        savedZoom
    )
) {

    pixelsPerStep =
        Math.max(
            3,
            Math.min(
                25,
                savedZoom
            )
        );

}


/* ==================================================
   POSIZIONE VISIVA
================================================== */

/*
   viewValue è il punto che
   stiamo guardando.

   Non deve per forza coincidere
   con il valore attuale del razzo.
*/

let viewValue =
    currentValue;


/* ==================================================
   ELEMENTI
================================================== */

const world =
    document.getElementById(
        "world"
    );

const scale =
    document.getElementById(
        "scale"
    );

const indicator =
    document.getElementById(
        "indicator"
    );

const rocket =
    document.getElementById(
        "rocket"
    );

const currentValueElement =
    document.getElementById(
        "currentValue"
    );

const noteInput =
    document.getElementById(
        "noteInput"
    );

const valueInput =
    document.getElementById(
        "valueInput"
    );


/* ==================================================
   FORMATTAZIONE
================================================== */

function formatValue(value) {

    const absolute =
        Math.abs(value)
        .toLocaleString(
            "it-IT"
        );


    if (
        value > 0
    ) {

        return "+" +
               absolute +
               " €";

    }


    if (
        value < 0
    ) {

        return "-" +
               absolute +
               " €";

    }


    return "0 €";

}


/* ==================================================
   COLORE
================================================== */

function updateColors() {

    currentValueElement.classList.remove(
        "positive",
        "negative",
        "neutral"
    );

    rocket.classList.remove(
        "positive",
        "negative"
    );


    if (
        currentValue > 0
    ) {

        currentValueElement.classList.add(
            "positive"
        );

        rocket.classList.add(
            "positive"
        );

    }

    else if (
        currentValue < 0
    ) {

        currentValueElement.classList.add(
            "negative"
        );

        rocket.classList.add(
            "negative"
        );

    }

    else {

        currentValueElement.classList.add(
            "neutral"
        );

    }

}


/* ==================================================
   SALVA NOTA
================================================== */

function saveNote() {

    const key =
        String(
            currentValue
        );

    const text =
        noteInput.value.trim();


    if (
        text === ""
    ) {

        delete notes[key];

    }

    else {

        notes[key] =
            text;

    }


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    drawScale();

}


/* ==================================================
   CARICA NOTA
================================================== */

function loadNote() {

    noteInput.value =
        notes[
            String(currentValue)
        ] || "";

}


/* ==================================================
   POSIZIONE RAZZO
================================================== */

function updateIndicator() {

    /*
       Il valore corrente è sempre
       al centro dello schermo.
    */

    indicator.style.top =
        (
            window.innerHeight / 2
        ) + "px";

}


/* ==================================================
   DISEGNA SCALA
================================================== */

function drawScale() {

    scale.innerHTML = "";


    const center =
        window.innerHeight / 2;


    /*
       Quanti euro corrispondono
       a un pixel.
    */

    const pixelsPerEuro =
        pixelsPerStep / STEP;


    /*
       Il punto viewValue
       viene messo al centro.
    */

    const viewY =
        center;


    /*
       Quante tacche servono.
    */

    const visibleSteps =
        Math.ceil(
            window.innerHeight /
            pixelsPerStep
        ) + 4;


    const centerStep =
        Math.round(
            viewValue / STEP
        );


    const firstStep =
        centerStep -
        visibleSteps;


    const lastStep =
        centerStep +
        visibleSteps;


    for (
        let step = firstStep;
        step <= lastStep;
        step++
    ) {


        const tickValue =
            step * STEP;


        if (
            tickValue < MIN_VALUE ||
            tickValue > MAX_VALUE
        ) {

            continue;

        }


        /*
           Posizione della tacca
           rispetto al centro.
        */

        const y =
            viewY -
            (
                tickValue -
                viewValue
            ) *
            pixelsPerEuro;


        /*
           TACCA
        */

        const tick =
            document.createElement(
                "div"
            );


        if (
            tickValue === 0
        ) {

            tick.className =
                "tick zero";

        }

        else if (
            Math.abs(
                tickValue
            ) % 250 === 0
        ) {

            tick.className =
                "tick medium";

        }

        else {

            tick.className =
                "tick small";

        }


        tick.style.top =
            y + "px";


        scale.appendChild(
            tick
        );


        /*
           NOTA SALVATA
        */

        const savedNote =
            notes[
                String(tickValue)
            ];


        if (
            savedNote
        ) {

            const note =
                document.createElement(
                    "div"
                );


            note.className =
                "saved-note";


            note.style.top =
                y + "px";


            note.textContent =
                tickValue +
                " €  ·  " +
                savedNote;


            scale.appendChild(
                note
            );

        }

    }

}


/* ==================================================
   AGGIORNA VALORE ATTUALE
================================================== */

function updateCurrentValue() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    if (
        currentValue > 0
    ) {

        valueInput.value =
            "+" +
            currentValue;

    }

    else {

        valueInput.value =
            String(
                currentValue
            );

    }


    updateColors();

    loadNote();

    updateIndicator();

}


/* ==================================================
   SALTA A UN VALORE
================================================== */

function goToValue(newValue) {

    /*
       Salva la nota prima
       di cambiare posizione.
    */

    saveNote();


    currentValue =
        Math.max(
            MIN_VALUE,
            Math.min(
                MAX_VALUE,
                newValue
            )
        );


    /*
       Il punto visualizzato
       diventa quello attuale.
    */

    viewValue =
        currentValue;


    localStorage.setItem(
        VALUE_KEY,
        currentValue
    );


    updateCurrentValue();

    drawScale();

}


/* ==================================================
   INPUT VALORE
================================================== */

function readValue() {

    const text =
        valueInput.value.trim();


    if (
        text === ""
    ) {

        return;

    }


    const number =
        Number(
            text.replace(
                ",",
                "."
            )
        );


    if (
        !Number.isFinite(
            number
        )
    ) {

        valueInput.value =
            formatValue(
                currentValue
            );

        return;

    }


    goToValue(
        number
    );

}


/* ==================================================
   TASTIERA
================================================== */

valueInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            readValue();

            valueInput.blur();

        }

    }
);


valueInput.addEventListener(
    "blur",
    function() {

        readValue();

    }
);


/* ==================================================
   NOTA
================================================== */

noteInput.addEventListener(
    "blur",
    function() {

        saveNote();

    }
);


noteInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            saveNote();

            noteInput.blur();

        }

    }
);


/* ==================================================
   GESTIONE TOUCH
================================================== */

let isDragging = false;

let lastY = 0;

let pinchStartDistance = null;

let pinchStartZoom = null;


/*
   Con un dito:
   SCORRIMENTO.
*/

world.addEventListener(
    "touchstart",
    function(event) {

        /*
           Due dita = zoom.
        */

        if (
            event.touches.length === 2
        ) {

            isDragging = false;

            pinchStartDistance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );

            pinchStartZoom =
                pixelsPerStep;

            return;

        }


        /*
           Un dito.
        */

        if (
            event.touches.length === 1
        ) {

            /*
               Se tocchiamo l'input,
               non iniziare il drag.
            */

            if (
                event.target.closest(
                    "input"
                )
            ) {

                return;

            }


            isDragging = true;

            lastY =
                event.touches[0].clientY;

        }

    },
    {
        passive: false
    }
);


/*
   Movimento.
*/

world.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();


        /*
           =========================
           ZOOM
        =========================
        */

        if (
            event.touches.length === 2
        ) {

            const distance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            if (
                pinchStartDistance
            ) {

                const ratio =
                    distance /
                    pinchStartDistance;


                pixelsPerStep =
                    Math.max(
                        3,
                        Math.min(
                            25,
                            pinchStartZoom *
                            ratio
                        )
                    );


                localStorage.setItem(
                    ZOOM_KEY,
                    pixelsPerStep
                );


                drawScale();

            }


            return;

        }


        /*
           =========================
           SCROLL
        =========================
        */

        if (
            isDragging &&
            event.touches.length === 1
        ) {

            const y =
                event.touches[0].clientY;


            const delta =
                y -
                lastY;


            /*
               Se trascini verso l'alto,
               vai verso valori maggiori.
            */

            const pixelsPerEuro =
                pixelsPerStep /
                STEP;


            viewValue -=
                delta /
                pixelsPerEuro;


            viewValue =
                Math.max(
                    MIN_VALUE,
                    Math.min(
                        MAX_VALUE,
                        viewValue
                    )
                );


            lastY =
                y;


            drawScale();

        }

    },
    {
        passive: false
    }
);


/*
   Fine touch.
*/

world.addEventListener(
    "touchend",
    function(event) {

        if (
            event.touches.length < 2
        ) {

            pinchStartDistance =
                null;

            pinchStartZoom =
                null;

        }


        if (
            event.touches.length === 0
        ) {

            isDragging = false;

        }

    }
);


/* ==================================================
   DISTANZA TRA DUE DITA
================================================== */

function getDistance(
    touch1,
    touch2
) {

    const dx =
        touch1.clientX -
        touch2.clientX;

    const dy =
        touch1.clientY -
        touch2.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* ==================================================
   AVVIO
================================================== */

updateCurrentValue();

drawScale();

</script>

</body>

</html>
