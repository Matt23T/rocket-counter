<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    viewport-fit=cover,
    user-scalable=no"
>

<meta name="theme-color" content="#000000">

<title>Rocket</title>


<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;

    touch-action: none;
}


.app {

    position: relative;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   AREA DELLA SCALA
===================================================== */

#world {

    position: absolute;

    inset: 0;

    overflow: hidden;

    touch-action: none;
}


/*
   Questo elemento si muove verticalmente
   quando trasciniamo la scala.
*/

#scaleWorld {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    transform:
        translateY(0px);

    will-change: transform;

    pointer-events: none;
}


/* =====================================================
   LINEA CENTRALE
===================================================== */

.center-line {

    position: absolute;

    left: 50%;

    top: -50000px;

    width: 2px;

    height: 100000px;

    background: #4d4d4d;

    transform:
        translateX(-50%);
}


/* =====================================================
   TACCHETTE
===================================================== */

.tick {

    position: absolute;

    left: 50%;

    width: 7px;
    height: 1px;

    background: #666;

    transform:
        translateX(-50%);

    opacity: 0.28;
}


.tick.major {

    width: 12px;

    opacity: 0.42;
}


.tick.zero {

    width: 17px;

    opacity: 0.65;
}


/* =====================================================
   NOTE
===================================================== */

.floating-note {

    position: absolute;

    left:
        calc(50% + 18px);

    transform:
        translateY(-50%);

    display: flex;

    align-items: center;

    gap: 7px;

    white-space: nowrap;

    font-size: 12px;

    pointer-events: none;

    color: #777;

    transition:
        top 0.2s ease;
}


.floating-note-value {

    color: #999;

    font-weight: 500;
}


.floating-note-text {

    color: #666;

}


/* =====================================================
   INDICATORE
===================================================== */

#indicator {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 0;
    height: 0;

    z-index: 30;

    pointer-events: none;

    transition:
        top 0.2s ease;
}


/* =====================================================
   RAZZO
===================================================== */

.rocket {

    position: absolute;

    right: 12px;

    top: 50%;

    width: 60px;
    height: 30px;

    transform:
        translateY(-50%);

    transition:
        filter 0.2s ease;
}


/* =====================================================
   INFORMAZIONI VALORE
===================================================== */

.current-info {

    position: absolute;

    left: 18px;

    top: 50%;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    white-space: nowrap;

    pointer-events: auto;
}


.current-value {

    font-size: 21px;

    line-height: 26px;

    font-weight: 600;

    transition:
        color 0.2s ease;
}


.current-note {

    width: 170px;

    height: 25px;

    margin-top: 1px;

    padding: 0;

    border: none;

    outline: none;

    background: transparent;

    color: #888;

    font-size: 13px;
}


.current-note::placeholder {

    color: #444;
}


/* =====================================================
   COLORI
===================================================== */

.positive {

    color: #35d982;
}


.negative {

    color: #ff4d5a;
}


.neutral {

    color: #fff;
}


/* =====================================================
   RAZZO VERDE
===================================================== */

.rocket.positive {

    filter:
        brightness(0)
        saturate(100%)
        invert(72%)
        sepia(70%)
        saturate(600%)
        hue-rotate(95deg)
        brightness(95%);
}


/* =====================================================
   RAZZO ROSSO
===================================================== */

.rocket.negative {

    filter:
        brightness(0)
        saturate(100%)
        invert(42%)
        sepia(90%)
        saturate(1700%)
        hue-rotate(330deg)
        brightness(105%);
}


/* =====================================================
   CONTROLLI
===================================================== */

.controls {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            25px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 50;
}


.change-input {

    width: 175px;

    height: 50px;

    padding:
        0 14px;

    border:
        1px solid #3d3d3d;

    border-radius: 13px;

    background: #111;

    color: #fff;

    outline: none;

    text-align: center;

    font-size: 20px;

    font-weight: 600;
}


.change-input::placeholder {

    color: #4d4d4d;
}


.change-input:focus {

    border-color: #777;
}


.change-button {

    width: 55px;

    height: 50px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 600;
}


.change-button:active {

    transform:
        scale(0.96);
}


/* =====================================================
   RESET
===================================================== */

.reset-button {

    position: absolute;

    top:
        calc(
            15px +
            env(safe-area-inset-top)
        );

    right: 15px;

    height: 38px;

    padding:
        0 13px;

    border: none;

    border-radius: 11px;

    background: #181818;

    color: #999;

    font-size: 13px;

    z-index: 60;
}


/* =====================================================
   SCHERMATA VALORE INIZIALE
===================================================== */

.start-screen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background: #000;
}


.start-title {

    margin-bottom: 10px;

    font-size: 29px;

    font-weight: 600;
}


.start-subtitle {

    margin-bottom: 25px;

    color: #777;

    font-size: 14px;

    text-align: center;
}


.start-input {

    width: 220px;

    height: 55px;

    border:
        1px solid #444;

    border-radius: 14px;

    background: #111;

    color: #fff;

    outline: none;

    text-align: center;

    font-size: 23px;

    font-weight: 600;
}


.start-input::placeholder {

    color: #555;
}


.start-button {

    width: 220px;

    height: 50px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 600;
}


.hidden {

    display: none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (
    max-width: 480px
) {

    .current-value {

        font-size: 20px;

    }

    .floating-note {

        font-size: 11px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =================================================
         AREA SCORRIBILE
    ================================================== -->

    <div
        id="world"
    >


        <!-- =============================================
             MONDO DELLA SCALA
        ============================================== -->

        <div
            id="scaleWorld"
        >


            <!-- LINEA -->

            <div
                class="center-line"
            ></div>


            <!-- TACCHETTE -->

            <div
                id="ticks"
            ></div>


            <!-- NOTE -->

            <div
                id="notes"
            ></div>

        </div>


        <!-- =============================================
             RAZZO
        ============================================== -->

        <div
            id="indicator"
        >


            <svg
                id="rocket"
                class="rocket"
                viewBox="0 0 100 50"
                xmlns="http://www.w3.org/2000/svg"
            >

                <!-- Corpo -->

                <path
                    d="
                        M 10 25
                        C 28 10,
                          52 8,
                          78 25
                        C 52 42,
                          28 40,
                          10 25
                        Z
                    "
                    fill="white"
                />


                <!-- Punta -->

                <path
                    d="
                        M 65 13
                        C 82 15,
                          94 21,
                          99 25
                        C 94 29,
                          82 35,
                          65 37
                        Z
                    "
                    fill="white"
                />


                <!-- Finestrino -->

                <circle
                    cx="67"
                    cy="25"
                    r="5"
                    fill="black"
                />


                <!-- Ala superiore -->

                <path
                    d="
                        M 38 16
                        L 25 5
                        L 28 20
                        Z
                    "
                    fill="white"
                />


                <!-- Ala inferiore -->

                <path
                    d="
                        M 38 34
                        L 25 45
                        L 28 30
                        Z
                    "
                    fill="white"
                />


                <!-- Fiamma -->

                <path
                    d="
                        M 12 18
                        C 2 20,
                          2 30,
                          12 32
                        L 22 25
                        Z
                    "
                    fill="white"
                />

            </svg>


            <!-- =========================================
                 VALORE ATTUALE + NOTA
            ========================================== -->

            <div
                class="current-info"
            >

                <div
                    id="currentValue"
                    class="current-value"
                >
                    0 €
                </div>


                <input
                    id="currentNote"
                    class="current-note"
                    type="text"
                    maxlength="80"
                    autocomplete="off"
                    placeholder="Nota..."
                >

            </div>

        </div>

    </div>


    <!-- =================================================
         INPUT VARIAZIONE
    ================================================== -->

    <div
        class="controls"
    >

        <input
            id="changeInput"
            class="change-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="+ / - variazione"
        >


        <button
            id="changeButton"
            class="change-button"
        >
            OK
        </button>

    </div>


    <!-- =================================================
         RESET
    ================================================== -->

    <button
        id="resetButton"
        class="reset-button"
    >
        Reset
    </button>


    <!-- =================================================
         VALORE INIZIALE
    ================================================== -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div
            class="start-title"
        >
            Rocket
        </div>


        <div
            class="start-subtitle"
        >
            Inserisci il valore iniziale
        </div>


        <input
            id="startInput"
            class="start-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="Valore iniziale"
        >


        <button
            id="startButton"
            class="start-button"
        >
            OK
        </button>

    </div>

</div>


<script>

/* =====================================================
   MEMORIA
===================================================== */

const START_KEY =
    "rocket-start-value";

const CURRENT_KEY =
    "rocket-current-value";

const NOTES_KEY =
    "rocket-notes";


/* =====================================================
   ELEMENTI
===================================================== */

const world =
    document.getElementById(
        "world"
    );

const scaleWorld =
    document.getElementById(
        "scaleWorld"
    );

const ticks =
    document.getElementById(
        "ticks"
    );

const notesContainer =
    document.getElementById(
        "notes"
    );

const indicator =
    document.getElementById(
        "indicator"
    );

const rocket =
    document.getElementById(
        "rocket"
    );

const currentValueElement =
    document.getElementById(
        "currentValue"
    );

const currentNote =
    document.getElementById(
        "currentNote"
    );

const changeInput =
    document.getElementById(
        "changeInput"
    );

const changeButton =
    document.getElementById(
        "changeButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startInput =
    document.getElementById(
        "startInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );


/* =====================================================
   DATI
===================================================== */

let startValue =
    Number(
        localStorage.getItem(
            START_KEY
        )
    );

let currentValue =
    Number(
        localStorage.getItem(
            CURRENT_KEY
        )
    );


/* =====================================================
   NOTE
===================================================== */

let notes = {};

try {

    notes =
        JSON.parse(
            localStorage.getItem(
                NOTES_KEY
            )
        ) || {};

}
catch {

    notes = {};

}


/* =====================================================
   STATO SCROLL
===================================================== */


/*
   Quanto abbiamo trascinato
   verticalmente la scala.

   Il valore corrente NON cambia
   quando scorri.
*/

let scrollOffset = 0;


/*
   Posizione iniziale del dito.
*/

let dragStartY = 0;


/*
   Offset iniziale del drag.
*/

let dragStartOffset = 0;


/*
   Stato del trascinamento.
*/

let dragging = false;


/* =====================================================
   SCALA VISIVA
===================================================== */


/*
   Questa non è una conversione
   matematica precisa del valore.

   Serve solamente per visualizzare
   la scala e permettere di esplorarla.

   25 € = 18 pixel.
*/

const pixelsPer25 =
    18;


/* =====================================================
   FORMATTAZIONE EURO
===================================================== */

function formatValue(value) {

    const absolute =
        Math.abs(value)
        .toLocaleString(
            "it-IT"
        );


    if (
        value > 0
    ) {

        return "+" +
            absolute +
            " €";
    }


    if (
        value < 0
    ) {

        return "-" +
            absolute +
            " €";
    }


    return "0 €";
}


/* =====================================================
   COLORE
===================================================== */

function updateColor() {

    currentValueElement.classList.remove(
        "positive",
        "negative",
        "neutral"
    );

    rocket.classList.remove(
        "positive",
        "negative"
    );


    if (
        currentValue > 0
    ) {

        currentValueElement.classList.add(
            "positive"
        );

        rocket.classList.add(
            "positive"
        );

    }

    else if (
        currentValue < 0
    ) {

        currentValueElement.classList.add(
            "negative"
        );

        rocket.classList.add(
            "negative"
        );

    }

    else {

        currentValueElement.classList.add(
            "neutral"
        );

    }

}


/* =====================================================
   POSIZIONE DEL RAZZO
===================================================== */

function updateRocket() {

    /*
       Il razzo indica sempre
       il valore attuale.

       Sopra zero = sopra
       zero = centro
       sotto zero = sotto
    */

    const center =
        window.innerHeight / 2;


    /*
       Per evitare che numeri enormi
       facciano sparire il razzo,
       utilizziamo una scala logaritmica
       solamente per la posizione
       grafica.

       Il valore reale non viene
       assolutamente modificato.
    */

    let distance = 0;


    if (
        currentValue !== 0
    ) {

        distance =
            Math.log10(
                Math.abs(
                    currentValue
                ) + 1
            ) * 110;

    }


    let y;


    if (
        currentValue > 0
    ) {

        y =
            center -
            distance;

    }

    else if (
        currentValue < 0
    ) {

        y =
            center +
            distance;

    }

    else {

        y =
            center;

    }


    /*
       Limiti solamente dello schermo,
       non del valore.

       Se il valore è enorme,
       il razzo resta visibile.
    */

    y =
        Math.max(
            65,
            Math.min(
                window.innerHeight - 120,
                y
            )
        );


    indicator.style.top =
        y + "px";


    return y;
}


/* =====================================================
   TACCHETTE
===================================================== */

function drawTicks() {

    ticks.innerHTML = "";


    const center =
        window.innerHeight / 2;


    /*
       Creiamo molte tacche
       sopra e sotto.

       Le tacche sono solo
       riferimento visivo.
    */

    for (
        let i = -35;
        i <= 35;
        i++
    ) {

        const tick =
            document.createElement(
                "div"
            );


        tick.className =
            "tick";


        if (
            i === 0
        ) {

            tick.classList.add(
                "zero"
            );

        }

        else if (
            i % 5 === 0
        ) {

            tick.classList.add(
                "major"
            );

        }


        tick.style.top =
            (
                center +
                i * pixelsPer25
            ) + "px";


        ticks.appendChild(
            tick
        );

    }

}


/* =====================================================
   SALVA NOTA
===================================================== */

function saveCurrentNote() {

    const key =
        String(
            currentValue
        );


    const text =
        currentNote.value.trim();


    if (
        text === ""
    ) {

        delete notes[key];

    }

    else {

        notes[key] =
            text;

    }


    localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(
            notes
        )
    );


    drawNotes();

}


/* =====================================================
   CARICA NOTA
===================================================== */

function loadCurrentNote() {

    currentNote.value =
        notes[
            String(
                currentValue
            )
        ] || "";

}


/* =====================================================
   POSIZIONE DELLE NOTE
===================================================== */

function drawNotes() {

    notesContainer.innerHTML = "";


    const entries =
        Object.entries(
            notes
        )
        .map(
            ([value, text]) => ({
                value:
                    Number(value),

                text:
                    text
            })
        )
        .filter(
            item =>
                Number.isFinite(
                    item.value
                )
        );


    /*
       IMPORTANTE:

       Ordine numerico vero.

       -3500
       -3000
       -2000
       -500
       0
       500
       2000
    */

    entries.sort(
        (a, b) =>
            a.value -
            b.value
    );


    /*
       Posizione del razzo
       rispetto allo schermo.
    */

    const rocketY =
        parseFloat(
            indicator.style.top
        ) ||
        window.innerHeight / 2;


    /*
       Separiamo le note
       usando il confronto
       NUMERICO.

       Se nota > attuale:
       sopra.

       Se nota < attuale:
       sotto.
    */

    const above =
        entries
        .filter(
            item =>
                item.value >
                currentValue
        )
        .sort(
            (a, b) =>
                a.value -
                b.value
        );


    const below =
        entries
        .filter(
            item =>
                item.value <
                currentValue
        )
        .sort(
            (a, b) =>
                b.value -
                a.value
        );


    /*
       Spazio visivo tra le note.

       Non dipende dalla differenza
       economica reale.
    */

    const spacing =
        38;


    /*
       NOTE SOPRA
    */

    above.forEach(
        (item, index) => {

            createNote(
                item,
                rocketY -
                spacing *
                (index + 1)
            );

        }
    );


    /*
       NOTE SOTTO
    */

    below.forEach(
        (item, index) => {

            createNote(
                item,
                rocketY +
                spacing *
                (index + 1)
            );

        }
    );


    /*
       Se una nota è esattamente
       al valore attuale,
       la mettiamo vicino al razzo.
    */

    entries
        .filter(
            item =>
                item.value ===
                currentValue
        )
        .forEach(
            item => {

                createNote(
                    item,
                    rocketY + 36
                );

            }
        );

}


/* =====================================================
   CREA NOTA
===================================================== */

function createNote(
    item,
    y
) {

    const note =
        document.createElement(
            "div"
        );


    note.className =
        "floating-note";


    note.style.top =
        y + "px";


    const number =
        document.createElement(
            "span"
        );


    number.className =
        "floating-note-value";


    number.textContent =
        formatValue(
            item.value
        );


    const text =
        document.createElement(
            "span"
        );


    text.className =
        "floating-note-text";


    text.textContent =
        item.text;


    note.appendChild(
        number
    );


    note.appendChild(
        text
    );


    notesContainer.appendChild(
        note
    );

}


/* =====================================================
   AGGIORNA VISUALIZZAZIONE
===================================================== */

function updateDisplay() {

    currentValueElement.textContent =
        formatValue(
            currentValue
        );


    updateColor();

    loadCurrentNote();

    updateRocket();

    drawTicks();

    drawNotes();


    localStorage.setItem(
        CURRENT_KEY,
        currentValue
    );

}


/* =====================================================
   IMPOSTA VALORE INIZIALE
===================================================== */

function setInitialValue() {

    const text =
        startInput.value.trim();


    if (
        text === ""
    ) {

        return;

    }


    const number =
        Number(
            text.replace(
                ",",
                "."
            )
        );


    if (
        !Number.isFinite(
            number
        )
    ) {

        return;

    }


    startValue =
        number;


    currentValue =
        number;


    localStorage.setItem(
        START_KEY,
        startValue
    );


    localStorage.setItem(
        CURRENT_KEY,
        currentValue
    );


    startScreen.classList.add(
        "hidden"
    );


    updateDisplay();

}


/* =====================================================
   APPLICA VARIAZIONE
===================================================== */

function applyChange() {

    const text =
        changeInput.value.trim();


    if (
        text === ""
    ) {

        return;

    }


    const change =
        Number(
            text.replace(
                ",",
                "."
            )
        );


    if (
        !Number.isFinite(
            change
        )
    ) {

        return;

    }


    /*
       Prima salviamo la nota
       della posizione attuale.
    */

    saveCurrentNote();


    /*
       QUESTA È LA LOGICA CENTRALE:

       valore precedente
       +
       variazione
       =
       nuovo valore
    */

    currentValue =
        currentValue +
        change;


    changeInput.value =
        "";


    /*
       Quando cambia il valore,
       il punto visualizzato torna
       sulla posizione del razzo.
    */

    scrollOffset =
        0;


    scaleWorld.style.transform =
        "translateY(0px)";


    updateDisplay();


    changeInput.focus();

}


/* =====================================================
   RESET
===================================================== */

function resetApp() {

    const confirmed =
        window.confirm(
            "Vuoi resettare tutto e inserire un nuovo valore iniziale?"
        );


    if (
        !confirmed
    ) {

        return;

    }


    localStorage.removeItem(
        START_KEY
    );

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        NOTES_KEY
    );


    startValue =
        NaN;


    currentValue =
        0;


    notes =
        {};


    currentNote.value =
        "";


    changeInput.value =
        "";


    startInput.value =
        "";


    scrollOffset =
        0;


    scaleWorld.style.transform =
        "translateY(0px)";


    startScreen.classList.remove(
        "hidden"
    );

}


/* =====================================================
   SCORRIMENTO
===================================================== */


/*
   Quando inizi a trascinare.
*/

world.addEventListener(
    "touchstart",
    function(event) {

        /*
           Non facciamo partire lo scroll
           se stai toccando un input.
        */

        if (
            event.target.closest(
                "input"
            )
        ) {

            return;

        }


        if (
            event.touches.length !== 1
        ) {

            return;

        }


        dragging =
            true;


        dragStartY =
            event.touches[0].clientY;


        dragStartOffset =
            scrollOffset;

    },
    {
        passive: false
    }
);


/*
   Movimento del dito.
*/

world.addEventListener(
    "touchmove",
    function(event) {

        if (
            !dragging
        ) {

            return;

        }


        if (
            event.touches.length !== 1
        ) {

            return;

        }


        event.preventDefault();


        const currentY =
            event.touches[0].clientY;


        const delta =
            currentY -
            dragStartY;


        /*
           Il dito verso il basso
           porta la scala verso il basso.

           Il dito verso l'alto
           porta la scala verso l'alto.
        */

        scrollOffset =
            dragStartOffset +
            delta;


        scaleWorld.style.transform =
            "translateY(" +
            scrollOffset +
            "px)";

    },
    {
        passive: false
    }
);


/*
   Fine trascinamento.
*/

world.addEventListener(
    "touchend",
    function() {

        dragging =
            false;

    }
);


world.addEventListener(
    "touchcancel",
    function() {

        dragging =
            false;

    }
);


/* =====================================================
   EVENTI INPUT
===================================================== */

startButton.addEventListener(
    "click",
    setInitialValue
);


startInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            setInitialValue();

        }

    }
);


changeButton.addEventListener(
    "click",
    applyChange
);


changeInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            applyChange();

        }

    }
);


currentNote.addEventListener(
    "blur",
    saveCurrentNote
);


currentNote.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            saveCurrentNote();

            currentNote.blur();

        }

    }
);


resetButton.addEventListener(
    "click",
    resetApp
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        updateDisplay();

    }
);


/* =====================================================
   AVVIO
===================================================== */

if (
    Number.isFinite(
        startValue
    )
) {

    startScreen.classList.add(
        "hidden"
    );


    if (
        !Number.isFinite(
            currentValue
        )
    ) {

        currentValue =
            startValue;

    }


    updateDisplay();

}

else {

    startScreen.classList.remove(
        "hidden"
    );

}

</script>

</body>
